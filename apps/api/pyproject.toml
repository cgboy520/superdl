[project]
name = "superdl-api"
version = "0.1.0"
description = "SuperDL GPU 算力租赁平台 — API 模块化单体"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.13",
    "bcrypt>=5.0,<6",
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "cryptography>=45.0",
    "kubernetes>=36.0.3",
    "wechatpayv3>=2.0.3",
    "alipay-sdk-python>=3.7.1160",
    "pyotp>=2.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "testcontainers[postgres]>=4.9",
    "import-linter>=2.3",
    "greenlet>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T20",
    "ARG", "PERF", "PIE",
    "PLC0415",
    "C901", "PLR0912", "PLR0915",
]
ignore = ["SIM108", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 14
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["I"]
"app/wiring.py" = ["PLC0415"]
"app/main.py" = ["PLC0415"]
"app/modules/billing/payment_channels/*" = ["PLC0415"]
"tests/*" = ["PLC0415", "ARG", "C901", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = ["real_k8s: 需真实集群（SUPERDL_TEST_KUBECONFIG 门控，CI kind job 使用）"]

[tool.coverage.run]
source = ["app"]
omit = ["app/export_openapi.py", "app/core/k8s/real.py"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_package = "app"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core 不依赖业务模块与 workers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.workers"]

[[tool.importlinter.contracts]]
name = "业务模块跨模块访问只经各模块的公开面(service/schemas;orchestrator 另开放 queries/transitions/statemachine/ports;认证依赖经 account.deps)"
type = "independence"
modules = [
    "app.modules.account",
    "app.modules.catalog",
    "app.modules.orchestrator",
    "app.modules.services",
    "app.modules.billing",
    "app.modules.metering",
    "app.modules.notify",
    "app.modules.nodes",
    "app.modules.adminapi",
    "app.modules.tickets",
    "app.modules.legal",
]
ignore_imports = [
    "app.modules.** -> app.modules.*.service",
    "app.modules.** -> app.modules.*.schemas",
    "app.modules.** -> app.modules.account.deps",
    "app.modules.** -> app.modules.account.deletion",
    "app.modules.** -> app.modules.orchestrator.queries",
    "app.modules.** -> app.modules.orchestrator.transitions",
    "app.modules.** -> app.modules.orchestrator.statemachine",
    "app.modules.** -> app.modules.orchestrator.ports",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "billing 不依赖 orchestrator.service(orchestrator.service 依赖 billing.service,反向即环)"
type = "forbidden"
source_modules = ["app.modules.billing"]
forbidden_modules = [
    "app.modules.orchestrator.service",
    "app.modules.orchestrator.disks",
    "app.modules.orchestrator.preempt",
    "app.modules.orchestrator.handlers",
    "app.modules.orchestrator.reconciler",
]
