[project]
name = "superdl-api"
version = "0.1.0"
description = "SuperDL GPU 算力租赁平台 — API 模块化单体"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.13",
    "bcrypt>=5.0,<6", # 5.x 起 72 字节上限抛 ValueError,主版本钉住防行为漂移
    "structlog>=26.1",
    "prometheus-client>=0.26",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "cryptography>=45.0",
    "kubernetes>=36.0.3",
    "wechatpayv3>=2.0.3",
    "alipay-sdk-python>=3.7.1160",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "import-linter>=2.3",
    "greenlet>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T20"]
# B008: FastAPI Depends() 在默认参数中是惯用法;RUF001/2/3: 中文注释里 ×、·等符号是有意使用
ignore = ["SIM108", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["I"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/__pycache__", ".venv", "alembic"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:testcontainers"]
markers = ["real_k8s: 需真实集群（SUPERDL_TEST_KUBECONFIG 门控，CI kind job 使用）"]

[tool.coverage.run]
source = ["app"]
# real.py 需真实集群,单测不覆盖;独立成行的文件级 pragma 对 coverage.py 无效,须走 omit
omit = ["app/export_openapi.py", "app/core/k8s/real.py"]
# SQLAlchemy async 在 greenlet 里跑同步核心:不声明 greenlet 并发会丢失 await 之后的行
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_package = "app"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "core 不依赖业务模块与 workers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.workers"]

[[tool.importlinter.contracts]]
name = "account 只经 service/schemas 访问其他模块"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "warn"
source_modules = ["app.modules.account"]
forbidden_modules = [
    "app.modules.catalog", "app.modules.orchestrator", "app.modules.billing", "app.modules.metering", "app.modules.notify", "app.modules.nodes", "app.modules.adminapi",
]
ignore_imports = [
    "app.modules.account.** -> app.modules.*.service",
    "app.modules.account.** -> app.modules.*.schemas",
    "app.modules.account.** -> app.modules.account.deps",
]

[[tool.importlinter.contracts]]
name = "catalog 只经 service/schemas 访问其他模块"
type = "forbidden"
