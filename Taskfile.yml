version: "3"

tasks:
  up:
    desc: 启动本地依赖（PG18 + mock 服务）
    cmds:
      - docker compose -f deploy/app/compose.yaml up -d

  down:
    cmds:
      - docker compose -f deploy/app/compose.yaml down

  api:
    desc: 启动 API（热重载）
    dir: apps/api
    cmds:
      - uv run uvicorn app.main:app --reload --port 8000

  worker:
    desc: 启动 outbox worker + 定时任务
    dir: apps/api
    cmds:
      - uv run python -m app.workers.main

  web:
    dir: apps/web
    cmds:
      - pnpm dev

  admin:
    dir: apps/admin
    cmds:
      - pnpm dev

  openapi:
    desc: 导出 openapi.json 并重新生成前端 client
    cmds:
      - cd apps/api && uv run python -m app.export_openapi
      - pnpm api-client

  check-api:
    desc: 后端全部质量闸门
    dir: apps/api
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run pyright
      - uv run lint-imports
      - uv run pytest

  check-fe:
    desc: 前端全部质量闸门
    cmds:
      - pnpm lint
      - pnpm typecheck
      - pnpm test
      - pnpm build

  check:
    desc: 全部质量闸门（CI 等价）
    cmds:
      - task: check-api
      - task: check-fe
