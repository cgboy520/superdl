# 用户控制台 SPA 托管(nginx.web.conf,web 镜像专用;管理端见 nginx.admin.conf)。
# 仅反代 /api/v1/(用户端 API):管理端 /api/admin/ 不在本面暴露,纵深防御
# (管理端 API 另有独立 JWT audience,本配置是第二层边界)。
# 前端 baseUrl 为同源 "";指纹资源长缓存,index.html 不缓存。
# 安全头见 security-headers.conf:逐 location include,不放 server 层
# (放 server 层会被下面带 add_header 的 location 整组丢弃;/api 由 API 自己下发)。
server {
    listen 8080;  # 非特权镜像,非 root 不可绑 80
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/v1/ {
        proxy_pass http://superdl-api.superdl.svc.cluster.local/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # 前端轮询是普通短请求(30~60s 间隔),60s 读超时不会截断;
        # 若将来引入 SSE/长轮询,须按流式接口上调 proxy_read_timeout。
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-web-csp.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-web-csp.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
