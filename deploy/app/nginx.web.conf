server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 网关路径上 HTTPRoute superdl-console-api(deploy/app/k8s/04-gateway.yaml)先于本站接走 /api/v1,
    # 这段只在 compose / dev 与网关未部署时生效
    location /api/v1/ {
        proxy_pass http://superdl-api.superdl.svc.cluster.local/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-web-csp.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-web-csp.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
