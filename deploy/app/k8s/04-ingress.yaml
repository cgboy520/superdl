# API/前端入口(TLS 由 cert-manager 泛域名证书,见 05-cert-manager.yaml)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superdl-api
  namespace: superdl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # 边缘层限流(单 IP,纵深防御;应用层固定窗口限流不变,见 core/ratelimit.py):
    # 正常用户单页 API 并发远低于此,只挡爆破/洪水。admin 面另有白名单,不在此列
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.superdl.example.com"]
      secretName: superdl-api-tls
  rules:
    - host: api.superdl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: superdl-api, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superdl-frontends
  namespace: superdl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["console.superdl.example.com"]
      secretName: superdl-frontends-tls
  rules:
    - host: console.superdl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: superdl-web, port: {name: http}}
---
# 管理端独立 Ingress:便于单独施加访问边界,不与用户端互相影响。
# 升级路径(已部署集群):admin host 从 superdl-frontends 挪到本对象,apply 时 ingress-nginx
# 按 host 重渲染,连接平滑;证书改用独立 superdl-admin-tls(首次 apply 触发一次新签发,
# 签发完成前 admin 域短暂回落默认证书,通常秒级;也可提前手动备好同名 secret 做到零窗口)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superdl-admin
  namespace: superdl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    # 管理端源 IP 白名单(默认启用):把 CIDR 改成办公网/跳板机出口
    # (多个用英文逗号分隔)。占位符必须替换——preflight.sh 会强制扫描
    # CHANGE_ME_OFFICE_CIDR,未替换不予放行;确需临时放开须走变更评审,
    # 长期仍建议叠加 VPN / 身份感知代理(如 oauth2-proxy)之一。
    nginx.ingress.kubernetes.io/whitelist-source-range: "CHANGE_ME_OFFICE_CIDR/32"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["admin.superdl.example.com"]
      # 独立 secret:与 superdl-frontends-tls 共用会让 ingress-shim 生成的两张
      # Certificate 抢同一个 secret(dnsNames 不同,互相覆盖抖动)
      secretName: superdl-admin-tls
  rules:
    - host: admin.superdl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: superdl-admin, port: {name: http}}
