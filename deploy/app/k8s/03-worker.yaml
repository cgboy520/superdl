# worker 组件部署:单 Pod 单 SA,outbox 任务类型与定时任务按组件分片
# (workers/components.py 为唯一事实源;SUPERDL_WORKER_COMPONENT 声明身份,非法值 fail-closed)。
#
# 组件矩阵(副本/权限按职责定;全部 app=superdl-worker 标签,NetworkPolicy 与 PodMonitor 不变):
#   core        2 副本  计费/通知/保洁       SA superdl-worker(零 K8s 权限)
#   tenant-mgr  2 副本  租户编排 instance.*  SA superdl-tenant-mgr
#   node-mgr    1 副本  cordon/巡检/注册收敛  SA superdl-node-mgr
#   prewarm     1 副本  镜像预热 Job         SA superdl-prewarm
#   disk-ops    1 副本  配额下发/擦除 Job    SA superdl-disk-ops
# 单副本组件按需直接加副本,无需改代码:巡检靠 advisory lock 单 leader,outbox 领取 SKIP LOCKED。
# liveness 用心跳文件 mtime(worker 循环每轮触碰,2 分钟未更新即重启)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: core}
spec:
  replicas: 2
  strategy:
    # 滚动期间新旧副本并存不会重复执行:定时任务由 PG advisory lock 保证单 leader,
    # outbox 领取走 SELECT ... FOR UPDATE SKIP LOCKED。
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: core}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: core}
    spec:
      serviceAccountName: superdl-worker   # core:纯 DB + 外部渠道,零 K8s 权限(01-rbac.yaml)
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台按配置中心的机器人凭据
      # 按指纹覆写(docs/reference/images.md);Harbor 项目 public 时缺它只是 kubelet 告警
      imagePullSecrets:
        - {name: superdl-registry-pull}
      # 优先级压过租户 Pod:节点资源紧张时不与租户同级被驱逐
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点统一锚点(full 档 RKE2 server / light 档 k3s server 经 server-config.yaml
        # 的 node-label 自动携带;自建 infra 节点打同款标签 + CriticalAddonsOnly taint)。
        # GPU 节点严禁打此标签。
        node-role.superdl.io/infra: "true"
      tolerations:
        # 必须与 nodeSelector 成对:server 带 CriticalAddonsOnly=true:NoExecute
        # (rke2/server-config.yaml node-taint),只钉标签不容忍污点 = Pod 永远 Pending
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开(对齐 02-api);小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: core}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: core}
      terminationGracePeriodSeconds: 660  # SIGTERM 后收尾当前 outbox 任务(执行超时上限 600s + 60s 余量)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # core:计费/通知/保洁——DB + 配置解密 + 短信渠道 + 支付渠道(对账/查单)
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
            - secretRef: {name: superdl-cloud}
            - secretRef: {name: superdl-payment}
          env:
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: core}
          ports:
            - {containerPort: 9000, name: metrics}  # PodMonitor 抓取(集群内,无 Ingress 暴露)
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          # requests==limits → Guaranteed:结算/巡检是计费要害,不得先被 evict
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker-tenant-mgr
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: tenant-mgr}
spec:
  replicas: 2  # 租户编排时延敏感(开机/关机链路),双副本保滚动与节点故障不停摆
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: tenant-mgr}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: tenant-mgr}
    spec:
      serviceAccountName: superdl-tenant-mgr   # 租户资源编排写权限(01-rbac.yaml)
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.superdl.io/infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: tenant-mgr}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: tenant-mgr}
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # tenant-mgr:租户编排——DB + 配置解密 + Harbor 机器人(拉取凭据托管到租户 ns)
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
            - secretRef: {name: superdl-registry}
          env:
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: tenant-mgr}
          ports:
            - {containerPort: 9000, name: metrics}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker-node-mgr
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: node-mgr}
spec:
  replicas: 1  # 巡检靠 advisory lock 单 leader,outbox 领取 SKIP LOCKED;需要时直接加副本
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: node-mgr}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: node-mgr}
    spec:
      serviceAccountName: superdl-node-mgr   # nodes patch(cordon/标签)+ 只读探测(01-rbac.yaml)
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.superdl.io/infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # node-mgr:cordon/巡检/注册收敛——DB + 配置解密(集群接入凭据)
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
          env:
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: node-mgr}
          ports:
            - {containerPort: 9000, name: metrics}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
