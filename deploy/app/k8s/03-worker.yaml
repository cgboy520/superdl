apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker-disk-ops
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: disk-ops}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: disk-ops}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: disk-ops}
    spec:
      serviceAccountName: superdl-disk-ops   # 配额下发/擦除 Job(01-rbac.yaml)
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.superdl.io/infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # disk-ops:配额下发/擦除——仅 DB + 指标;JuiceFS metaurl 不进 worker 进程,
            # 由配额 Job 按 key 引用 superdl-db(core/k8s/real.py set_disk_quota)
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-metrics}
          env:
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: disk-ops}
          ports:
            - {containerPort: 9000, name: metrics}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
