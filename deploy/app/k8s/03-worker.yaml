apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: core}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: core}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: core}
    spec:
      serviceAccountName: superdl-worker
      imagePullSecrets:
        - {name: superdl-registry-pull}
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: core}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-worker, superdl.io/component: core}
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
            - secretRef: {name: superdl-cloud}
            - secretRef: {name: superdl-payment}
          env:
            - {name: SUPERDL_PROCESS_ROLE, value: worker}
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: core}
          ports:
            - {containerPort: 9000, name: metrics}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: db-ca, mountPath: /etc/superdl/db-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: db-ca, configMap: {name: superdl-db-ca, optional: true}}
---
