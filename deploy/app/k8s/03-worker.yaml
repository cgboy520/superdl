# worker(outbox + 定时任务):2 副本高可用——节点故障/滚动发布时
# 结算与编排不停摆。liveness 用心跳文件 mtime(worker 循环每轮触碰,2 分钟未更新即重启)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-worker
  namespace: superdl
  labels: {app: superdl-worker}
spec:
  replicas: 2
  strategy:
    # RollingUpdate 安全:定时任务由 PG advisory lock 保证单 leader(同刻只有一副本执行),
    # outbox 领取走 SELECT ... FOR UPDATE SKIP LOCKED(多副本不重复领同一任务),
    # 滚动期间新旧副本并存不会重复执行。
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker}
  template:
    metadata:
      labels: {app: superdl-worker}
    spec:
      serviceAccountName: superdl-worker   # 编排写权限只在 worker(见 01-rbac.yaml)
      # GHCR 镜像包为私有时取消注释,并先按 ../secrets.example.yaml 建好 superdl-ghcr-pull;公开镜像无需此项
      # imagePullSecrets:
      #   - {name: superdl-ghcr-pull}
      # 平台组件与租户隔离:只落控制面/infra 节点,优先级压过租户 Pod,
      # 节点资源紧张时不与租户同级被驱逐。
      priorityClassName: system-cluster-critical
      nodeSelector:
        # full 档 RKE2 server / light 档 k3s server 自带该标签;自建 infra 节点改打
        # node-role.kubernetes.io/infra: "true" 并同步改此处。GPU 节点不得带此标签。
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        # 容忍控制面/infra 节点的 CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml node-taint)
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      terminationGracePeriodSeconds: 660  # SIGTERM 后收尾当前 outbox 任务(执行超时上限 600s + 60s 余量)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/OWNER/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-api-secrets}
          env:
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
          ports:
            - {containerPort: 9000, name: metrics}  # PodMonitor 抓取(集群内,无 Ingress 暴露)
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          # requests==limits → Guaranteed(同 02-api.yaml):结算/巡检是计费要害,不得先被 evict
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
