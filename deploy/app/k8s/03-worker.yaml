  name: superdl-worker-node-mgr
  namespace: superdl
  labels: {app: superdl-worker, superdl.io/component: node-mgr}
spec:
  replicas: 1  # 巡检靠 advisory lock 单 leader,outbox 领取 SKIP LOCKED;需要时直接加副本
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: superdl-worker, superdl.io/component: node-mgr}
  template:
    metadata:
      labels: {app: superdl-worker, superdl.io/component: node-mgr}
    spec:
      serviceAccountName: superdl-node-mgr   # nodes patch(cordon/标签)+ 只读探测(01-rbac.yaml)
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 见 02-api.yaml 同处注释:node-restriction.kubernetes.io/ 前缀 kubelet 不可自打
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # node-mgr:DB + 配置解密
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
          env:
            - {name: SUPERDL_PROCESS_ROLE, value: worker}   # 不挂 superdl-auth/superdl-edge,prod 校验按角色跳过那两项
            - {name: SUPERDL_WORKER_HEARTBEAT, value: /tmp/superdl-worker-heartbeat}
            - {name: SUPERDL_WORKER_COMPONENT, value: node-mgr}
          ports:
            - {containerPort: 9000, name: metrics}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/superdl-worker-heartbeat) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: db-ca, mountPath: /etc/superdl/db-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        # 库 CA(自签/私有 CA 时由运维建 ConfigMap superdl-db-ca;公共 CA 可缺省)
        - {name: db-ca, configMap: {name: superdl-db-ca, optional: true}}
