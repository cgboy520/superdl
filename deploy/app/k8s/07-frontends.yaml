# 用户控制台 + 管理控制台(nginx 静态托管,/api 反代集群内 API)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-web
  namespace: superdl
  labels: {app: superdl-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-web}
  template:
    metadata:
      labels: {app: superdl-web}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台按配置中心的机器人凭据
      # 按指纹覆写(docs/reference/images.md);Harbor 项目 public 时缺它只是 kubelet 告警
      imagePullSecrets:
        - {name: superdl-registry-pull}
      # 优先级压过租户 Pod:节点资源紧张时不与租户同级被驱逐
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点统一锚点(full 档 RKE2 server / light 档 k3s server 经 server-config.yaml
        # 的 node-label 自动携带;自建 infra 节点打同款标签 + CriticalAddonsOnly taint)。
        # GPU 节点严禁打此标签。
        node-role.superdl.io/infra: "true"
      tolerations:
        # 必须与 nodeSelector 成对:server 带 CriticalAddonsOnly=true:NoExecute
        # (rke2/server-config.yaml node-taint),只钉标签不容忍污点 = Pod 永远 Pending
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开(对齐 02-api);小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: CHANGE_IMAGE_PREFIX/superdl-web:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            # conf 走 envsubst 模板:只放行 ADMIN_EDGE_TOKEN(web 未引用,输出与原 conf 一致),
            # 防 $host/$request_id 等 nginx 变量被替换掉
            - {name: NGINX_ENVSUBST_FILTER, value: "ADMIN_EDGE_TOKEN"}
          ports:
            - {containerPort: 8080, name: http}
          # liveness 与 readiness 同探 /(nginx 静态首页,进程僵死即重启)
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-web
  namespace: superdl
spec:
  selector: {app: superdl-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-web
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-admin
  namespace: superdl
  labels: {app: superdl-admin}
spec:
  replicas: 2   # 与 web 对齐:单副本时节点维护即管理端中断(应急处理入口,可用性要求不低于用户端)
  selector:
    matchLabels: {app: superdl-admin}
  template:
    metadata:
      labels: {app: superdl-admin}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台按配置中心的机器人凭据
      # 按指纹覆写(docs/reference/images.md);Harbor 项目 public 时缺它只是 kubelet 告警
      imagePullSecrets:
        - {name: superdl-registry-pull}
      # 优先级压过租户 Pod:节点资源紧张时不与租户同级被驱逐
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点统一锚点(full 档 RKE2 server / light 档 k3s server 经 server-config.yaml
        # 的 node-label 自动携带;自建 infra 节点打同款标签 + CriticalAddonsOnly taint)。
        # GPU 节点严禁打此标签。
        node-role.superdl.io/infra: "true"
      tolerations:
        # 必须与 nodeSelector 成对:server 带 CriticalAddonsOnly=true:NoExecute
        # (rke2/server-config.yaml node-taint),只钉标签不容忍污点 = Pod 永远 Pending
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开(对齐 02-api);小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-admin}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-admin}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admin
          image: CHANGE_IMAGE_PREFIX/superdl-admin:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            # envsubst 只放行边缘密钥这一个变量(防 $host 等 nginx 变量被替换)
            - {name: NGINX_ENVSUBST_FILTER, value: "ADMIN_EDGE_TOKEN"}
            # 边缘共享密钥(edge_guard 双闸):按 key 引用而非 envFrom,整套 API Secret 不进 admin Pod
            - name: ADMIN_EDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: superdl-api-secrets, key: SUPERDL_ADMIN_EDGE_TOKEN}
          ports:
            - {containerPort: 8080, name: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  selector: {app: superdl-admin}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-admin}
