# 用户控制台 + 管理控制台(nginx 静态托管,/api 反代集群内 API)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-web
  namespace: superdl
  labels: {app: superdl-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-web}
  template:
    metadata:
      labels: {app: superdl-web}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台按配置中心的机器人凭据按指纹覆写
      # (docs/reference/images.md);项目 public 时 Secret 缺失只是 kubelet 告警,不影响拉取
      imagePullSecrets:
        - {name: superdl-registry-pull}
      # 平台组件与租户隔离:只落控制面/infra 节点,优先级压过租户 Pod。
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点统一走 infra 标签(P0-1:与 control-plane 角色解耦,平台组件不再
        # 绑死控制面)。full 档 RKE2 server / light 档 k3s server 经 server-config.yaml
        # node-label 自动携带;自建独立 infra 节点打同款标签 + CriticalAddonsOnly taint。
        # GPU 节点严禁打此标签。
        node-role.superdl.io/infra: "true"
      tolerations:
        # 容忍控制面/infra 节点的 CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml node-taint)
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开(对齐 02-api);小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: CHANGE_IMAGE_PREFIX/superdl-web:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-web
  namespace: superdl
spec:
  selector: {app: superdl-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
