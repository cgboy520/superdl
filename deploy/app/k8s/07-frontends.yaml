# 用户控制台 + 管理控制台(nginx 静态托管,/api 反代集群内 API)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-web
  namespace: superdl
  labels: {app: superdl-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-web}
  template:
    metadata:
      labels: {app: superdl-web}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # 拉取凭据 / 优先级 / 落点 / 容忍 / 摊开:见 02-api.yaml 同处注释
      imagePullSecrets:
        - {name: superdl-registry-pull}
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-web}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: CHANGE_IMAGE_PREFIX/superdl-web:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            # envsubst 只放行 ADMIN_EDGE_TOKEN(web 未引用),不替换 nginx 变量
            - {name: NGINX_ENVSUBST_FILTER, value: "ADMIN_EDGE_TOKEN"}
          ports:
            - {containerPort: 8080, name: http}
          # liveness 与 readiness 同探 /
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # 镜像 entrypoint 的 envsubst 把模板渲染到 /etc/nginx/conf.d/default.conf,只读根下必须可写
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-web
  namespace: superdl
spec:
  selector: {app: superdl-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-web
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-admin
  namespace: superdl
  labels: {app: superdl-admin}
spec:
  replicas: 2   # 与 web 对齐:管理端是应急处理入口,可用性要求不低于用户端
  selector:
    matchLabels: {app: superdl-admin}
  template:
    metadata:
      labels: {app: superdl-admin}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # 拉取凭据 / 优先级 / 落点 / 容忍 / 摊开:见 02-api.yaml 同处注释
      imagePullSecrets:
        - {name: superdl-registry-pull}
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-admin}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-admin}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admin
          image: CHANGE_IMAGE_PREFIX/superdl-admin:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            # envsubst 只放行边缘密钥这一个变量
            - {name: NGINX_ENVSUBST_FILTER, value: "ADMIN_EDGE_TOKEN"}
            # 边缘共享密钥(edge_guard):按 key 引用,其它 Secret 不进 admin Pod
            - name: ADMIN_EDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: superdl-edge, key: SUPERDL_ADMIN_EDGE_TOKEN}
          ports:
            - {containerPort: 8080, name: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # 镜像 entrypoint 的 envsubst 把模板渲染到 /etc/nginx/conf.d/default.conf,只读根下必须可写
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  selector: {app: superdl-admin}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-admin}
