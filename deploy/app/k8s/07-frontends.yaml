# 用户控制台 + 管理控制台(nginx 静态托管,/api 反代集群内 API)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-web
  namespace: superdl
  labels: {app: superdl-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-web}
  template:
    metadata:
      labels: {app: superdl-web}
    spec:
      automountServiceAccountToken: false   # 纯静态托管 + 反代,不访问 K8s API
      # GHCR 镜像包为私有时取消注释,并先按 ../secrets.example.yaml 建好 superdl-ghcr-pull;公开镜像无需此项
      # imagePullSecrets:
      #   - {name: superdl-ghcr-pull}
      # 平台组件与租户隔离:只落控制面/infra 节点,优先级压过租户 Pod。
      priorityClassName: system-cluster-critical
      nodeSelector:
        # full 档 RKE2 server / light 档 k3s server 自带该标签;自建 infra 节点改打
        # node-role.kubernetes.io/infra: "true" 并同步改此处。GPU 节点不得带此标签。
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        # 容忍控制面/infra 节点的 CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml node-taint)
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/OWNER/superdl-web:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-web
  namespace: superdl
spec:
  selector: {app: superdl-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
