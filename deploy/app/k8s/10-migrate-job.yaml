# 迁移 Job:每次发布前跑(generateName 不支持 apply,用带 tag 后缀的 name)。
# 顺序不可颠倒:create 本 Job → kubectl wait --for=condition=complete → 再滚动 api/worker。
apiVersion: batch/v1
kind: Job
metadata:
  name: superdl-migrate-CHANGE_TAG
  namespace: superdl
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: ghcr.io/OWNER/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-api-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
