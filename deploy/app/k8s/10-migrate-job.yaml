# 迁移 Job:每次发布前跑(name 带 tag 后缀)。顺序:create → kubectl wait --for=condition=complete → 滚动 api/worker
apiVersion: batch/v1
kind: Job
metadata:
  name: superdl-migrate-CHANGE_TAG
  namespace: superdl
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: superdl-migrate}   # NetworkPolicy(09)按此标签放行出向
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false   # 只连 PG,不访问 K8s API
      # Harbor 拉取凭据(见 02-api.yaml 同处注释)
      imagePullSecrets:
        - {name: superdl-registry-pull}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # 只拿 DB 域
            - secretRef: {name: superdl-db}
          env:
            # lock_timeout 3s / statement_timeout 60s;大数据量变更走分批小迁移
            - {name: PGOPTIONS, value: "-c lock_timeout=3s -c statement_timeout=60s"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
