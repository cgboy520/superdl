apiVersion: batch/v1
kind: Job
metadata:
  name: superdl-migrate-CHANGE_TAG
  namespace: superdl
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: superdl-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      imagePullSecrets:
        - {name: superdl-registry-pull}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-db-migrate}
          env:
            - {name: PGOPTIONS, value: "-c lock_timeout=3s -c statement_timeout=60s"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: db-ca, mountPath: /etc/superdl/db-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: db-ca, configMap: {name: superdl-db-ca, optional: true}}
