# API(serve 入口):2 副本 + PDB;迁移由 10-migrate-job.yaml 在发布前执行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-api}
  template:
    metadata:
      labels: {app: superdl-api}
    spec:
      serviceAccountName: superdl-api   # 只读身份(见 01-rbac.yaml;写权限全在 worker)
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台覆写(docs/reference/images.md)
      imagePullSecrets:
        - {name: superdl-registry-pull}
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点锚点:必须用 node-restriction.kubernetes.io/ 前缀(kubelet 不可自打),不许换成节点可自述的键;
        # 由 deploy/ansible/site.yml 装机后用管理凭据打;GPU 节点禁止打
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        # 与 nodeSelector 成对(server 带 CriticalAddonsOnly=true:NoExecute,rke2/server-config.yaml)
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG  # release.sh 替换前缀(Harbor 项目)与本次 tag
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: superdl-api-config}
            # 分域引用(消费矩阵见 secrets.example.yaml)
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-auth}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
            - secretRef: {name: superdl-edge}
            - secretRef: {name: superdl-cloud}
            - secretRef: {name: superdl-payment}
            - secretRef: {name: superdl-registry}
          ports:
            - {containerPort: 8000, name: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5   # /readyz 含 DB 探测:默认 1s 在 DB 抖动时易误判摘流;放宽到 5s,超时即失败摘流
            failureThreshold: 3
          lifecycle:
            # preStop 等 Endpoints 摘除传播后再退出
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # requests==limits(Guaranteed)
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-api
  namespace: superdl
spec:
  selector: {app: superdl-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-api
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-api}
