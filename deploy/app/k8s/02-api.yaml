# API(serve 入口):2 副本 + PDB;迁移由 10-migrate-job.yaml 在发布前执行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-api}
  template:
    metadata:
      labels: {app: superdl-api}
    spec:
      serviceAccountName: superdl-api   # 只读身份(见 01-rbac.yaml;写权限全在 worker)
      # GHCR 镜像包为私有时取消注释,并先按 ../secrets.example.yaml 建好 superdl-ghcr-pull;公开镜像无需此项
      # imagePullSecrets:
      #   - {name: superdl-ghcr-pull}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开;小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/OWNER/superdl-api:CHANGE_TAG  # 发布时替换为本次 tag
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-api-secrets}
          ports:
            - {containerPort: 8000, name: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          # requests==limits → Guaranteed:节点资源紧张时平台控制面与租户 Pod 同级,不先被 evict。
          # 内存取原 limits 值(eviction 看内存);CPU 可压缩,取请求与上限的中档。
          # 进一步的抢占保护(优先级压过租户)可再加 priorityClassName,需要时单独评估。
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-api
  namespace: superdl
spec:
  selector: {app: superdl-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-api
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-api}
