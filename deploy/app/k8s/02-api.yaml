# API(serve 入口):2 副本 + PDB;迁移由 10-migrate-job.yaml 在发布前执行。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-api}
  template:
    metadata:
      labels: {app: superdl-api}
    spec:
      serviceAccountName: superdl-api   # 只读身份(见 01-rbac.yaml;写权限全在 worker)
      # Harbor 拉取凭据:首装按 ../secrets.example.yaml 手建,之后由平台按配置中心的机器人凭据
      # 按指纹覆写(docs/reference/images.md);Harbor 项目 public 时缺它只是 kubelet 告警
      imagePullSecrets:
        - {name: superdl-registry-pull}
      # 优先级压过租户 Pod:节点资源紧张时不与租户同级被驱逐
      priorityClassName: system-cluster-critical
      nodeSelector:
        # 平台组件落点统一锚点(full 档 RKE2 server / light 档 k3s server 经 server-config.yaml
        # 的 node-label 自动携带;自建 infra 节点打同款标签 + CriticalAddonsOnly taint)。
        # GPU 节点严禁打此标签。
        node-role.superdl.io/infra: "true"
      tolerations:
        # 必须与 nodeSelector 成对:server 带 CriticalAddonsOnly=true:NoExecute
        # (rke2/server-config.yaml node-taint),只钉标签不容忍污点 = Pod 永远 Pending
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        # 2 副本尽量跨节点/跨可用区摊开;小集群不满足时仍可调度(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG  # release.sh 替换前缀(Harbor 项目)与本次 tag
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-api-secrets}
          ports:
            - {containerPort: 8000, name: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5   # /readyz 含 DB 探测:默认 1s 在 DB 抖动时易误判摘流;放宽到 5s,超时即失败摘流
            failureThreshold: 3
          lifecycle:
            # 滚动/缩容先摘流再退出:preStop 等 Endpoints 摘除传播到 Envoy Gateway/iptables,
            # 否则在途请求被 SIGTERM 直接掐断
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # requests==limits → Guaranteed:节点资源紧张时不先于租户 Pod 被 evict
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-api
  namespace: superdl
spec:
  selector: {app: superdl-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-api
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-api}
