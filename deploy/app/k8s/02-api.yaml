apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: superdl-api}
  template:
    metadata:
      labels: {app: superdl-api}
    spec:
      serviceAccountName: superdl-api
      imagePullSecrets:
        - {name: superdl-registry-pull}
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-restriction.kubernetes.io/superdl-infra: "true"
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: superdl-api}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: superdl-api}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: CHANGE_IMAGE_PREFIX/superdl-api:CHANGE_TAG
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: superdl-api-config}
            - secretRef: {name: superdl-db}
            - secretRef: {name: superdl-auth}
            - secretRef: {name: superdl-crypto}
            - secretRef: {name: superdl-metrics}
            - secretRef: {name: superdl-edge}
            - secretRef: {name: superdl-cloud}
            - secretRef: {name: superdl-payment}
            - secretRef: {name: superdl-registry}
          ports:
            - {containerPort: 8000, name: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: db-ca, mountPath: /etc/superdl/db-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: db-ca, configMap: {name: superdl-db-ca, optional: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  selector: {app: superdl-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superdl-api
  namespace: superdl
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: superdl-api}
