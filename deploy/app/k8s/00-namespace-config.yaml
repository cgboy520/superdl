apiVersion: v1
kind: Namespace
metadata:
  name: superdl
  labels:
    app.kubernetes.io/part-of: superdl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdl-api-config
  namespace: superdl
data:
  SUPERDL_ENVIRONMENT: "prod"
  # Deployment identity (required in prod; see docs/reference/platform-config.md « Deployment identity »).
  # Mainland-China deployments: SUPERDL_COMPLIANCE_PROFILE=cn, SUPERDL_PLATFORM_CURRENCY=CNY, SUPERDL_BILLING_TIMEZONE=Asia/Shanghai.
  # Currency and timezone are locked in the database on first boot.
  # Node installer source defaults to the official hosts; mainland-China deployments set
  # SUPERDL_NODE_INSTALL_MIRROR=cn (or the node_install_mirror platform setting).
  SUPERDL_COMPLIANCE_PROFILE: "none"
  SUPERDL_PLATFORM_CURRENCY: "USD"
  SUPERDL_BILLING_TIMEZONE: "UTC"
  SUPERDL_K8S_BACKEND: "real"
  SUPERDL_K8S_NAMESPACE_PREFIX: "tenant-"
  SUPERDL_PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  SUPERDL_LOG_LEVEL: "INFO"
  SUPERDL_PUBLIC_BASE_URL: "https://api.superdl.example.com"
  # User console origin; payment return URLs (`/billing?recharge=`) are built from it.
  SUPERDL_WEB_BASE_URL: "https://console.superdl.example.com"
  SUPERDL_JUPYTER_DOMAIN_SUFFIX: "app.superdl.example.com"
  SUPERDL_SERVICE_DOMAIN_SUFFIX: "svc.superdl.example.com"
  SUPERDL_CORS_ORIGINS: '["https://console.superdl.example.com","https://admin.superdl.example.com"]'
  SUPERDL_ADMIN_HOST: "admin.superdl.example.com"
  SUPERDL_REGISTRY_HOST: "harbor.superdl.example.com"
  SUPERDL_REGISTRY_PROJECT: "superdl"
  SUPERDL_CAPTCHA_ENABLED: "true"
  # turnstile (default; Cloudflare site key below, secret in superdl-cloud) or aliyun (scene ID / prefix below, AccessKey in superdl-cloud).
  SUPERDL_CAPTCHA_PROVIDER: "turnstile"
  SUPERDL_CAPTCHA_TURNSTILE_SITE_KEY: "CHANGE_ME"
  SUPERDL_REAL_NAME_ENABLED: "true"
  SUPERDL_REAL_NAME_REQUIRED_FOR_RECHARGE: "true"
  SUPERDL_ADMIN_MFA_ENABLED: "true"
  SUPERDL_CAPTCHA_SCENE_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_PREFIX: "CHANGE_ME"
  # Production must list everything: the Envoy data plane Pod range + every public upstream layer (CDN origin ranges, front proxy egress).
  # Miss any hop and the client IP the application sees is that hop's address: every per-IP rate limit bucket merges into one and audit_log.ip is all the same.
  # Change together with clientIPDetection.xForwardedFor.numTrustedHops in the 04-gateway.yaml ClientTrafficPolicy.
  FORWARDED_ALLOW_IPS: "10.42.0.0/16"
