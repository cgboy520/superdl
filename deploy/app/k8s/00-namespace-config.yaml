# 平台自身部署清单(kubectl apply -f deploy/app/k8s/ 按序应用)。
# Secret 只给模板:真实值经 CI/外部 Secret 管理注入,禁止提交明文。
apiVersion: v1
kind: Namespace
metadata:
  name: superdl
  labels:
    app.kubernetes.io/part-of: superdl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdl-api-config
  namespace: superdl
data:
  SUPERDL_ENVIRONMENT: "prod"
  SUPERDL_K8S_BACKEND: "real"
  SUPERDL_K8S_NAMESPACE_PREFIX: "tenant-"
  SUPERDL_PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # 域名按实际环境改(prod 配置校验会拒绝 example.com 占位)
  SUPERDL_PUBLIC_BASE_URL: "https://api.superdl.example.com"
  SUPERDL_SSH_HOST: "ssh1.superdl.example.com"
  SUPERDL_JUPYTER_DOMAIN_SUFFIX: "app.superdl.example.com"
  SUPERDL_CORS_ORIGINS: '["https://console.superdl.example.com","https://admin.superdl.example.com"]'
---
# Secret 模板:实际部署用
#   kubectl -n superdl create secret generic superdl-api-secrets \
#     --from-literal=SUPERDL_DATABASE_URL=... --from-literal=SUPERDL_JWT_SECRET=... ...
# 必填清单见 apps/api/app/core/config.py 的 prod 校验(启动 fail-fast 兜底)。
apiVersion: v1
kind: Secret
metadata:
  name: superdl-api-secrets
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://CHANGE_ME"
  SUPERDL_JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM_______"
  SUPERDL_ALERTMANAGER_TOKEN: "CHANGE_ME"
  SUPERDL_METRICS_TOKEN: "CHANGE_ME"
  SUPERDL_SMS_PROVIDER: "aliyun"
  SUPERDL_SMS_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_SMS_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_SMS_SIGN_NAME: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_VERIFY: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_NOTICE: "CHANGE_ME"
  SUPERDL_PAYMENT_MOCK: "false"
  SUPERDL_WECHAT_MCHID: "CHANGE_ME"
  SUPERDL_WECHAT_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_CERT_SERIAL_NO: "CHANGE_ME"
  SUPERDL_WECHAT_APIV3_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_APPID: "CHANGE_ME"
