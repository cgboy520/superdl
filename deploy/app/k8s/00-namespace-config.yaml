# 平台自身部署清单(kubectl apply -f deploy/app/k8s/ 按序应用)。
# Secret 不放在本目录:模板见 ../secrets.example.yaml,必须留在整目录 apply 路径之外,
# 否则日常 apply 会把生产凭据覆盖成占位值。真实值经外部 Secret 管理注入,禁止提交明文。
apiVersion: v1
kind: Namespace
metadata:
  name: superdl
  labels:
    app.kubernetes.io/part-of: superdl
    # PSA(安全P0-1):audit 先行观察 ≥2 周再转 enforce(与 tenant-* 的 audit/warn 档对齐)。
    # 平台 Deployment/Job 已全部 restricted 合规(runAsNonRoot + drop ALL + seccomp);
    # 已知偏差:worker 动态建的预热/磁盘配额 Job 未显式 runAsNonRoot,转 enforce 前须先补。
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdl-api-config
  namespace: superdl
data:
  SUPERDL_ENVIRONMENT: "prod"
  SUPERDL_K8S_BACKEND: "real"
  SUPERDL_K8S_NAMESPACE_PREFIX: "tenant-"
  SUPERDL_PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # 日志级别(structlog 与 stdlib 桥接同受此控,大写);日志经 Alloy 进 Loki(见 cluster/runbooks/loki-logging.md)
  SUPERDL_LOG_LEVEL: "INFO"
  # 域名按实际环境改(prod 配置校验会拒绝 example.com 占位)
  SUPERDL_PUBLIC_BASE_URL: "https://api.superdl.example.com"
  # 实例域名 <uuid>.<后缀>:Jupyter 与 SSH 共用(SSH 只靠 NodePort 区分实例,不设单独入口域名);
  # 泛域名解析到的地址须同时转发 80/443 与 NodePort 30000-32767
  SUPERDL_JUPYTER_DOMAIN_SUFFIX: "app.superdl.example.com"
  SUPERDL_CORS_ORIGINS: '["https://console.superdl.example.com","https://admin.superdl.example.com"]'
  # 管理端域:prod 下 /api/admin/* 只放行 Host 命中本项的请求(占位域名会被拒绝启动)
  SUPERDL_ADMIN_HOST: "admin.superdl.example.com"
  # 镜像仓库(Harbor):默认值层,推荐经 管理端·平台配置·镜像仓库 在线维护(机器人 Secret 加密落库);
  # 镜像来源白名单同在配置中心(image_allowed_registries),Harbor 地址自动放行
  SUPERDL_REGISTRY_HOST: "harbor.superdl.example.com"
  SUPERDL_REGISTRY_PROJECT: "superdl"
  # 人机校验(阿里云验证码 2.0):开关 captcha_enabled 可随时在 管理端·平台配置·安全策略 切换(此处只是默认值层);
  # scene_id / prefix 是客户端初始化用的公开信息,AccessKey 对在 ../secrets.example.yaml
  SUPERDL_CAPTCHA_ENABLED: "true"
  # 实名认证开关(默认值层;资质与凭据到位后在 管理端·平台配置·安全策略 打开,再视合规要求开「充值前强制实名」)
  SUPERDL_REAL_NAME_ENABLED: "false"
  # 管理端两步验证(TOTP)总开关(默认值层;关闭属高危运营动作,管理端·平台配置·安全策略可切换)
  SUPERDL_ADMIN_MFA_ENABLED: "true"
  SUPERDL_CAPTCHA_SCENE_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_PREFIX: "CHANGE_ME"
  # uvicorn 信任的前置代理来源(--proxy-headers 白名单,不在名单内则忽略 X-Forwarded-For)。
  # 默认值是 RKE2/k3s 的 Pod CIDR(请求经 Envoy Gateway 数据面 / 前端 nginx 转发,源地址是其 Pod IP)。
  # 集群 Pod CIDR 不同按实际改;禁止写 "*",等于允许伪造源 IP。
  FORWARDED_ALLOW_IPS: "10.42.0.0/16"
