apiVersion: v1
kind: Namespace
metadata:
  name: superdl
  labels:
    app.kubernetes.io/part-of: superdl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdl-api-config
  namespace: superdl
data:
  SUPERDL_ENVIRONMENT: "prod"
  SUPERDL_K8S_BACKEND: "real"
  SUPERDL_K8S_NAMESPACE_PREFIX: "tenant-"
  SUPERDL_PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  SUPERDL_LOG_LEVEL: "INFO"
  SUPERDL_PUBLIC_BASE_URL: "https://api.superdl.example.com"
  SUPERDL_JUPYTER_DOMAIN_SUFFIX: "app.superdl.example.com"
  SUPERDL_SERVICE_DOMAIN_SUFFIX: "svc.superdl.example.com"
  SUPERDL_CORS_ORIGINS: '["https://console.superdl.example.com","https://admin.superdl.example.com"]'
  SUPERDL_ADMIN_HOST: "admin.superdl.example.com"
  SUPERDL_REGISTRY_HOST: "harbor.superdl.example.com"
  SUPERDL_REGISTRY_PROJECT: "superdl"
  SUPERDL_CAPTCHA_ENABLED: "true"
  SUPERDL_REAL_NAME_ENABLED: "true"
  SUPERDL_REAL_NAME_REQUIRED_FOR_RECHARGE: "true"
  SUPERDL_ADMIN_MFA_ENABLED: "true"
  SUPERDL_CAPTCHA_SCENE_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_PREFIX: "CHANGE_ME"
  FORWARDED_ALLOW_IPS: "10.42.0.0/16"
