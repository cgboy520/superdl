# 平台自身部署清单(kubectl apply -f deploy/app/k8s/ 按序应用)。Secret 不放本目录,模板见 ../secrets.example.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: superdl
  labels:
    app.kubernetes.io/part-of: superdl
    # PSA enforce=restricted:预热/配额 Job runAsNonRoot(real.py platform_job_security_context);擦除 Job 在租户 ns(baseline)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdl-api-config
  namespace: superdl
data:
  SUPERDL_ENVIRONMENT: "prod"
  SUPERDL_K8S_BACKEND: "real"
  SUPERDL_K8S_NAMESPACE_PREFIX: "tenant-"
  SUPERDL_PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # 日志级别(大写);日志经 Alloy 进 Loki(cluster/runbooks/loki-logging.md)
  SUPERDL_LOG_LEVEL: "INFO"
  # 域名按实际环境改(prod 拒绝 example.com 占位)
  SUPERDL_PUBLIC_BASE_URL: "https://api.superdl.example.com"
  # 实例域名 <uuid>.<后缀>:Jupyter 与 SSH 共用;泛域名解析地址须转发 80/443 与 NodePort 30000-32767
  SUPERDL_JUPYTER_DOMAIN_SUFFIX: "app.superdl.example.com"
  # 服务型实例端点域 <slug>.<后缀>,必须与 jupyter 后缀不同(只有 svc listener 挂 extAuth);泛域名只需 80/443
  SUPERDL_SERVICE_DOMAIN_SUFFIX: "svc.superdl.example.com"
  SUPERDL_CORS_ORIGINS: '["https://console.superdl.example.com","https://admin.superdl.example.com"]'
  # 管理端域:prod 下 /api/admin/* 只放行 Host 命中本项的请求
  SUPERDL_ADMIN_HOST: "admin.superdl.example.com"
  # 镜像仓库(Harbor)默认值层,经 管理端·平台配置·镜像仓库 在线维护
  SUPERDL_REGISTRY_HOST: "harbor.superdl.example.com"
  SUPERDL_REGISTRY_PROJECT: "superdl"
  # 人机校验(阿里云验证码 2.0)默认值层;scene_id / prefix 为公开信息,AccessKey 在 ../secrets.example.yaml
  SUPERDL_CAPTCHA_ENABLED: "true"
  # 实名认证开关(prod 启动合规闸要求 real_name / captcha / 充值强制实名全开,env 层即开);凭据在 secrets.example.yaml 的 superdl-cloud
  SUPERDL_REAL_NAME_ENABLED: "true"
  # 充值前强制实名:未实名用户不能充值、不能开通实例;前置是实名已开
  SUPERDL_REAL_NAME_REQUIRED_FOR_RECHARGE: "true"
  # 管理端两步验证(TOTP)总开关(默认值层;管理端·平台配置·安全策略可切换)
  SUPERDL_ADMIN_MFA_ENABLED: "true"
  SUPERDL_CAPTCHA_SCENE_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_PREFIX: "CHANGE_ME"
  # uvicorn 信任的前置代理来源(--proxy-headers 白名单);默认 RKE2/k3s Pod CIDR,按实际改;禁止 "*"
  FORWARDED_ALLOW_IPS: "10.42.0.0/16"
