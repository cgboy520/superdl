# 平台 ServiceAccount 拆身份(最小权限):
#   superdl-api        → API(serve)进程:仅只读探测(集群页 test-connection / 容量预览)。
#                        业务规范:请求路径禁止直接改 K8s(一律走 outbox),故 API 无任何写权限。
#   superdl-worker     → core worker(计费/通知/保洁):纯 DB + 外部渠道,零 K8s 权限
#                        (无任何 ClusterRoleBinding;SA 仅为身份与 VAP 匹配锚点)。
#   superdl-tenant-mgr → tenant-mgr worker:租户资源全生命周期(instance.* + reconciler)。
#   superdl-node-mgr   → node-mgr worker:nodes:patch(cordon/巡检回写标签)+ nodes:delete(退役)+ 只读探测。
#   superdl-prewarm    → prewarm worker:superdl ns 预热 Job + nodes 只读(挑选拉取目标)。
#   superdl-disk-ops   → disk-ops worker:配额下发/擦除 Job(superdl + tenant ns)。
#
# tenant-* namespace 动态创建,写权限只能给 ClusterRole;实际可达面由
# deploy/cluster/admission/tenant-restrictions.yaml 的策略①③收窄,二者叠加才是最小权限。
# 两条 VAP 按 SA 前缀匹配,新组件 SA 自动纳入。
#
# ⚠ 铁律:**「不给 secrets 动词」并不等于「读不到 Secret」**。命名空间内的
# `pods:create`(tenant-mgr)与 `batch/jobs:create`(prewarm / disk-ops)都等价于该命名空间的
# `secrets:get` —— kubelet 代创建者解析 secretKeyRef / envFrom / secret 卷 / imagePullSecrets,
# 这条路径**不做任何 secrets 授权检查**,PSA restricted 也管不着(一个 sleep+env 的 Pod
# 完全合规)。挡住它的是 tenant-restrictions.yaml 的策略⑤⑥(superdl ns 内 Pod / Job 模板的
# Secret 引用白名单,含 job-controller 这条 Job 派生路径)。
# 结论:本文件的动词面 + 策略①③⑤⑥⑦ 才是完整边界;删任一条都会把平台主密钥重新暴露出来,
# 或(⑦)让一次「退役」把控制面节点从集群里摘掉。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-api
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-worker
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-tenant-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-node-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-prewarm
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-disk-ops
  namespace: superdl
---
# 只读面:与 app/core/k8s/real.py 的 probe_cluster / list_nodes 一一对应
# (VersionApi 走 /version 非资源路径,认证用户默认可读,无需授权)。
# 绑定 API(集群页探测/市场近似库存)与 node-mgr(巡检阶段 A 跑 probe_cluster)。
# 本角色无 secrets 权限:JUPYTER_TOKEN 在 per-instance Secret 里,pods get/list 不暴露租户凭据。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-cluster-readonly
rules:
  - apiGroups: [""]
    resources: ["pods"]   # 容量预览/节点已用份额聚合(list_pod_for_all_namespaces)
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    # 北向入口就绪面:probe_cluster 读 Gateway 的 status.conditions[Programmed]。
    # 只探控制器 Deployment 不够:listener 证书缺失/hostname 撞车时控制器一切正常
    resources: ["gateways"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-cluster-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: superdl-api
    namespace: superdl
  - kind: ServiceAccount
    name: superdl-node-mgr   # 巡检 probe_cluster 同用
    namespace: superdl
---
# tenant-mgr 编排面:租户 namespace/Pod/Service/HTTPRoute/NetworkPolicy/PVC/Quota/LimitRange
# 全生命周期(instance.* 任务 + reconciler)。patch 动词与 real.py 的 _create_or_patch
# 一一对应:既有对象的标签/规格演进靠 patch 收敛存量(409 → patch),缺 patch 动词时
# 403 直接传播,ensure_namespace 的收敛路径(修复漂移的 NetPol/Quota/LimitRange)永远跑不通。
# secrets 不在 ClusterRole:集群级 secrets:get 一旦随
# SA token 泄漏即可读全集群(平台主密钥/TLS/控制器凭据),故由编排器在建 tenant-*
# namespace 时同步下发同名 Role/RoleBinding(real.py _ensure_tenant_rbac_sync),
# secrets 权限收窄到本租户 ns 内。残留面:pods:list 仍全集群(reconciler 全量 LIST
# 需要),但平台侧敏感值恒走 secretKeyRef,Pod 规约只暴露 Secret 名,不含值。
# ⚠ 但 pods:create 本身就是「该 ns 内全部 Secret 的读权限」(见本文件头注释的铁律):
# tenant-mgr 能在 superdl ns 建 Pod(策略①放行 superdl),故 superdl-auth/superdl-crypto
# 的实际防线是策略⑤的 Secret 引用白名单,不是这里少给的 secrets 动词。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-tenant-mgr
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]   # patch:既有 ns 的 PSA/managed 标签收敛(real.py _ensure_namespace_sync)
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges"]
    # patch:SSH Service 端口漂移收敛(real.py _reconcile_ssh_service_conflict_sync)、
    # Quota/LimitRange 的收敛 patch;limitranges 不授 list/delete(平台从不删,
    # 存量清单用不上——最小化到 _ensure_quota_sync/_ensure_limit_range_sync 的真实调用面)
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    # 下发租户 ns 内的 secrets Role/RoleBinding;实际落点由 VAP 策略①钉死在
    # tenant-* 命名空间,create 无法按 resourceNames 收窄,故不授 get/list。
    # escalate(建/改 Role)与 bind(建 RoleBinding 引用它):apiserver 的提权防护不允许
    # 授出自身未持有的权限 —— tenant-mgr 正是故意不持有集群级 secrets,不授这两个
    # 动词则 _ensure_tenant_rbac_sync 恒 403(真集群上租户 ns 根本建不起来)。
    # 可滥用面由 VAP 封在 tenant-* 内(那里本就是 tenant-mgr 的全权域),拿不到平台 ns 的 secrets。
    resources: ["roles"]
    verbs: ["get", "create", "patch", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete", "patch"]   # patch:租户 NetPol 漂移收敛(real.py _ensure_default_netpol_sync)
  - apiGroups: ["gateway.networking.k8s.io"]
    # 租户 Jupyter 入口(每实例一条 HTTPRoute,建在租户 ns,挂平台 ns 的 Gateway)。
    # list 是 reconciler 孤儿端点清理要的全集群 LIST,不能只给 get
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-tenant-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-tenant-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-tenant-mgr
    namespace: superdl
---
# node-mgr:管理端 cordon/uncordon(经 outbox)+ 巡检回写型号标签 + 节点退役(node.decommission)。
# 字段级收窄(unschedulable + superdl.io/* 标签)由 VAP 策略③完成,RBAC 只能到资源粒度。
#
# delete 是本 SA 唯一不可逆的动词,且 nodes 是集群级资源(resourceNames 对 delete 同样无效),
# 所以它的收窄只能在准入层:VAP 策略⑦ 拒绝删除控制面 / infra 节点,平台只能退役 GPU 工作节点。
# 少了⑦,一个失陷的 node-mgr 可以删掉控制面节点对象 —— kubelet 会重新注册,但
# node-restriction.kubernetes.io/superdl-infra 标签**不会**跟着回来(NodeRestriction 正是禁止
# kubelet 自己打该前缀),于是 api/worker/前端/Envoy 数据面全部 Pending,直到有人用管理凭据
# 重新打标(deploy/ansible/site.yml 的那一步)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-node-mgr
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "delete"]   # delete 新增:节点退役
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-node-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-node-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-node-mgr
    namespace: superdl
---
# prewarm:superdl ns 的预热 Job 生命周期 + nodes 只读(prewarm_patrol 遍历节点算缺口)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-prewarm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-prewarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-prewarm
subjects:
  - kind: ServiceAccount
    name: superdl-prewarm
    namespace: superdl
---
# disk-ops:配额下发(superdl ns juicefs CLI Job)与数据盘擦除(tenant ns busybox Job)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-disk-ops
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-disk-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-disk-ops
subjects:
  - kind: ServiceAccount
    name: superdl-disk-ops
    namespace: superdl
---
# superdl ns 内的拉取凭据写权限(仅 prewarm 预热 Job 用;配额 Job 的 metaurl 由 kubelet
# 经 secretKeyRef 注入,磁盘 worker 自身不需要 secrets 权限)。
# get/patch 按 resourceNames 收窄到 superdl-registry-pull。
#
# create 保留但不可收窄:real.py _ensure_pull_secret_sync 是「读不到就建、读到就 patch」,
# 首装(或 Secret 被删)时必须能建出 superdl-registry-pull,去掉 create 会让预热链路
# 在 Harbor 机器人配好后仍恒 403。RBAC 的 create 不支持 resourceNames,收窄只能在准入层:
#   - 类型侧:策略①禁止平台 SA 建 kubernetes.io/service-account-token 类型的 Secret
#     ——否则 create 一个名叫 superdl-registry-pull 的 SA token Secret + 已有的 get 白名单,
#     就能把任意 SA 的长期令牌读出来;
#   - 引用侧:策略⑤⑥限定 Pod / Job 模板能引用哪些 Secret。
# 注意 create **不能**推出「读不到既有 Secret」:读既有 Secret 的路子是建 Pod/Job(见文件头)。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superdl-pull-secret
  namespace: superdl
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["superdl-registry-pull"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superdl-pull-secret
  namespace: superdl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: superdl-pull-secret
subjects:
  - kind: ServiceAccount
    name: superdl-prewarm
    namespace: superdl
