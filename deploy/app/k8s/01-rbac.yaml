# 平台 ServiceAccount 拆身份:
#   superdl-api        → API 进程:只读探测(集群页 test-connection / 容量预览),无写权限(K8s 写一律走 outbox)
#   superdl-worker     → core worker(计费/通知/保洁):零 K8s 权限,SA 仅为身份锚点
#   superdl-tenant-mgr → 租户资源全生命周期(instance.* + reconciler)
#   superdl-node-mgr   → nodes:patch(cordon/巡检回写标签)+ nodes:delete(退役)+ 只读探测
#   superdl-prewarm    → superdl ns 预热 Job + nodes 只读
#   superdl-disk-ops   → 配额下发/擦除 Job(superdl + tenant ns)+ PVC/PV 只读(取配额路径前缀)
#
# 写权限只能给 ClusterRole(tenant-* 动态创建),可达面由 deploy/cluster/admission/tenant-restrictions.yaml 收窄;
# ns 内 pods:create / batch/jobs:create 等价于该 ns 的 secrets:get,由策略⑤⑥ 兜。本文件动词面 + 策略①③⑤⑥⑦ 才是完整边界
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-api
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-worker
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-tenant-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-node-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-prewarm
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-disk-ops
  namespace: superdl
---
# 只读面:与 app/core/k8s/real.py 的 probe_cluster / list_nodes 一一对应;绑定 API 与 node-mgr
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-cluster-readonly
rules:
  - apiGroups: [""]
    resources: ["pods"]   # 容量预览(list_pod_for_all_namespaces)
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    # probe_cluster 读 Gateway 的 status.conditions[Programmed]
    resources: ["gateways"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-cluster-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: superdl-api
    namespace: superdl
  - kind: ServiceAccount
    name: superdl-node-mgr   # 巡检 probe_cluster 同用
    namespace: superdl
---
# tenant-mgr 编排面:租户 namespace/Pod/Service/HTTPRoute/NetworkPolicy/PVC/Quota/LimitRange 全生命周期。
# patch 动词与 real.py _create_or_patch 一一对应。secrets 不在 ClusterRole:由编排器建 tenant-* 时下发同名
# Role/RoleBinding(real.py _ensure_tenant_rbac_sync);superdl ns 内的 Secret 防线是策略⑤
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-tenant-mgr
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]   # patch:既有 ns 的 PSA/managed 标签收敛(real.py _ensure_namespace_sync)
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]   # reconciler 判 node_lost(orchestrator/reconciler._node_readiness)
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges"]
    # patch:SSH Service 端口漂移收敛(real.py _reconcile_ssh_service_conflict_sync)与 Quota/LimitRange 收敛
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    # 下发租户 ns 内的 secrets Role/RoleBinding(落点由 VAP 策略①钉在 tenant-*);
    # escalate/bind 必授(tenant-mgr 不持有集群级 secrets,授出 secrets Role 需要它们)
    resources: ["roles"]
    verbs: ["get", "create", "patch", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete", "patch"]   # patch:NetPol 漂移收敛(real.py _ensure_default_netpol_sync)
  - apiGroups: ["gateway.networking.k8s.io"]
    # 每实例一条 HTTPRoute(租户 ns);list 供 reconciler 孤儿端点清理
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-tenant-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-tenant-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-tenant-mgr
    namespace: superdl
---
# node-mgr:cordon/uncordon + 巡检回写标签 + 节点退役(node.decommission)。
# 字段级收窄由 VAP 策略③完成;delete 的对象白名单由 VAP 策略⑦完成
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-node-mgr
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "delete"]   # delete:节点退役(对象白名单由 VAP 策略⑦收窄)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-node-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-node-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-node-mgr
    namespace: superdl
---
# prewarm:superdl ns 预热 Job 生命周期 + nodes 只读
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-prewarm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-prewarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-prewarm
subjects:
  - kind: ServiceAccount
    name: superdl-prewarm
    namespace: superdl
---
# disk-ops:配额下发(superdl ns juicefs CLI Job)与数据盘擦除(tenant ns busybox Job)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-disk-ops
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # 配额 --path 的前缀取自租户共享 PVC 绑定的 PV 的 volumeAttributes.subPath
  # (app/core/k8s/real.py _juicefs_fs_base_sync 先读 PVC 拿 volumeName,再读 PV);只读
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  # 擦盘前判租户 ns 是否还在(real.py _wipe_disk_sync 的 NamespaceMissing 分支);只读
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-disk-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-disk-ops
subjects:
  - kind: ServiceAccount
    name: superdl-disk-ops
    namespace: superdl
---
# superdl ns 内拉取凭据写权限(仅 prewarm):get/patch 按 resourceNames 收窄到 superdl-registry-pull;
# create 不可收窄(real.py _ensure_pull_secret_sync 首装要建),由策略①(类型)与⑤⑥(引用)兜
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superdl-pull-secret
  namespace: superdl
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["superdl-registry-pull"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superdl-pull-secret
  namespace: superdl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: superdl-pull-secret
subjects:
  - kind: ServiceAccount
    name: superdl-prewarm
    namespace: superdl
