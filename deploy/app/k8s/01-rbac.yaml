# 平台 ServiceAccount 拆身份(最小权限,P1-18/安全P0-1):
#   superdl-api        → API(serve)进程:仅只读探测(集群页 test-connection / 容量预览)。
#                        业务规范:请求路径禁止直接改 K8s(一律走 outbox),故 API 无任何写权限。
#   superdl-worker     → core worker(计费/通知/保洁):纯 DB + 外部渠道,零 K8s 权限
#                        (无任何 ClusterRoleBinding;SA 仅为身份与 VAP 匹配锚点)。
#   superdl-tenant-mgr → tenant-mgr worker:租户资源全生命周期(instance.* + reconciler)。
#   superdl-node-mgr   → node-mgr worker:nodes:patch(cordon/巡检回写标签)+ 只读探测。
#   superdl-prewarm    → prewarm worker:superdl ns 预热 Job + nodes 只读(挑选拉取目标)。
#   superdl-disk-ops   → disk-ops worker:配额下发/擦除 Job(superdl + tenant ns)。
#
# 为何 pods/services 写权限是 ClusterRole 而非 RoleBinding:tenant-* namespace 是
# 首次开机时动态创建的,无法预先绑定 RoleBinding(预绑本身又需要更大的 RBAC 权限)。
# 收敛路线:deploy/cluster/admission/tenant-restrictions.yaml 的策略①(写操作范围钉死
# superdl/tenant-* + nodes)与策略③(node 字段级白名单)把 ClusterRole 的实际可达面
# 收窄到目标,二者叠加才是完整最小权限;两条 VAP 均按 SA 前缀匹配,新组件 SA 自动纳入。
#
# 升级路径(已部署集群):apply 本文件后删除旧聚合角色与绑定
#   kubectl delete clusterrolebinding superdl-orchestrator
#   kubectl delete clusterrole superdl-orchestrator
# 并按 03-worker.yaml 滚动各 worker Deployment(任务幂等可重入,reaper 回收在跑任务)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-api
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-worker
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-tenant-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-node-mgr
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-prewarm
  namespace: superdl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-disk-ops
  namespace: superdl
---
# 只读面:与 app/core/k8s/real.py 的 probe_cluster / available_gpus 一一对应
# (VersionApi 走 /version 非资源路径,认证用户默认可读,无需授权)。
# 绑定对象:API(集群页探测/市场近似库存)与 node-mgr(节点巡检阶段 A 跑 probe_cluster);
# tenant-mgr 的 reconciler 只需要下方编排面里的 pods/services 读,不再给宽读。
# 边界:pods get/list 不再暴露租户凭据——JUPYTER_TOKEN 已迁移到 per-instance Secret
# (secretKeyRef 引用,本角色无 secrets 权限);AUTHORIZED_KEYS 为公钥(非密)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-cluster-readonly
rules:
  - apiGroups: [""]
    resources: ["pods"]   # 容量预览/节点已用份额聚合(list_pod_for_all_namespaces)
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-cluster-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: superdl-api
    namespace: superdl
  - kind: ServiceAccount
    name: superdl-node-mgr   # 巡检 probe_cluster 同用
    namespace: superdl
---
# tenant-mgr 编排面:租户 namespace/Pod/Service/Ingress/NetworkPolicy/PVC/Quota/Secret
# 全生命周期(instance.* 任务 + reconciler;per-instance JUPYTER_TOKEN 走 Secret)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-tenant-mgr
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "resourcequotas"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]  # per-instance 敏感 env(JUPYTER_TOKEN)的创建/收敛/随实例删除
    verbs: ["get", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-tenant-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-tenant-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-tenant-mgr
    namespace: superdl
---
# node-mgr:管理端 cordon/uncordon(经 outbox)+ 巡检回写型号标签。
# 字段级收窄(unschedulable + superdl.io/* 标签)由 VAP 策略③完成,RBAC 只能到资源粒度。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-node-mgr
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-node-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-node-mgr
subjects:
  - kind: ServiceAccount
    name: superdl-node-mgr
    namespace: superdl
---
# prewarm:superdl ns 的预热 Job 生命周期 + nodes 只读(prewarm_patrol 遍历节点算缺口)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-prewarm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-prewarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-prewarm
subjects:
  - kind: ServiceAccount
    name: superdl-prewarm
    namespace: superdl
---
# disk-ops:配额下发(superdl ns juicefs CLI Job)与数据盘擦除(tenant ns busybox Job)。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-disk-ops
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-disk-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-disk-ops
subjects:
  - kind: ServiceAccount
    name: superdl-disk-ops
    namespace: superdl
