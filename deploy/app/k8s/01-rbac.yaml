# 平台 ServiceAccount:RealOrchestrator 所需最小权限
# (租户 namespace/Pod/Service/Ingress/NetworkPolicy/PVC 生命周期 + 节点只读)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdl-api
  namespace: superdl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: superdl-orchestrator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "resourcequotas"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]  # disk.wipe 擦除任务
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdl-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: superdl-orchestrator
subjects:
  - kind: ServiceAccount
    name: superdl-api
    namespace: superdl
