# cert-manager ClusterIssuer(cert-manager 本体经 helm 安装,见 deploy/cluster/helmfile.yaml.gotmpl)。
# Jupyter 泛域名(*.app.superdl.example.com)必须 DNS-01。
# solver = RFC2136 → acme-dns(P1-6,deploy/cluster/acme-dns.yaml):替代个人仓 alidns webhook,
# 凭据从「全域 RAM DNS」收窄为「仅 _acme-challenge 子域 TXT 的 acme-dns 账户」。
# 一次性公网委托与账户注册见 deploy/cluster/runbooks/acme-dns.md。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@superdl.example.com
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          rfc2136:
            nameserver: acme-dns.cert-manager.svc.cluster.local:53
            # acme-dns 账户(JSON:username/password/fulldomain/server),
            # 注册与建 secret 见 runbooks/acme-dns.md;preflight.sh 强制校验存在
            tsigSecretName: acme-dns-account
            tsigKeyName: acmedns.json
---
# 泛域名证书:Jupyter per-instance 子域共用一张
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superdl-jupyter-wildcard
  namespace: superdl
spec:
  secretName: superdl-jupyter-wildcard-tls
  issuerRef: {name: letsencrypt-dns, kind: ClusterIssuer}
  dnsNames:
    - "*.app.superdl.example.com"
