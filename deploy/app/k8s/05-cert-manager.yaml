# cert-manager ClusterIssuer(cert-manager 本体经 helm 安装,见 deploy/cluster/helmfile.yaml.gotmpl)。
# Jupyter 泛域名(*.app.superdl.example.com)必须 DNS-01。
# solver = cert-manager 内置 acmeDNS(deploy/cluster/acme-dns.yaml 的集群内 acme-dns 实例,经其 HTTP
# 注册/更新 API 写 _acme-challenge TXT;替代个人仓 alidns webhook):凭据从「全域 RAM DNS」收窄为
# 「仅能改自己子域 TXT 的 acme-dns 账户」。一次性公网委托与账户注册见 deploy/cluster/runbooks/acme-dns.md。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@superdl.example.com
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          acmeDNS:
            # 集群内 acme-dns 的注册/更新 API(ClusterIP,不出集群)
            host: http://acme-dns-api.cert-manager.svc.cluster.local:8080
            # 账户 JSON:以被验证的域为键(泛域名 *.app.<域> 的挑战名是 app.<域>),
            # 值含 username/password/fulldomain/subdomain/allowfrom;注册与建 secret 见 runbooks/acme-dns.md,
            # preflight.sh 强制校验存在
            accountSecretRef:
              name: acme-dns-account
              key: acmedns.json
---
# 三张平台域证书:显式声明,不再靠 Ingress 上的 cert-manager.io/cluster-issuer annotation
# (ingress-shim)自动生成。Gateway 侧的等价机制 gateway-shim 要求给 cert-manager 开
# --enable-gateway-api 特性开关,等于给证书链多挂一个「必须记得配、配错了到期才发现」的依赖;
# 三张证书写在这里读得见、diff 得出来,比省这几行划算。
# 04-gateway.yaml 的 certificateRefs 直接引这里产出的 Secret(同 ns,不需要 ReferenceGrant)。
#
# 首装顺序:先 apply 本文件、等三张 Certificate Ready(kubectl get certificate -n superdl),
# 再切 DNS 到 Gateway。未签发完时对应 listener 不 Programmed,该域 TLS 握手直接失败——
# 没有原 ingress-nginx default-ssl-certificate 那种兜底(泛域名证书只覆盖 *.app 子域)。
#
# 存量集群升级:原 ingress-shim 生成的同名 Certificate(superdl-*-tls)带指向 Ingress 的
# ownerReference,删 Ingress 时会被一并回收,但 Secret 不随之删除(未开
# --enable-certificate-owner-ref),下面三张接手同一个 secretName 时校验通过即不重新签发,
# 不消耗 Let's Encrypt 签发额度。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superdl-api
  namespace: superdl
spec:
  secretName: superdl-api-tls
  issuerRef: {name: letsencrypt-dns, kind: ClusterIssuer}
  dnsNames:
    - api.superdl.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superdl-frontends
  namespace: superdl
spec:
  secretName: superdl-frontends-tls
  issuerRef: {name: letsencrypt-dns, kind: ClusterIssuer}
  dnsNames:
    - console.superdl.example.com
---
# 管理端独立一张(不与 console 共用):访问边界、证书轮换、故障影响面都要能与用户端分开处理
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  secretName: superdl-admin-tls
  issuerRef: {name: letsencrypt-dns, kind: ClusterIssuer}
  dnsNames:
    - admin.superdl.example.com
---
# 泛域名证书:Jupyter per-instance 子域共用一张
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superdl-jupyter-wildcard
  namespace: superdl
spec:
  secretName: superdl-jupyter-wildcard-tls
  issuerRef: {name: letsencrypt-dns, kind: ClusterIssuer}
  dnsNames:
    - "*.app.superdl.example.com"
