# superdl 命名空间网络边界:入向默认拒绝 + 按服务放行;出向默认拒绝 + 按端点精确放行。
#
# 出向已收敛为具体放行:PG 5432 / 对象存储 443 / 支付·短信网关 443 / K8s API 6443
# (DNS 由 allow-dns-egress 统一放行)。CHANGE_ME_* 均为占位——apply 前必须替换为真实
# 端点(preflight.sh 有提示性检查),外部端点变更时同步改本文件并重新 apply。
# 网关类端点以域名给出(微信支付 api.mch.weixin.qq.com、支付宝 openapi.alipay.com、
# 短信服务商 API 域名等):apply 时解析为 CIDR 写入,域名 IP 漂移时同步更新。
#
# 入向已是精确放行。新增 Pod 必须补对应放行规则,否则双不通。
# light 档 k3s 默认自带 netpol 控制器(内嵌 kube-router),NetworkPolicy 会被执行,
# 无需依赖外层防火墙兜底(等效性核查见 cluster/runbooks/cluster-validation.md)。
# kubelet 探针来自节点 host,不受 NetworkPolicy 影响;DNS 由 allow-dns-egress 统一放行。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 全命名空间放行 DNS:CoreDNS 在 kube-system;没有它所有 Pod 域名解析全挂。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# 前端入向:仅 ingress-nginx 控制器转发来的外部流量。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-ingress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
---
# 前端出向:只做 /api 反代(见 ../nginx.web.conf / nginx.admin.conf),目标仅 superdl-api。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: superdl-api}
      ports:
        - {protocol: TCP, port: 8000}
---
# API 入向:ingress-nginx(外部 API 流量)、monitoring(Prometheus 抓 /metrics、
# Alertmanager 告警 webhook)、前端 nginx(/api 反代)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [superdl-web, superdl-admin]}
      ports:
        - {protocol: TCP, port: 8000}
---
# API 出向:PG / 对象存储 / 支付·短信网关 / K8s API(只读身份;发短信验证码、下单直连渠道)。
# K8s API 可能落在私网节点 IP 上(平台「集群接入」录入的 server https://<ip>:6443):
# 给宽 ipBlock 加 except 私网段会把它一起断掉,必须按真实 server IP 放行。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}       # 平台库地址(托管 PG / cnpg,resolve 后填 /32)
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}       # 对象存储 endpoint 网段(JuiceFS 后端/备份上传)
      ports:
        - {protocol: TCP, port: 443}
    - to:
        # 支付/短信网关域名(微信支付/支付宝/短信服务商)apply 时解析为 CIDR;漂移时同步更新
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_IP/32"}  # 租户集群 apiserver(「集群接入」server 地址)
      ports:
        - {protocol: TCP, port: 6443}
---
# worker 入向:仅 Prometheus(PodMonitor 直抓 Pod :9000,不走 Service)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9000}
---
# worker 出向:PG / 对象存储 / 支付·短信网关(查单、回调补单)/ K8s API(编排写)。
# 短信/支付网关域名同 api-egress 注释:apply 时解析为 CIDR,漂移时同步更新。
# preset(按需启用):平台若开 SMTP 发信,追加一条 465/587 到邮件服务商 CIDR 的规则。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}       # 平台库地址
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}       # 对象存储 endpoint 网段
      ports:
        - {protocol: TCP, port: 443}
    - to:
        # 支付/短信网关域名(微信支付/支付宝/短信服务商)apply 时解析为 CIDR;漂移时同步更新
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_IP/32"}  # 租户集群 apiserver(编排写)
      ports:
        - {protocol: TCP, port: 6443}
---
# 一次性 Job(迁移 / PG 备份 / 数据盘配额下发)出向:PG + 对象存储(备份上传);无入向。
# 标签在 10-migrate-job.yaml / 06-pg-backup.yaml 的 Pod 模板上;
# superdl-disk-quota 是 worker 创建的 JuiceFS CLI Job(core/k8s/real.py set_disk_quota),
# 其 PG 出向即 JuiceFS 元数据引擎。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-migrate, pg-backup, superdl-disk-quota]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}       # 平台库地址
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}       # 对象存储 endpoint 网段(备份上传)
      ports:
        - {protocol: TCP, port: 443}
