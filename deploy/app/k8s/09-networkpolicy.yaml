apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-ingress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: superdl-api}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [superdl-web, superdl-admin]}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_CIDR"}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_CIDR"}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-migrate, pg-backup]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
