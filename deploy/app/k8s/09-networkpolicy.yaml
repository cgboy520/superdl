apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: superdl
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-ingress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontends-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-web, superdl-admin]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: superdl-api}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [superdl-web, superdl-admin]}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-api}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_CIDR"}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_GATEWAY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_K8S_API_CIDR"}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
---
# tenant-mgr runs the Ceph CLI (subvolume management, storage patrol, organization storage
# checks): monitors (msgr2 3300 / msgr1 6789), managers, MDS and OSDs (6800-7300) of the external
# cluster's public network. Tenant mounts are made by the nodes' kernel client, outside any Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-mgr-ceph-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker, superdl.io/component: tenant-mgr}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_CEPH_PUBLIC_CIDR"}
      ports:
        - {protocol: TCP, port: 3300}
        - {protocol: TCP, port: 6789}
        - {protocol: TCP, port: 6800, endPort: 7300}
---
# image-ops pushes imported images to Harbor (the registry_host platform setting) and deletes them;
# change the port when Harbor listens elsewhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-ops-registry-egress
  namespace: superdl
spec:
  podSelector:
    matchLabels: {app: superdl-worker, superdl.io/component: image-ops}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_REGISTRY_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-egress
  namespace: superdl
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [superdl-migrate, pg-backup]}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: {cidr: "CHANGE_ME_PG_IP/32"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: "CHANGE_ME_OSS_CIDR"}
      ports:
        - {protocol: TCP, port: 443}
