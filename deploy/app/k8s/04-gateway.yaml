apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: superdl
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: superdl-proxy
    namespace: superdl
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: superdl-proxy
  namespace: superdl
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
        pod:
          nodeSelector:
            node-restriction.kubernetes.io/superdl-infra: "true"
          tolerations:
            - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
          priorityClassName: system-cluster-critical
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
  logging:
    level:
      default: warn
  shutdown:
    drainTimeout: 60s
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: superdl
  namespace: superdl
spec:
  gatewayClassName: superdl
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
    - name: api-https
      port: 443
      protocol: HTTPS
      hostname: api.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-api-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: console-https
      port: 443
      protocol: HTTPS
      hostname: console.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-frontends-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: admin-https
      port: 443
      protocol: HTTPS
      hostname: admin.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-admin-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: app-https
      port: 443
      protocol: HTTPS
      hostname: "*.app.superdl.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-jupyter-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
    - name: svc-https
      port: 443
      protocol: HTTPS
      hostname: "*.svc.superdl.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-svc-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-https-redirect
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: http}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - backendRefs:
        - {name: superdl-api, port: 80}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: superdl-edge-not-found
  namespace: superdl
spec:
  directResponse:
    statusCode: 404
    body:
      type: Inline
      inline: "not found"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api-edge-deny
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/admin}
        - path: {type: PathPrefix, value: /api/internal}
        - path: {type: PathPrefix, value: /metrics}
        - path: {type: Exact, value: /docs}
        - path: {type: Exact, value: /redoc}
        - path: {type: Exact, value: /openapi.json}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: superdl-edge-not-found
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api-webhooks
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/webhooks}
      backendRefs:
        - {name: superdl-api, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-console
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: console-https}
  rules:
    - backendRefs:
        - {name: superdl-web, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: admin-https}
  rules:
    - backendRefs:
        - {name: superdl-admin, port: 80}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-admin-allowlist
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-admin}
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs: ["192.0.2.0/24"]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-api-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-api}
  requestBuffer:
    limit: 1Mi
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
        - limit: {requests: 600, unit: Minute}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-api-webhooks
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-api-webhooks}
  requestBuffer:
    limit: 256Ki
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
        - limit: {requests: 600, unit: Minute}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-svc-extauth
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  extAuth:
    timeout: 1s
    statusOnError: 503
    failOpen: false
    headersToExtAuth: ["x-api-key"]
    http:
      backendRefs:
        - {name: superdl-api, port: 80}
      pathOverride: /api/internal/v1/endpoint-auth
      headersToBackend: ["x-superdl-endpoint", "x-superdl-key-id"]
      backendSettings:
        retry:
          numRetries: 1
          retryOn:
            triggers: ["connect-failure", "refused-stream", "reset"]
        circuitBreaker:
          maxConnections: 128
          maxPendingRequests: 128
        healthCheck:
          active:
            type: HTTP
            http: {path: /healthz}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-svc-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-app-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: app-https}
  rateLimit:
    local:
      rules:
        - limit: {requests: 100, unit: Second}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: superdl-gateway
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl}
  timeout:
    http:
      streamIdleTimeout: 1h
      requestHeadersReceivedTimeout: 10s
      requestReceivedTimeout: 60s
  connection:
    connectionLimit:
      value: 10000
