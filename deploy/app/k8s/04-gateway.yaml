# 北向唯一入口:Gateway API + Envoy Gateway(控制面与数据面由 helmfile 装在 envoy-gateway-system,见 deploy/cluster/)。
# 本文件:GatewayClass / 数据面参数 / 6 个监听器 / 5 条路由 / 7 条策略。TLS 证书见 05-cert-manager.yaml(同 ns,不需要 ReferenceGrant)。
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: superdl
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # 集群级对象,parametersRef 必须显式写 namespace(漏写不报错,EG 按默认参数起数据面)
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: superdl-proxy
    namespace: superdl
---
# Envoy 数据面部署参数(EG 控制面参数在 deploy/cluster/values/envoy-gateway.yaml)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: superdl-proxy
  namespace: superdl
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          # requests==limits(Guaranteed)。内存随 HTTPRoute 数量涨(5000 条约 1–2 GB),放量前按实测上调
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
        pod:
          # infra 标签由 deploy/ansible/site.yml 打在控制面节点上(kubelet 不可自打);GPU 节点禁止打此标签
          nodeSelector:
            node-restriction.kubernetes.io/superdl-infra: "true"
          tolerations:
            # 与 nodeSelector 成对:infra 节点带 CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml)
            - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
          priorityClassName: system-cluster-critical
          # labelSelector 只能用 EG 打的 owning-gateway-{name,namespace} 标签
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        # 必须 Local:管理端源 IP 白名单与每 IP 限流依赖真实源 IP
        externalTrafficPolicy: Local
  logging:
    # Envoy 自身日志(非访问日志)
    level:
      default: warn
  shutdown:
    # 与 02-api.yaml 的 preStop sleep 配对
    drainTimeout: 60s
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: superdl
  namespace: superdl
spec:
  gatewayClassName: superdl
  # listener name 即各策略的 sectionName,不许改(对不上时策略静默不生效)。改动后
  # `kubectl describe securitypolicy/backendtrafficpolicy/clienttrafficpolicy -n superdl` 确认 Accepted=True。
  # 平台三个 listener 必须写精确 hostname(精确优先于租户通配);租户 ns 的 httproutes 写权限只给 superdl-tenant-mgr(01-rbac.yaml)。
  listeners:
    # HTTP 只承载 301 跳转(superdl-https-redirect)
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
    # 三个平台域各一个 listener;首装顺序见 05-cert-manager.yaml
    - name: api-https
      port: 443
      protocol: HTTPS
      hostname: api.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-api-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: console-https
      port: 443
      protocol: HTTPS
      hostname: console.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-frontends-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: admin-https
      port: 443
      protocol: HTTPS
      hostname: admin.superdl.example.com
      tls:
        mode: Terminate
        # 管理端独立 secret
        certificateRefs:
          - {kind: Secret, name: superdl-admin-tls}
      allowedRoutes:
        namespaces: {from: Same}
    # 租户 Jupyter:HTTPRoute 建在租户 ns,跨 ns 挂载;selector = ensure_namespace 打的 superdl.io/managed=true
    # (core/k8s/real.py MANAGED_LABEL),等于全部租户 ns。不挂任何 SecurityPolicy(Jupyter 自带 token 鉴权)
    - name: app-https
      port: 443
      protocol: HTTPS
      hostname: "*.app.superdl.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-jupyter-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
    # 服务型实例端点(svc-<slug>.svc.<域>):挂 superdl-svc-extauth,每请求回调平台校验 API Key。
    # 不许与 app-https 合并(两者鉴权口径相反,策略按 listener 挂)
    - name: svc-https
      port: 443
      protocol: HTTPS
      hostname: "*.svc.superdl.example.com"
      tls:
        mode: Terminate
        # 独立泛域名证书,见 05-cert-manager.yaml
        certificateRefs:
          - {kind: Secret, name: superdl-svc-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
---
# HTTP→HTTPS 301。不写 hostnames = 命中 :80 上的一切 Host
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-https-redirect
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: http}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
# 以下三条路由不写 hostnames(listener 已按 sectionName 限定 Host)。backendRefs 的 port 只认端口号,三个 Service 都是 :80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - backendRefs:
        - {name: superdl-api, port: 80}
---
# 匿名支付回调独立路由:更严请求体上限;最长前缀优先,不吃 superdl-api 的策略,边缘限流在 superdl-api-webhooks 策略同款重写
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api-webhooks
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/webhooks}
      backendRefs:
        - {name: superdl-api, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-console
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: console-https}
  rules:
    - backendRefs:
        - {name: superdl-web, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: admin-https}
  rules:
    - backendRefs:
        - {name: superdl-admin, port: 80}
---
# 管理端源 IP 白名单:CIDR 改成办公网/跳板机出口,多个多写几条 clientCIDRs;preflight.sh 按占位网段扫描。
# 占位符必须是合法 CIDR(RFC 5737 的 192.0.2.0/24),不能写 CHANGE_ME_*(CRD 正则校验)。
# defaultAction: Deny 不许省;源 IP 真实性依赖 envoyService.externalTrafficPolicy: Local
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-admin-allowlist
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-admin}
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs: ["192.0.2.0/24"]   # ← 替换为办公网/跳板机出口 CIDR
---
# 边缘层限流(应用层固定窗口限流不变,见 core/ratelimit.py)。admin 面另有白名单,不在此列。
# type: Distinct 不许改(每源 IP 一桶;Exact = 全网一桶)。v1.9.0 的 local 限流支持 Distinct,升 EG 版本按源码复核。
# 两条规则各自成桶,同时生效 = 20/s 且 600/min。新增规则:不带 clientSelectors 的规则决定默认桶时间单位,其余规则单位须为其整数倍。
# Local 限流按 Envoy 实例本地计数,2 副本时全局上限约为配置值×2
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-api-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-api}
  # 请求体上限(超 1Mi → 413;ASGI 层另有流式上限,见 app/core/body_limit.py)。
  # 必须与限流同挂一个对象(EG 对同一 targetRef 的同类策略不合并)。requestBuffer 不能挂流式/升级流量
  requestBuffer:
    limit: 1Mi
  rateLimit:
    # 不写 spec.rateLimit.type(v1.9.0 已 Deprecated)
    local:
      rules:
        - limit: {requests: 20, unit: Second}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
        - limit: {requests: 600, unit: Minute}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
---
# 匿名支付回调:请求体上限 256Ki;边缘限流与 superdl-api-ratelimit 同款(应用层另有 120/min/IP,见 billing/webhooks_router.py)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-api-webhooks
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-api-webhooks}
  requestBuffer:
    limit: 256Ki
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
        - limit: {requests: 600, unit: Minute}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
---
# 服务型实例端点的网关鉴权:挂 svc-https listener,覆盖该 listener 上全部租户路由(含跨 ns,不需要 ReferenceGrant)。
# 字段取值按 Envoy Gateway v1.9.0 CRD schema 与源码(internal/xds/translator/extauth.go、internal/gatewayapi/securitypolicy.go),升版本按源码复核。
# 按路由挂 SecurityPolicy 是整份 SecurityFeatures 替换,会顶掉本策略的 extAuth;租户 ns 的 securitypolicies 写权限一律不开(01-rbac.yaml)。
# 鉴权服务 4xx 的状态码、响应体与响应头原样透传客户端(平台侧有测试守护)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-svc-extauth
  namespace: superdl
spec:
  targetRefs:
    # sectionName 即 listener 名,写错不报错;收工前按 status.ancestors[].conditions 确认 Accepted=True
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  extAuth:
    # 同步路径上的每请求超时(默认 10s)
    timeout: 1s
    # 鉴权服务超时/5xx 时的客户端状态码(默认 403)
    statusOnError: 503
    # 保持 false(true 时策略配置非法也整个绕过鉴权)
    failOpen: false
    # 默认只转发 :authority/:method/:path/content-length/authorization;Host 到平台侧是原始客户端 Host(平台从它取 slug)。
    # 不许加 x-forwarded-for(edge_guard 对 /api/internal 带 XFF 的请求一律 404)
    headersToExtAuth: ["x-api-key"]
    http:
      # 只能写 Service 引用(省略 namespace 即本 ns),必须带 port;09-networkpolicy.yaml 的 api-ingress 已放行 envoy-gateway-system → superdl-api:8000
      backendRefs:
        - {name: superdl-api, port: 80}
      # 用 pathOverride(静态整路径)不用 path(path_prefix,会拼接原始 path),两者互斥。
      # 平台侧该路由必须接受全部 HTTP 方法(鉴权请求沿用原始 :method)
      pathOverride: /api/internal/v1/endpoint-auth
      # 列出的头一定来自鉴权服务(顶掉客户端同名头),未列出的头原样透传;用户容器只能信任这两个头
      headersToBackend: ["x-superdl-endpoint", "x-superdl-key-id"]
      backendSettings:
        retry:
          # 只重试连接类瞬时故障 1 次,预算在上面的 1s timeout 内;不设 perRetry.timeout
          numRetries: 1
          retryOn:
            triggers: ["connect-failure", "refused-stream", "reset"]
        circuitBreaker:
          # 128 × 2 副本 = 256 并发在途;过载由 statusOnError 挡在门口
          maxConnections: 128
          maxPendingRequests: 128
        healthCheck:
          active:
            # 用 /healthz 不用 /readyz(/readyz 含 DB 探测);panicThreshold 保持默认 50%,不设 0
            type: HTTP
            http: {path: /healthz}
---
# 服务端点限流:挂 svc-https listener,20/s/端点(手工渲染,改值 = 改本清单重新下发)。
# 只写一条不带 clientSelectors 的默认桶规则(EG 按路由写入 typedPerFilterConfig,一端点一桶)。
# 不许加 sourceCIDR Distinct 规则(alwaysConsumeDefaultTokenBucket=false,会让默认桶失效);不写已废弃的 spec.rateLimit.type;
# 2 副本时单端点实际上限约 40/s
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-svc-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
---
# 租户 Jupyter 入口限流:挂 app-https listener,100/s/端点(JupyterLab 冷启动几百毫秒内几十个请求;WebSocket 只在升级时计一次)。
# 与 superdl-svc-ratelimit 同构:只写一条默认桶规则,不许加 sourceCIDR Distinct,同一 targetRef 不许挂第二条 BackendTrafficPolicy。
# 2 副本时单端点实际上限约 200/s;冷启动仍见 429 就上调本值
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-app-ratelimit
  namespace: superdl
spec:
  targetRefs:
    # sectionName 写错不报错;收工前按 status.ancestors[].conditions 确认 Accepted=True
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: app-https}
  rateLimit:
    local:
      rules:
        - limit: {requests: 100, unit: Second}
---
# 网关级超时与连接兜底:挂 Gateway(不带 sectionName)= 6 个 listener 全部生效
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: superdl-gateway
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl}
  timeout:
    http:
      # 必配(EG 默认 5 分钟会掐断 Jupyter WebSocket / SSE 长连接);1h 同时覆盖 LLM 推理的长 SSE 流
      streamIdleTimeout: 1h
      # slowloris 双闸:头部收齐时限 / 完整请求(含 body)收齐时限(响应开始即停表,不影响 SSE)
      requestHeadersReceivedTimeout: 10s
      requestReceivedTimeout: 60s
  connection:
    connectionLimit:
      # 每个 Envoy 实例的连接总量(非每源 IP)
      value: 10000
