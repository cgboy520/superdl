# 北向唯一入口:Gateway API + Envoy Gateway(替代 ingress-nginx —— 该项目 2026-03 退休,
# 最后版本 controller-v1.15.1,此后不再修任何 CVE,继续用等于长期背未修漏洞)。
# EG 控制面与 Envoy 数据面 Pod 都在 envoy-gateway-system(由 helmfile 装,见 deploy/cluster/),
# 本文件只描述「入口长什么样」:GatewayClass / 数据面参数 / 6 个监听器 / 4 条路由 / 5 条策略。
#
# 三条 nginx annotation 的去向(语义差异写在各对象旁,别当成无损平移):
#   limit-rps / limit-rpm      → BackendTrafficPolicy superdl-api-ratelimit(等价)
#   limit-connections          → ClientTrafficPolicy superdl-gateway(**不等价**,见该处)
#   whitelist-source-range     → SecurityPolicy superdl-admin-allowlist(等价)
# TLS 不再走 cert-manager 的 ingress-shim annotation,改为 05-cert-manager.yaml 里显式的
# Certificate;certificateRefs 与 Gateway 同 ns,不需要 ReferenceGrant。
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: superdl
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # 数据面部署参数挂在 GatewayClass 上(本 class 的所有 Gateway 共享)。GatewayClass 是集群级
  # 对象,parametersRef 因此必须显式给 namespace ——漏写不会让 apply 失败,EG 只是找不到
  # EnvoyProxy,照样把数据面拉起来,拉起来的却是一份默认参数(1 副本、无 nodeSelector、
  # 无资源上限)。症状是「配了没生效」,查 GatewayClass 的 status.conditions。
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: superdl-proxy
    namespace: superdl
---
# Envoy **数据面**的部署参数。与 deploy/cluster/values/envoy-gateway.yaml 的分工别搞混:
# 那边是 EG **控制面**(envoy-gateway Deployment)的副本与资源,这里是真正扛流量的 Envoy 的。
# 调错地方的症状同样是「改了没效果」。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: superdl-proxy
  namespace: superdl
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # 北向唯一入口(api/console/admin/租户 Jupyter 全走这里),单点重启不应断流
        replicas: 2
        container:
          # requests==limits 提 Guaranteed:节点资源紧张时不与租户 Pod 同级,避免先被驱逐。
          # 取值沿用原 ingress-nginx controller 档,入口峰值带宽/连接数实测后再调。
          #
          # 内存是本档位最需要实测的一项:我们是**一实例一条 HTTPRoute**(租户 ns 内,见
          # orchestrator),活跃实例多了就是几百上千条路由,全量 xDS 下发进每个 Envoy。
          # 独立基准显示 5000 条路由时部分数据面涨到 1–2 GB。light 档单机要么给足 memory
          # limit,要么对单机实例数设硬上限——这里 OOMKill 掉的是全站入口,不是单个租户。
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 500m, memory: 512Mi}
        pod:
          # 平台组件落点统一走 infra 标签(与 02-api.yaml / 03-worker.yaml / 07-frontends.yaml
          # 同锚点);GPU 节点严禁打此标签。
          nodeSelector:
            node-role.superdl.io/infra: "true"
          tolerations:
            # 必须与 nodeSelector 成对出现:full 档 RKE2 server 带
            # CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml node-taint),
            # 只钉 infra 标签不容忍污点 = Envoy Pod 永远 Pending = 全站无入口。
            - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
          # 与 API/worker 对齐:Guaranteed 只防同优先级驱逐,priorityClass 才保证资源
          # 紧张时先于租户 Pod 被保。原 ingress-nginx values 也是这个值。
          priorityClassName: system-cluster-critical
          # 2 副本尽量跨节点/跨可用区摊开;小集群不满足时仍可调度(ScheduleAnyway)。
          # labelSelector 必须命中 EG 生成的 Envoy Pod:那些 Pod 不带我们写的任何标签,
          # 只带 owning-gateway-{name,namespace};选错标签不报错,约束直接退化成空集
          # (等于没写),两个副本可能挤在同一节点上。
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: superdl
                  gateway.envoyproxy.io/owning-gateway-namespace: superdl
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        # 显式写死,虽然它就是 CRD 默认值:改成 Cluster 会多一跳 kube-proxy SNAT,
        # Envoy 看到的源 IP 变成节点 IP —— 管理端白名单会把全部流量算成同一个源、
        # 每 IP 限流会退化成全网一个桶,两条策略当场失效且不报错。
        # 这一行是下面 SecurityPolicy 与 BackendTrafficPolicy 成立的前提。
        externalTrafficPolicy: Local
  logging:
    # Envoy 自身日志(不是访问日志):warn 起步,排障时临时调 info/debug
    level:
      default: warn
  shutdown:
    # 滚动更新先排空在途连接再退出,与 02-api.yaml 的 preStop sleep 是同一件事的两端
    drainTimeout: 60s
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: superdl
  namespace: superdl
spec:
  gatewayClassName: superdl
  # listener 的 name 就是各策略的 sectionName,**锁死不许改**:
  # SecurityPolicy / BackendTrafficPolicy / ClientTrafficPolicy 靠它找挂载点,名字对不上
  # 不报错、apply 照样成功,只是策略静默不生效——白名单没了、限流没了,线上看不出异常。
  # 唯一线索在策略对象的 status.ancestors[].conditions 里,所以改动本段后必须
  # `kubectl describe securitypolicy/backendtrafficpolicy/clienttrafficpolicy -n superdl`
  # 确认 Accepted=True 再收工。
  #
  # 为什么不用一张 *.superdl.example.com 通配 listener 顶掉三个平台域:那会强制
  # api/console/admin 与租户域同根。现网清单允许它们落在互不相干的域名上,保留这个自由度。
  #
  # 反过来,租户域与平台域**共用一级域**(如租户 *.xiaocg.xyz + 平台 api.xiaocg.xyz)也是
  # 支持的形态:此时租户通配 listener 与三个平台 listener 的 hostname 有交集,靠「精确优先于
  # 通配」消歧(SNI 与 Host 都是这个规则),平台域不会被通配 listener 抢走。前提是平台三个
  # listener 必须写**精确 hostname**(现状如此),换成通配就真的分不开了。
  # 另注:HTTPRoute 只要 hostname 与 listener 有交集就能挂上,所以租户 ns 里若能任意建路由,
  # 是可以声明平台域名把流量劫走的 —— 挡住这条的是 RBAC:tenant-* ns 的 httproutes 写权限
  # 只给了 superdl-tenant-mgr 这一个 SA(01-rbac.yaml),租户本人没有任何 K8s 凭据。
  listeners:
    # HTTP:只承载 301 跳转(见 superdl-https-redirect),不直接对接任何后端
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
    # 三个平台域各一个 listener。证书未就绪时只有对应 listener 不 Programmed
    # (其它 listener 不受影响),表现为该域 TLS 握手失败;首装顺序见 05-cert-manager.yaml。
    - name: api-https
      port: 443
      protocol: HTTPS
      hostname: api.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-api-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: console-https
      port: 443
      protocol: HTTPS
      hostname: console.superdl.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-frontends-tls}
      allowedRoutes:
        namespaces: {from: Same}
    - name: admin-https
      port: 443
      protocol: HTTPS
      hostname: admin.superdl.example.com
      tls:
        mode: Terminate
        # 独立 secret(不与 console 共用):管理端的访问边界、证书轮换、故障影响面
        # 都要能与用户端分开处理
        certificateRefs:
          - {kind: Secret, name: superdl-admin-tls}
      allowedRoutes:
        namespaces: {from: Same}
    # 租户 Jupyter:每实例一条 HTTPRoute,落在租户自己的 ns 里(不在 superdl ns),
    # 所以这里必须放开跨 ns 挂载。selector 用 ensure_namespace 已经打好的
    # superdl.io/managed=true(core/k8s/real.py 的 MANAGED_LABEL,存量 ns 走 patch 收敛):
    # 平台自己的 superdl ns 没有这个标签,于是它精确等于「全部租户 ns,且仅租户 ns」。
    # 不为此新增标签——多一个标签就多一处可能忘记打的地方。
    # 泛域名证书顶掉了原 ingress-nginx 的 default-ssl-certificate 兜底,且更显式。
    - name: app-https
      port: 443
      protocol: HTTPS
      hostname: "*.app.superdl.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: superdl-jupyter-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
    # 服务型实例的对外端点(ep-<slug>.svc.<域>):与 app-https 同款跨 ns 授权(租户 ns 已带
    # MANAGED_LABEL),但两者的**鉴权口径相反**,分成两个 listener 就是为了这件事:
    #   app-https  不挂任何 SecurityPolicy → Jupyter 自己用 token 鉴权,网关不管
    #   svc-https  挂 superdl-svc-extauth   → 每个请求先回调平台校验 API Key
    # 若把服务端点并进 app-https 的通配域,就只能靠「按路由挂策略」区分,而按路由挂策略在
    # EG 里是**整份 SecurityFeatures 替换**(见 superdl-svc-extauth 注释里的 mergeType 一节),
    # 漏挂一条路由 = 那个端点彻底不鉴权且不报错。分 listener 是唯一 fail-closed 的分法。
    - name: svc-https
      port: 443
      protocol: HTTPS
      hostname: "*.svc.superdl.example.com"
      tls:
        mode: Terminate
        # 独立泛域名证书(不与 *.app 共用):两者的签发链路各要一个 acme-dns 账户与一条
        # CNAME 委托,合在一张证书里等于把两个入口的签发失败绑成一件事。见 05-cert-manager.yaml
        certificateRefs:
          - {kind: Secret, name: superdl-svc-wildcard-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {superdl.io/managed: "true"}
---
# HTTP→HTTPS 301:原 ingress-nginx 全局 ssl-redirect: "true" 的等价物。
# 不写 hostnames = 命中 :80 上的一切 Host(含租户 Jupyter 子域),与原全局开关同语义;
# 少了它,80 端口上的请求会直接 404,而不是跳到 https。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-https-redirect
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: http}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
# 以下三条路由都不写 hostnames:listener 已按 sectionName 限定了 Host,重复写等于把域名
# 散落到两处,改域名时漏一处就静默不通(路由 hostname 与 listener hostname 取交集,
# 交集为空 = 路由不生效且不报错)。backendRefs 的 port 只认端口号,不认 Service 端口名,
# 三个 Service 都是 :80 → targetPort http(见 02-api.yaml / 07-frontends.yaml)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-api
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: api-https}
  rules:
    - backendRefs:
        - {name: superdl-api, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-console
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: console-https}
  rules:
    - backendRefs:
        - {name: superdl-web, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: superdl-admin
  namespace: superdl
spec:
  parentRefs:
    - {name: superdl, sectionName: admin-https}
  rules:
    - backendRefs:
        - {name: superdl-admin, port: 80}
---
# 管理端源 IP 白名单(默认启用),原 nginx whitelist-source-range 的等价物。
# 把 CIDR 改成办公网/跳板机出口(多个就多写几条 clientCIDRs 元素)。
#
# 占位符为什么是 192.0.2.0/24 而不是 CHANGE_ME_*:clientCIDRs 在 CRD 里带 CIDR 正则,
# 非法字符串会被 apiserver 直接拒收 —— 而 `kubectl apply -f deploy/app/k8s/` 是逐对象应用,
# 结果是**只有这一个对象没建起来、其余全部生效**,管理端就此在无人察觉的情况下失去白名单。
# 192.0.2.0/24 是 RFC 5737 的文档专用网段,不存在任何真实主机:忘了替换时清单照样能 apply,
# 但管理端从任何地方都进不去(fail-closed,当场就会发现),而不是悄悄敞开。
# preflight.sh 按这个网段扫描,未替换不予放行;确需临时放开须走变更评审,
# 长期仍建议叠加 VPN / 身份感知代理(如 oauth2-proxy)之一。
#
# defaultAction: Deny 是「白名单」成立的前提:漏写它默认是 Allow,规则就从白名单退化成
# 一条毫无作用的显式放行。源 IP 的真实性依赖 envoyService.externalTrafficPolicy: Local(见上)。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-admin-allowlist
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-admin}
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs: ["192.0.2.0/24"]   # ← 替换为办公网/跳板机出口 CIDR
---
# 边缘层限流(纵深防御;应用层固定窗口限流不变,见 core/ratelimit.py)。
# 正常用户单页 API 并发远低于此,只挡爆破/洪水。admin 面另有白名单,不在此列。
#
# type: Distinct 是本对象的命门:它让 0.0.0.0/0 里**每个源 IP 各占一个桶**,等价于原
# nginx 的 limit-rps/limit-rpm(按 $binary_remote_addr 计)。写成默认的 Exact 会变成
# 全网共用一个桶——20 rps 全站合计,正常业务量就能把所有人一起限死。
#
# ⚠ 官方文档 tasks/traffic/local-rate-limit 至今写着「local 不支持 distinct 匹配」。
# 那句话对 v1.9.0 已过时:internal/xds/translator/local_ratelimit.go 的
# buildDistinctCIDRMatchRateLimitAction 会在 masked CIDR 描述符之外再加一个不带 value 的
# RemoteAddress 描述符,正是「每个源 IP 一个桶」。照文档把它改回 Exact = 静默丢掉每 IP 语义。
# 升 EG 版本时按源码复核这一条,别按文档改。
#
# 两条规则各自独立成桶(描述符 key 带 rule 序号),同时生效 = 20/s 且 600/min。
# 新增规则时注意 EG 的一条硬约束:**不带 clientSelectors 的那条规则决定默认桶的时间单位**,
# 其余规则的单位必须是它的整数倍,否则整条 policy 翻译失败(Accepted=False)。
# 当前两条都带 selector,默认桶退化为 uint32max/Second,任何单位都合法。
#
# Local 限流是每个 Envoy 实例本地计数,2 副本时全局实际上限约为配置值×副本数;
# 原 nginx 的 limit_req 共享内存区同样是每副本一份,所以这不是本次迁移引入的偏差。
# 想要严格全局需另部署 rate limit service + Redis,当前规模不值当。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-api-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: superdl-api}
  rateLimit:
    # 不写 spec.rateLimit.type:该字段在 v1.9.0 已标 Deprecated,直接给 local/global 即可
    # (两者可并存)。写了反而走 backward-compat 分支,只认这一种。
    local:
      rules:
        - limit: {requests: 20, unit: Second}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
        - limit: {requests: 600, unit: Minute}
          clientSelectors:
            - sourceCIDR: {value: 0.0.0.0/0, type: Distinct}
---
# 服务型实例端点的网关鉴权:到 *.svc.<域> 的每个请求先回调平台 API 校验 API Key,
# 用户容器不实现任何鉴权。**一条策略挂 svc-https listener** = 覆盖该 listener 上的全部租户
# 路由(含跨 ns 的),新端点上线不必再动网关清单。跨 ns 路由继承 listener 级策略**不需要
# ReferenceGrant**(策略作用于 EG 内部的路由 IR,不是跨 ns 对象引用);extAuth 的 backendRefs
# 指向同 ns 的 superdl-api,也不需要。app-https(Jupyter)不挂任何策略 → 天然不鉴权。
#
# 下面每个字段的取值都按 Envoy Gateway **v1.9.0 的 CRD schema 与上游源码核实过**(官方文档
# 在本仓已有前科:local 限流 distinct 那条文档至今是错的),复核入口:
#   helm pull oci://docker.io/envoyproxy/gateway-helm --version v1.9.0 --untar
#   → charts/crds/crds/generated/gateway.envoyproxy.io_securitypolicies.yaml 的 openAPIV3Schema
#   → 上游 internal/xds/translator/extauth.go、internal/gatewayapi/securitypolicy.go
# 升 EG 版本时按源码复核,别按文档改。
#
# ⚠ mergeType 与「整份替换」(已核实):CRD 里 mergeType 无默认值,description 原文
# 「If unset, no merging occurs, and only the most specific configuration takes effect」。
# 源码侧 listener 级策略的下发是
#   for _, r := range h.Routes { if r.Security != nil { continue }; r.Security = securityFeatures }
# 而 r.Security 是**整个** SecurityFeatures 结构(CORS/CSRF/JWT/OIDC/APIKeyAuth/BasicAuth/
# ExtAuth/Authorization 一起)。所以给某条租户 HTTPRoute 再挂一条哪怕**只写了 CORS** 的
# SecurityPolicy,也会把本策略的 extAuth 一并顶掉——那个端点当场变成无鉴权,且不报错。
# 本策略挂的是 listener,按 CRD 的 CEL 规则挂不了 mergeType(它只允许 xRoute 目标),
# 真正挡住这条的是 RBAC:租户 ns 里 superdl-tenant-mgr 只有 httproutes 写权限、没有
# securitypolicies(01-rbac.yaml),租户本人没有任何 K8s 凭据。**将来若给谁开了
# securitypolicies 写权限,这条豁免就没了。**
#
# ⚠ 拒绝响应原样透传(已核实,影响平台侧 401 响应体口径):鉴权服务返回 4xx 时,
# 响应体被原样回给客户端(ext_authz_http_impl.cc 的 toResponse 取 message->bodyAsString()),
# 状态码也原样;响应头方面 EG 从不设置 allowed_client_headers,Envoy 的默认是「除 :authority
# 外全部回给客户端」。**没有任何截断或过滤**。即平台 401 响应体与响应头里带什么,公网就看得到
# 什么——栈、内网主机名、Set-Cookie 都会漏出去(平台侧有专门一条测试守这件事)。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: superdl-svc-extauth
  namespace: superdl
spec:
  targetRefs:
    # sectionName 在 Gateway 上被解释为 listener 名(Gateway API 的 SectionName 语义)。
    # 写错不报错、apply 照样成功,只是策略静默不挂载 = 全部服务端点不鉴权。
    # 唯一线索在 status.ancestors[].conditions,收工前必须确认 Accepted=True。
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  extAuth:
    # 已核实:CRD 无 default,IR 层默认 10s(上游 internal/xds/translator/utils.go 的
    # defaultExtServiceRequestTimeout)。10s 挂在每个请求的同步路径上——平台 API 一慢,
    # 所有服务端点跟着卡满 10s 再 503。1s 足够覆盖「小表主键查询 + last_used_at 回写」。
    timeout: 1s
    # 已核实:不配时默认 **403**(CRD description「Defaults to 403 Forbidden」)。
    # 那个默认值会把「平台控制面挂了/超时了」伪装成「你的 Key 不对」,用户会去查一把好 Key。
    # 另:鉴权服务自己返回 5xx 也走这条(toResponse 里 5xx → errorResponse()),不透传,
    # 所以平台 API 的 500 到客户端是 503 —— 这正是我们想要的语义。
    statusOnError: 503
    # 已核实:CRD 里就是 default: false,显式写出来是因为它的语义比字面更狠 ——
    # description 原文「If set to true, the External Authorization will also be bypassed
    # if its configuration is invalid」:true 时**连策略配置非法都整个绕过鉴权**,
    # 一个手误就能让全部付费端点变成公开。宁可整片 503 也不裸奔。
    failOpen: false
    # 已核实:不写这行时,发给 HTTP 鉴权服务的**只有** :authority / :method / :path /
    # content-length / authorization 五个(CRD description 列的 Host/Method/Path/
    # Content-Length/Authorization;Envoy 侧 check_request_utils.cc 的 toRequestMatchers
    # 把这四个硬编码进匹配器)。`x-api-key` **不在**默认清单里 —— 漏配的现象是「用
    # Authorization 的客户端正常、用 X-API-Key 的一律 401」,极像平台只认一种写法。
    #
    # Host 到平台侧是**原样的客户端 Host**(Envoy 内部 key 是 :authority,HTTP/1.1 落地就是
    # Host:),不是 superdl-api 的地址 —— 平台从它取 slug(<slug>.svc.<域>)才成立。
    #
    # ⚠ 绝不能往这里加 x-forwarded-for:鉴权请求本身不带 XFF
    # (ext_authz_http_impl.cc 的 options.setSendXff(false)),而平台 edge_guard 对
    # /api/internal 带 XFF 的请求一律 404。加了它 = 每次鉴权都 404 = fail-close 下
    # 全部端点常态 503。
    headersToExtAuth: ["x-api-key"]
    http:
      # 集群内 FQDN 是 superdl-api.superdl.svc.cluster.local:80(Service 见 02-api.yaml,
      # :80 → targetPort http/8000)。这里只能写 Service 引用而不是 FQDN 字符串:CRD 的
      # backendRefs 是 Gateway API 的对象引用(Service/ServiceImport/Backend),
      # 省略 namespace 即取本策略所在 ns(superdl),Service 引用必须带 port。
      # 网络侧不需要额外放行:09-networkpolicy.yaml 的 api-ingress 已允许
      # envoy-gateway-system → superdl-api:8000,鉴权回调走的就是这条。
      backendRefs:
        - {name: superdl-api, port: 80}
      # ⚠ 已核实,与「path 是静态整路径」的直觉相反:`path` 是 Envoy 的 **path_prefix**
      # (extauth.go 的 `PathPrefix: http.Path`),原始请求 path 会被**拼在后面** ——
      # CRD description 原文:path=/auth 且原始 path=/hello 时,鉴权请求的 path 是
      # /auth/hello。用它就得在平台侧开一条 catch-all 路由,还会把客户端可控的 path
      # (连 query 一起)拼进平台内部 URL。
      # v1.9.0 新增的 `pathOverride`(extauth.go 的 `PathOverride`,对应 Envoy 1.39 的
      # HttpService.path_override)才是「静态整路径」:鉴权请求的 path 恒为下面这个值。
      # 鉴权决策只看 Host + Key、不看 path,丢掉原始 path 没有代价,所以用它 ——
      # 平台侧因此是**一条精确路由**,不是 catch-all。两者互斥(CRD CEL:only one of
      # path or pathOverride can be specified),别同时写。
      #
      # ⚠ 平台侧这条路由必须**接受全部 HTTP 方法**:鉴权请求沿用原始请求的 :method,
      # 客户端 POST 过来鉴权请求就是 POST。只注册 GET 会拿到 405,而 4xx 原样透传给
      # 客户端(见本对象顶部),表现为「调用方一 POST 就 405」。
      pathOverride: /api/internal/v1/endpoint-auth
      # 已核实是**覆盖语义**:映射到 Envoy 的 allowed_upstream_headers(extauth.go 的
      # AuthorizationResponse),proto 原文「Existing headers will be overridden」。
      # 即:列进来的头一定来自鉴权服务,客户端伪造的同名头会被顶掉;
      # **没列进来的头原样透传客户端值**,ext_authz 不做任何过滤。
      # 所以用户容器能信任的头有且只有这两个;将来平台想让容器再信任一个新头,
      # 必须**同时**加到这里,否则那个头是客户端可伪造的。
      headersToBackend: ["x-superdl-endpoint", "x-superdl-key-id"]
      # fail-close(failOpen: false)之下,唯一能提升可用性的手段就是让这条回调本身别抖。
      backendSettings:
        retry:
          # 默认 numRetries 是 2,且默认触发条件含 unavailable 与 retriable-status-codes(503)
          # (CRD description 原文)。平台 API **主动**返回 503 时重试毫无意义,只会在故障时
          # 把回调量放大 3 倍。这里收窄成「连接压根没建起来/被重置」这类瞬时故障
          # (典型场景:API 滚动更新的摘流窗口),次数压到 1 —— 整个重试预算还在上面
          # 那个 1s timeout 里面。
          numRetries: 1
          retryOn:
            triggers: ["connect-failure", "refused-stream", "reset"]
          # 刻意不设 perRetry.timeout:上面三个触发条件都是**快失败**,重试有的是预算;
          # 设了反而会把一次合法的 900ms 慢鉴权提前掐掉,而慢又不在触发条件里 = 直接 503。
        circuitBreaker:
          # 四个阈值默认都是 1024。两个 API 副本各 1 CPU,扛不住 1024 条并发鉴权连接;
          # 排队的结果是每条请求都先把 1s timeout 等满再统一 503。收到 128(× 2 个 Envoy
          # 副本 = 256 并发在途,按每次鉴权约 10ms 算仍有上万 rps 余量,不构成瓶颈),
          # 过载就在门口被 statusOnError 挡掉,而不是全网一起变慢。
          maxConnections: 128
          maxPendingRequests: 128
        healthCheck:
          active:
            # 用 /healthz 不用 /readyz:/readyz 含 DB 探测(02-api.yaml),DB 抖一下会让
            # **所有** API 端点同时被判不健康,而这不是「哪个 Pod 坏了」的信号。
            # 主动健康检查的价值是在 Endpoints 摘除传播到 Envoy 之前就把挂掉的副本踢开。
            # 不必担心「冷启动时一个健康副本都没有」:panicThreshold 默认 50%,
            # 不健康比例过半时 Envoy 直接无视健康状态打给全部副本(CRD description),
            # 首检完成前正好落在这个兜底里。**别把 panicThreshold 设成 0**(=关闭恐慌模式),
            # 那才会让冷启动窗口里全部端点 503。
            type: HTTP
            http: {path: /healthz}
---
# 服务端点限流:一条挂 svc-https listener,覆盖该 listener 上全部租户路由。
# 限额取策略参数 service_endpoint_rps 的默认值 20/s(平台侧 core/policies.py)。
#
# **桶按路由分是自动的,不需要额外 selector**(已核实):EG 把 local 限流写进**每条路由**的
# typedPerFilterConfig(上游 internal/xds/translator/local_ratelimit.go 的 patchRoute),
# Envoy 侧每条路由的 FilterConfig 各自持有一个 LocalRateLimiterImpl
# (local_ratelimit.h 的 FilterConfig)。一实例一条 HTTPRoute ⇒ 一个端点一个桶,端点之间不互挤。
#
# ⚠ 这里**刻意没有**照抄 superdl-api-ratelimit 的 `sourceCIDR: {type: Distinct}`(已核实):
# 不带 clientSelectors 的规则会成为**默认桶**,而 EG 下发时把 alwaysConsumeDefaultTokenBucket
# 钉死为 false(local_ratelimit.go),语义是「请求只要命中任一 descriptor 就不再消耗默认桶」。
# 一旦加一条 sourceCIDR Distinct 规则,每个请求都命中它,**默认桶一次都不会被消耗** ——
# 「每端点 20/s」当场失效,退化成「每端点每源 IP 20/s」,换 100 个 IP 就能打满用户容器
# 与鉴权回调。两种语义在 local 限流里只能二选一,这里要的是前者(护的是用户容器和平台
# 鉴权链路,不是护平台自身入口——那是 superdl-api-ratelimit 的活)。
#
# 与 superdl-api-ratelimit 相同的两条:不写已废弃的 spec.rateLimit.type;local 限流是每个
# Envoy 实例本地计数,2 副本时单端点全局实际上限约为 40/s。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: superdl-svc-ratelimit
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl, sectionName: svc-https}
  rateLimit:
    local:
      rules:
        - limit: {requests: 20, unit: Second}
---
# 网关级超时与连接兜底。挂 Gateway(不带 sectionName)= 对 6 个 listener 全部生效
# (含 svc-https:streamIdleTimeout 1h 同时覆盖了 LLM 推理那种长时间只出 token 的 SSE 流)。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: superdl-gateway
  namespace: superdl
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: superdl}
  timeout:
    http:
      # 必配项:EG 默认 5 分钟,会把 Jupyter 的 WebSocket 与 SSE 长连接按时掐断。
      # 症状是「用着用着内核就断了/页面提示重连」,极易被误诊成鉴权过期或网络抖动,
      # 排查成本远高于这一行。1h 覆盖正常交互空闲。
      streamIdleTimeout: 1h
  connection:
    connectionLimit:
      # 注意:这**不是**原 nginx limit-connections: 20 的等价物。那条是**每源 IP** 并发
      # 连接数,EG 没有对应原语;这里是**每个 Envoy 实例的连接总量**,照抄 20 会瞬间打死
      # 全站。所以改为设一个防内存耗尽的总量兜底,每 IP 维度的压制由上面的 RPS/RPM 承担。
      # 后人别把它当成等价迁移回调小。
      value: 10000
