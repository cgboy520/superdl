# 各清单镜像写 CHANGE_IMAGE_PREFIX/superdl-<name>:CHANGE_TAG 占位,由 scripts/release.sh 替换后 apply;禁止手改、禁止 latest。
# 10-migrate-job.yaml 不入 resources,由 release.sh 滚动前单独 create + wait
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace-config.yaml
  - 01-rbac.yaml
  - 02-api.yaml
  - 03-worker.yaml
  - 04-gateway.yaml
  - 05-cert-manager.yaml
  - 06-pg-backup.yaml
  - 07-frontends.yaml
  - 08-monitoring.yaml
  - 09-networkpolicy.yaml
