apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-daily
  namespace: superdl
spec:
  # spec.timeZone pins the schedule to UTC (unset, a CronJob follows the kube-controller-manager's
  # local zone). To run at a fixed local hour of the billing day, set it to the value of
  # SUPERDL_BILLING_TIMEZONE (IANA) and express the schedule in that zone.
  timeZone: Etc/UTC
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {app: pg-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node-restriction.kubernetes.io/superdl-infra: "true"
          tolerations:
            - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  set +x
                  umask 077
                  [ -n "${BACKUP_ENCRYPT_KEY:-}" ] || { echo "BACKUP_ENCRYPT_KEY is not configured" >&2; exit 1; }
                  # The pinned image must pass the runbook's toolchain gate; do not
                  # install packages at runtime or assume build-time gpg survives.
                  for tool in pg_dump gpg gpg-agent; do
                    command -v "$tool" >/dev/null || { echo "Required backup tool missing: $tool" >&2; exit 1; }
                  done
                  GNUPGHOME=$(mktemp -d /tmp/gnupg.XXXXXXXX)
                  export GNUPGHOME
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  dump="/backup/superdl-$ts.dump"
                  trap 'rm -f -- "$dump"' EXIT
                  # libpq accepts a connection string in PGDATABASE; never put
                  # the credential-bearing PGURL in pg_dump's process arguments.
                  PGDATABASE="$PGURL" pg_dump -Fc -f "$dump"
                  printf '%s\n' "$BACKUP_ENCRYPT_KEY" | gpg --batch --yes \
                    --pinentry-mode loopback --passphrase-fd 0 \
                    --symmetric --cipher-algo AES256 -o "$dump.gpg" "$dump"
                  rm -- "$dump"
                  echo "dump+encrypt done: superdl-$ts.dump.gpg"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
            - name: upload
              image: amazon/aws-cli:2.32.0@sha256:bb82c6ce5c78cd8aad48d0003ab097c858cda14f9ce389c2345c50cce0104efd
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  aws s3 cp /backup/ "s3://$S3_BUCKET/daily/" --recursive \
                    --exclude "*" --include "superdl-*.dump.gpg" --endpoint-url "$S3_ENDPOINT"
                  echo "upload done"
                  local_dump=$(ls -t /backup/superdl-*.dump.gpg | head -1)
                  key="daily/$(basename "$local_dump")"
                  mkdir -p /backup/verify
                  aws s3 cp "s3://$S3_BUCKET/$key" /backup/verify/roundtrip.dump.gpg \
                    --endpoint-url "$S3_ENDPOINT"
                  want=$(wc -c < "$local_dump")
                  got=$(wc -c < /backup/verify/roundtrip.dump.gpg)
                  [ "$want" = "$got" ] || {
                    echo "roundtrip size mismatch: s3=$got local=$want" >&2; exit 1; }
                  echo "roundtrip ok: $key ($got bytes)"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 512Mi}
          containers:
            - name: restore-smoke
              image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  set +x
                  umask 077
                  [ -n "${BACKUP_ENCRYPT_KEY:-}" ] || { echo "BACKUP_ENCRYPT_KEY is not configured" >&2; exit 1; }
                  for tool in gpg gpg-agent initdb pg_ctl createdb pg_restore psql; do
                    command -v "$tool" >/dev/null || { echo "Required restore tool missing: $tool" >&2; exit 1; }
                  done
                  GNUPGHOME=$(mktemp -d /tmp/gnupg.XXXXXXXX)
                  export GNUPGHOME
                  dump=/backup/verify/roundtrip.dump.gpg
                  echo "smoke restore (from object storage roundtrip): $dump"
                  printf '%s\n' "$BACKUP_ENCRYPT_KEY" | gpg --batch --yes --decrypt \
                    --pinentry-mode loopback --passphrase-fd 0 -o /tmp/smoke.dump "$dump"
                  initdb -D /backup/smoke-data -U postgres --auth=trust >/dev/null
                  pg_ctl -D /backup/smoke-data -o "-k /tmp -p 55432 -c listen_addresses=''" -w start >/dev/null
                  trap 'pg_ctl -D /backup/smoke-data stop -m immediate >/dev/null 2>&1 || true' EXIT
                  createdb -h /tmp -p 55432 -U postgres smoke
                  pg_restore -h /tmp -p 55432 -U postgres -d smoke --no-owner --exit-on-error \
                    -t wallets -t balance_ledger -t settlement_watermarks /tmp/smoke.dump
                  for t in wallets balance_ledger settlement_watermarks; do
                    n=$(psql -h /tmp -p 55432 -U postgres -d smoke -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM $t")
                    echo "smoke: $t rows=$n"
                  done
                  echo "restore smoke OK"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {cpu: "1", memory: 1Gi}
          volumes:
            - {name: backup, emptyDir: {sizeLimit: 20Gi}}
            - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
