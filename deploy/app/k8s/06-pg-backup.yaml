# PostgreSQL 逻辑备份(每日 02:30 北京 = 18:30 UTC,保留由对象存储生命周期策略管)。
# ⚠️ 这是最低保障(RPO=24h)。钱包/账本库正式生产应上 pgBackRest/WAL-G 做 PITR
#    (RPO≈分钟级),或直接用云 RDS 自动备份 —— 见 runbooks/pg-backup-restore.md。
# 凭据 Secret(superdl-pg-backup)模板见 ../secrets.example.yaml,不在整目录 apply 路径内。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-daily
  namespace: superdl
spec:
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # 与同目录加固基线一致:非 root 运行(pg_dump / aws s3 cp 都不需要 root),
          # fsGroup 让两个容器都能读写交接用的 emptyDir
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          # 不在运行期 apt-get 装工具(供应链面 + 依赖外网源):
          # 转储与上传各用官方镜像,经 emptyDir 交接
          initContainers:
            - name: dump
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump "$PGURL" -Fc -f /backup/superdl-$ts.dump
                  echo "dump done: superdl-$ts.dump"
              volumeMounts:
                - {name: backup, mountPath: /backup}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
          containers:
            - name: upload
              image: amazon/aws-cli:2.32.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}   # 非 root 运行,aws cli 的家目录须可写
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  aws s3 cp /backup/ "s3://$S3_BUCKET/daily/" --recursive \
                    --exclude "*" --include "superdl-*.dump" --endpoint-url "$S3_ENDPOINT"
                  echo "upload done"
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - {name: backup, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
