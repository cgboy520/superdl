# PostgreSQL 逻辑备份(每日 02:30 北京 = 18:30 UTC,保留由对象存储生命周期策略管)。
# ⚠️ 这是最低保障(RPO=24h)。钱包/账本库正式生产应上 pgBackRest/WAL-G 做 PITR
#    (RPO≈分钟级),或直接用云 RDS 自动备份 —— 见 runbooks/pg-backup-restore.md。
apiVersion: v1
kind: Secret
metadata:
  name: superdl-pg-backup
  namespace: superdl
type: Opaque
stringData:
  PGURL: "postgresql://CHANGE_ME"          # 只读备份账号
  S3_ENDPOINT: "https://oss-cn-CHANGE.aliyuncs.com"
  S3_BUCKET: "superdl-pg-backup"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-daily
  namespace: superdl
spec:
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:18
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  apt-get update -qq && apt-get install -y -qq awscli >/dev/null
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump "$PGURL" -Fc -f /tmp/superdl-$ts.dump
                  aws s3 cp /tmp/superdl-$ts.dump "s3://$S3_BUCKET/daily/superdl-$ts.dump" \
                    --endpoint-url "$S3_ENDPOINT"
                  echo "backup done: superdl-$ts.dump"
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
