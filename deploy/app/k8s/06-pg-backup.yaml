# PostgreSQL 逻辑备份(每日 02:30 北京 = 18:30 UTC),RPO=24h;PITR 与恢复演练见 runbooks/pg-backup-restore.md。
# 保留策略在对象存储桶生命周期配置(建议 daily/ 30 天 + 月初归档 12 个月)。
# dump 经 gpg AES256 客户端加密(密钥 superdl-pg-backup 的 BACKUP_ENCRYPT_KEY),上传后回读做 restore 冒烟,失败 → PgBackupFailed 告警。
# 凭据 Secret 模板见 ../secrets.example.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-daily
  namespace: superdl
spec:
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {app: pg-backup}   # NetworkPolicy(09)按此标签放行出向
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false   # 只连 PG 与对象存储,不访问 K8s API
          # 非 root;fsGroup 让各容器可读写交接 emptyDir
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          # 转储与上传各用官方镜像,经 emptyDir 交接;运行期不装工具
          initContainers:
            - name: dump
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  set -e
                  # 落盘即客户端加密,明文 dump 不进卷
                  [ -n "$BACKUP_ENCRYPT_KEY" ] || { echo "BACKUP_ENCRYPT_KEY 未配置" >&2; exit 1; }
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump "$PGURL" -Fc -f /backup/superdl-$ts.dump
                  gpg --batch --yes --symmetric --cipher-algo AES256 \
                    --passphrase-env BACKUP_ENCRYPT_KEY \
                    -o /backup/superdl-$ts.dump.gpg /backup/superdl-$ts.dump
                  rm /backup/superdl-$ts.dump
                  echo "dump+encrypt done: superdl-$ts.dump.gpg"
              volumeMounts:
                - {name: backup, mountPath: /backup}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
            # upload 必须是 initContainer(与 restore-smoke 串行)
            - name: upload
              image: amazon/aws-cli:2.32.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}   # 非 root 运行,aws cli 的家目录须可写
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  aws s3 cp /backup/ "s3://$S3_BUCKET/daily/" --recursive \
                    --exclude "*" --include "superdl-*.dump.gpg" --endpoint-url "$S3_ENDPOINT"
                  echo "upload done"
                  # 回读对象存储里的那一份供冒烟
                  local_dump=$(ls -t /backup/superdl-*.dump.gpg | head -1)
                  key="daily/$(basename "$local_dump")"
                  mkdir -p /backup/verify
                  aws s3 cp "s3://$S3_BUCKET/$key" /backup/verify/roundtrip.dump.gpg \
                    --endpoint-url "$S3_ENDPOINT"
                  # 字节数必须一致
                  want=$(wc -c < "$local_dump")
                  got=$(wc -c < /backup/verify/roundtrip.dump.gpg)
                  [ "$want" = "$got" ] || {
                    echo "roundtrip size mismatch: s3=$got local=$want" >&2; exit 1; }
                  echo "roundtrip ok: $key ($got bytes)"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 512Mi}
          containers:
            # restore 冒烟:解密回读的 dump 恢复进 Pod 内一次性 PG,pg_restore 成功且三张资金表可查询即成功
            - name: restore-smoke
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              envFrom:
                - secretRef: {name: superdl-pg-backup}
              command:
                - sh
                - -ec
                - |
                  # 读 upload 回读下来的那一份
                  dump=/backup/verify/roundtrip.dump.gpg
                  echo "smoke restore (from object storage roundtrip): $dump"
                  printf '%s' "$BACKUP_ENCRYPT_KEY" | gpg --batch --yes --decrypt \
                    --passphrase-fd 0 -o /tmp/smoke.dump "$dump"
                  # 临时实例仅 unix socket,数据落 /backup 卷
                  initdb -D /backup/smoke-data -U postgres --auth=trust >/dev/null
                  pg_ctl -D /backup/smoke-data -o "-k /tmp -p 55432 -c listen_addresses=''" -w start >/dev/null
                  trap 'pg_ctl -D /backup/smoke-data stop -m immediate >/dev/null 2>&1 || true' EXIT
                  createdb -h /tmp -p 55432 -U postgres smoke
                  # 只恢复要害表;-t 无匹配时 pg_restore 报错退出
                  pg_restore -h /tmp -p 55432 -U postgres -d smoke --no-owner \
                    -t wallets -t balance_ledger -t settlement_watermarks /tmp/smoke.dump
                  # 表不可查询时 psql 非零退出;行数只打印不判定
                  for t in wallets balance_ledger settlement_watermarks; do
                    n=$(psql -h /tmp -p 55432 -U postgres -d smoke -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM $t")
                    echo "smoke: $t rows=$n"
                  done
                  echo "restore smoke OK"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {cpu: "1", memory: 1Gi}
          volumes:
            # sizeLimit 按库体积×2 预估,随增长上调
            - {name: backup, emptyDir: {sizeLimit: 20Gi}}
            - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
