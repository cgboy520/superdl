apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  selector:
    matchLabels: {app: superdl-api}
  endpoints:
    - port: http
      path: /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics
          key: SUPERDL_METRICS_TOKEN
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: superdl-worker
  namespace: superdl
  labels: {app: superdl-worker}
spec:
  selector:
    matchLabels: {app: superdl-worker}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics
          key: SUPERDL_METRICS_TOKEN
