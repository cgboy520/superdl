# Both monitors live in the monitoring namespace: prometheus-operator fetches the credential Secret by name and holds secrets read access only in monitoring
# (deploy/cluster/monitoring-rbac.yaml). The Bearer comes from the token key of monitoring/superdl-metrics-token,
# value = SUPERDL_METRICS_TOKEN of superdl/superdl-metrics (created per deploy/cluster/README.md "Preflight", existence checked by preflight).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: superdl-api
  namespace: monitoring
  labels: {app: superdl-api}
spec:
  namespaceSelector:
    matchNames: [superdl]
  selector:
    matchLabels: {app: superdl-api}
  endpoints:
    - port: http
      path: /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics-token
          key: token
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: superdl-worker
  namespace: monitoring
  labels: {app: superdl-worker}
spec:
  namespaceSelector:
    matchNames: [superdl]
  selector:
    matchLabels: {app: superdl-worker}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics-token
          key: token
