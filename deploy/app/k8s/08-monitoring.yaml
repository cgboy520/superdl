# 平台指标抓取接线(superdl_* 告警规则依赖)。CRD 由 kube-prometheus-stack 提供。
# /metrics 有 Bearer 门禁(SUPERDL_METRICS_TOKEN),凭据引用同命名空间的 superdl-metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: superdl-api
  namespace: superdl
  labels: {app: superdl-api}
spec:
  selector:
    matchLabels: {app: superdl-api}
  endpoints:
    - port: http
      path: /metrics/   # Starlette mount 对 /metrics 裸路径先 307 跳 /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics
          key: SUPERDL_METRICS_TOKEN
---
# worker 无 Service,用 PodMonitor 直抓;/metrics 与 API 同一 Bearer 门禁(workers/main.py)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: superdl-worker
  namespace: superdl
  labels: {app: superdl-worker}
spec:
  selector:
    matchLabels: {app: superdl-worker}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics/
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: superdl-metrics
          key: SUPERDL_METRICS_TOKEN
