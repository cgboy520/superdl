# 本地开发依赖:只起 PostgreSQL 18。API 与 worker 在宿主机用 uv 运行(见 CLAUDE.md「常用命令」),
# mock 短信与 mock 支付由 API 自身提供(SUPERDL_SMS_PROVIDER=mock / SUPERDL_PAYMENT_MOCK=true,dev 默认开启)。
name: superdl

services:
  postgres:
    image: postgres:18
    # 不设则宿主机/Docker 重启后 PG 不回来,API 与 worker 静默进无限重启循环
    # (unit 状态仍是 active,线索只在 journal 的重启计数里)。
    # 用 unless-stopped 不用 always:显式 stop 后不自作主张拉起。
    restart: unless-stopped
    environment:
      POSTGRES_USER: superdl
      POSTGRES_PASSWORD: superdl
      POSTGRES_DB: superdl
    ports:
      # 仅绑回环:compose 里是弱口令 dev 库,绑 0.0.0.0 会被同网段直连;宿主机的 API/worker 走 127.0.0.1:5432。
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 的数据目录约定:挂载 /var/lib/postgresql(内含版本子目录)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
