name: superdl

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: superdl
      POSTGRES_PASSWORD: superdl
      POSTGRES_DB: superdl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
