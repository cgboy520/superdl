# SPA 托管:/api 反代集群内 API Service(前端 baseUrl 为同源 "");
# 指纹资源长缓存,index.html 不缓存。
# 安全头见 security-headers.conf:逐 location include,不放 server 层
# (放 server 层会被下面带 add_header 的 location 整组丢弃;/api 由 API 自己下发)。
server {
    listen 8080;  # 非特权镜像,非 root 不可绑 80
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://superdl-api.superdl.svc.cluster.local/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
