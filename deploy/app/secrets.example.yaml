# Secret 模板(示例值,禁止直接 apply)。必须留在 k8s/ 目录之外,
# 否则 `kubectl apply -f deploy/app/k8s/` 会把生产凭据覆盖成占位值。
#
# 用法(二选一):
#   a) 复制到仓库外 → 填真实值 → 手工 `kubectl apply -f` 一次(文件用后即焚,禁止提交);
#   b) 接 External Secrets / SealedSecrets 等外部 Secret 管理,本文件仅当字段清单用。
# 必填清单见 apps/api/app/core/config.py 的 prod 校验(启动 fail-fast 兜底),
# 人话版在 docs/reference/security.md;非密配置在 k8s/00-namespace-config.yaml 的 ConfigMap。
#
# 按爆炸半径分域(不是一整份 superdl-api-secrets):任一组件失陷只泄它消费的那几个域。
# 消费矩阵(manifest 里的 envFrom 是唯一事实源):
#   superdl-db       api / 5 worker / migrate-Job;juicefs-metaurl 另被配额 Job 按 key 引用
#   superdl-auth     仅 api(JWT 签发/校验)
#   superdl-crypto   api / 5 worker(平台配置敏感项解密)
#   superdl-metrics  api / 5 worker / 08-monitoring 的 ServiceMonitor+PodMonitor
#   superdl-edge     api / admin 前端(07-frontends 按 key 引用 ADMIN_EDGE_TOKEN)
#   superdl-cloud    api / core worker(短信/验证码/实名的阿里云凭据)
#   superdl-payment  api / core worker(微信/支付宝商户凭据)
#   superdl-registry api / tenant-mgr / prewarm(Harbor 机器人;拉取凭据托管链)
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-db
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://CHANGE_ME?sslmode=require"  # prod 非本机必须 TLS
  # JuiceFS 元数据引擎连接串(数据盘目录配额下发的 CLI Job 以 secretKeyRef 引用本键;
  # 值与 kube-system/superdl-juicefs-secret 的 metaurl 相同;api/worker 进程本身不读)
  juicefs-metaurl: "postgres://juicefs:CHANGE_ME@CHANGE_ME_PG_HOST:5432/juicefs_meta?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-auth
  namespace: superdl
type: Opaque
stringData:
  # JWT 签发/校验密钥(必配):openssl rand -hex 32
  # prod 启动校验拒绝占位符与低熵串(≥32 字符且唯一字符 ≥16),填不满这行 API 不会启动
  SUPERDL_JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-crypto
  namespace: superdl
type: Opaque
stringData:
  # 平台配置敏感项落库加密主密钥(必配):python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  SUPERDL_CONFIG_ENCRYPTION_KEY: "CHANGE_ME_URLSAFE_B64_32_BYTES"
  # 轮换窗口内的旧主密钥(平时不配置;轮换步骤见 deploy/cluster/runbooks/key-rotation.md):
  # 只参与解密/摘要回读,写入永远用上面的当前密钥。摘除条件见 runbook。
  # SUPERDL_CONFIG_ENCRYPTION_KEY_PREVIOUS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-metrics
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_METRICS_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-edge
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_ALERTMANAGER_TOKEN: "CHANGE_ME"
  # 管理端边缘共享密钥(edge_guard 双闸:admin 域 nginx 按 key 引用注入 X-Admin-Edge-Token,
  # API 侧经 envFrom 读取校验;prod 必填):openssl rand -hex 24
  SUPERDL_ADMIN_EDGE_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-cloud
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_SMS_PROVIDER: "aliyun"
  SUPERDL_SMS_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_SMS_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_SMS_SIGN_NAME: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_VERIFY: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_NOTICE: "CHANGE_ME"
  # 人机校验(阿里云验证码 2.0;开关在 管理端·安全策略,开启后凭据缺失即发码 502)。
  # scene_id / prefix 为公开信息,放 ConfigMap
  SUPERDL_CAPTCHA_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_ACCESS_KEY_SECRET: "CHANGE_ME"
  # 实名认证(阿里云实人认证·三要素核验;开关 real_name_enabled 在 ConfigMap / 管理端·安全策略)
  SUPERDL_REAL_NAME_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_REAL_NAME_ACCESS_KEY_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-payment
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_PAYMENT_MOCK: "false"
  # 以下渠道凭据是可选的 env 默认值层,也可全部留空,上线后经 管理端·平台配置 在线录入
  # (DB 覆盖,加密存储)
  SUPERDL_WECHAT_MCHID: "CHANGE_ME"
  SUPERDL_WECHAT_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_CERT_SERIAL_NO: "CHANGE_ME"
  SUPERDL_WECHAT_APIV3_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_APPID: "CHANGE_ME"
  # 微信支付公钥(验签唯一模式;两项必填,缺一渠道不可用)
  SUPERDL_WECHAT_PUBLIC_KEY_ID: "CHANGE_ME"
  SUPERDL_WECHAT_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_APP_ID: "CHANGE_ME"
  SUPERDL_ALIPAY_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_SELLER_ID: "CHANGE_ME"   # 收款方 PID(2088 开头);启用支付宝时 prod 必填
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry
  namespace: superdl
type: Opaque
stringData:
  # 镜像仓库(Harbor)机器人账户(仅 Pull + List Repository):可留空,上线后经 管理端·平台配置·镜像仓库 录入
  SUPERDL_REGISTRY_ROBOT_NAME: ""
  SUPERDL_REGISTRY_ROBOT_SECRET: ""
---
# PG 逻辑备份上传凭据(06-pg-backup.yaml 的 CronJob 引用)
apiVersion: v1
kind: Secret
metadata:
  name: superdl-pg-backup
  namespace: superdl
type: Opaque
stringData:
  PGURL: "postgresql://CHANGE_ME"          # 只读备份账号
  S3_ENDPOINT: "https://oss-cn-CHANGE.aliyuncs.com"
  S3_BUCKET: "superdl-pg-backup"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  # 备份客户端加密口令(必配;备份=钱包/账本全量拷贝,加密后对象存储失陷不泄资金库):
  # openssl rand -base64 48
  BACKUP_ENCRYPT_KEY: "CHANGE_ME"
---
# Harbor 拉镜像凭据(平台自身镜像 api/web/admin 的 imagePullSecrets,各清单已引用本 Secret):
# 首装手建;上线后在 管理端·平台配置·镜像仓库 录入拉取机器人,worker 会按指纹覆写同名 Secret
# 并托管到各租户 ns(实例 Pod / 预热 Job 同一条凭据链)。Harbor 平台项目为 public 可跳过。
# 用 kubectl 生成,别手写 base64(机器人仅 Pull + List Repository 权限):
#   kubectl create secret docker-registry superdl-registry-pull -n superdl \
#     --docker-server=harbor.example.com --docker-username='robot$superdl+pull' --docker-password=CHANGE_ME
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry-pull
  namespace: superdl
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "CHANGE_ME"
# ---
# 泛域名证书 DNS01 凭据在 cert-manager 命名空间,不属本文件 apply 范围,且只有
# acmeDns.enabled=true 的档位需要(light 档手工灌入通配证书,不用它):
#   acme-dns-account : key acmedns.json —— acme-dns 账户(只能更新 _acme-challenge 子域的 TXT),
#   由 deploy/app/k8s/05-cert-manager.yaml 的 ClusterIssuer letsencrypt-dns 引用(accountSecretRef);
#   注册账户与建 Secret 的命令见 deploy/cluster/runbooks/acme-dns.md,preflight.sh 强制校验存在。

# ---
# Alertmanager 告警通道凭据在 monitoring 命名空间,不属本文件 apply 范围,
# helm 不代建,建法见 deploy/cluster/README.md「前置检查」;键位约定:
#   superdl-alert-token    : key token         —— 平台 webhook Bearer(与 SUPERDL_ALERTMANAGER_TOKEN 一致)
#   superdl-smtp-password  : key password      —— 外部 SMTP 口令(邮件第二通道,对应 kps.yaml 四个 CHANGE_ME 的账号体系)
#   superdl-dingtalk-token : key token         —— 钉钉机器人 access_token(第三通道,仅 critical;sidecar 见 kps.yaml 注释)
#   grafana-admin          : keys admin-user/admin-password(仅 full 档)
