# Secret 模板(示例值,禁止直接 apply;留在 k8s/ 目录之外)。
# 用法:a) 复制到仓库外填真实值后手工 kubectl apply -f 一次;b) 接 External Secrets / SealedSecrets,本文件当字段清单。
# 必填清单见 apps/api/app/core/config.py 的 prod 校验与 docs/reference/security.md;非密配置在 k8s/00-namespace-config.yaml。
#
# 按消费组件分域,消费矩阵(manifest 里的 envFrom 是事实源):
#   superdl-db       api / 5 worker(应用角色,无 DDL)
#   superdl-db-migrate  仅 migrate-Job(库 owner 角色,跑 alembic;角色划分见 ../pg/roles.sql)
#   superdl-auth     仅 api(JWT 签发/校验)
#   superdl-crypto   api / 5 worker(平台配置敏感项解密)
#   superdl-metrics  api / 5 worker / 08-monitoring 的 ServiceMonitor+PodMonitor
#   superdl-edge     api / admin 前端(07-frontends 按 key 引用 ADMIN_EDGE_TOKEN)
#   superdl-cloud    api / core worker(短信/验证码/实名的阿里云凭据)
#   superdl-payment  api / core worker(微信/支付宝商户凭据)
#   superdl-registry api / tenant-mgr / prewarm(Harbor 机器人;拉取凭据托管链)
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-db
  namespace: superdl
type: Opaque
stringData:
  # 应用角色(superdl_app,非 superuser、非 owner,只有 DML;见 ../pg/roles.sql)。prod 非本机必须 TLS;
  # 自签/私有 CA 时用 verify-full + sslrootcert(CA 经 ConfigMap superdl-db-ca 的 ca.crt 挂到 /etc/superdl/db-ca)
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://superdl_app:CHANGE_ME@CHANGE_ME_PG_HOST:5432/superdl?sslmode=verify-full&sslrootcert=/etc/superdl/db-ca/ca.crt"
---
# 迁移 Job 专用:库 owner 角色(superdl),有 DDL;api/worker 不挂它
apiVersion: v1
kind: Secret
metadata:
  name: superdl-db-migrate
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://superdl:CHANGE_ME@CHANGE_ME_PG_HOST:5432/superdl?sslmode=verify-full&sslrootcert=/etc/superdl/db-ca/ca.crt"
---
# 库服务端证书的 CA(自签 / 私有 CA 时才需要;公共 CA 签发的托管 PG 可不建,sslrootcert 指向镜像内系统 CA 束):
#   kubectl -n superdl create configmap superdl-db-ca --from-file=ca.crt=<server-ca.crt>
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-auth
  namespace: superdl
type: Opaque
stringData:
  # JWT 签发/校验密钥(必配,≥32 字符且唯一字符 ≥16):openssl rand -hex 32
  SUPERDL_JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-crypto
  namespace: superdl
type: Opaque
stringData:
  # 平台配置敏感项落库加密主密钥(必配):python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  SUPERDL_CONFIG_ENCRYPTION_KEY: "CHANGE_ME_URLSAFE_B64_32_BYTES"
  # 轮换窗口内的旧主密钥(平时不配置,只参与解密;见 deploy/cluster/runbooks/key-rotation.md):
  # SUPERDL_CONFIG_ENCRYPTION_KEY_PREVIOUS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-metrics
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_METRICS_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-edge
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_ALERTMANAGER_TOKEN: "CHANGE_ME"
  # 管理端边缘共享密钥(admin 域 nginx 注入 X-Admin-Edge-Token,API 侧 edge_guard 校验;prod 必填):openssl rand -hex 24
  SUPERDL_ADMIN_EDGE_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-cloud
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_SMS_PROVIDER: "aliyun"
  SUPERDL_SMS_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_SMS_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_SMS_SIGN_NAME: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_VERIFY: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_NOTICE: "CHANGE_ME"
  # 人机校验(阿里云验证码 2.0;开关在 管理端·安全策略);scene_id / prefix 为公开信息,放 ConfigMap
  SUPERDL_CAPTCHA_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_ACCESS_KEY_SECRET: "CHANGE_ME"
  # 实名认证(阿里云实人认证·三要素核验;开关 real_name_enabled 在 ConfigMap / 管理端·安全策略)
  SUPERDL_REAL_NAME_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_REAL_NAME_ACCESS_KEY_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-payment
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_PAYMENT_MOCK: "false"
  # 以下渠道凭据为可选 env 默认值层,可留空,上线后经 管理端·平台配置 录入
  SUPERDL_WECHAT_MCHID: "CHANGE_ME"
  SUPERDL_WECHAT_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_CERT_SERIAL_NO: "CHANGE_ME"
  SUPERDL_WECHAT_APIV3_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_APPID: "CHANGE_ME"
  # 微信支付公钥(验签唯一模式;两项必填)
  SUPERDL_WECHAT_PUBLIC_KEY_ID: "CHANGE_ME"
  SUPERDL_WECHAT_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_APP_ID: "CHANGE_ME"
  SUPERDL_ALIPAY_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_SELLER_ID: "CHANGE_ME"   # 收款方 PID(2088 开头);启用支付宝时 prod 必填
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry
  namespace: superdl
type: Opaque
stringData:
  # 镜像仓库(Harbor)机器人账户(仅 Pull + List Repository):可留空,上线后经 管理端·平台配置·镜像仓库 录入
  SUPERDL_REGISTRY_ROBOT_NAME: ""
  SUPERDL_REGISTRY_ROBOT_SECRET: ""
---
# PG 逻辑备份上传凭据(06-pg-backup.yaml 的 CronJob 引用)
apiVersion: v1
kind: Secret
metadata:
  name: superdl-pg-backup
  namespace: superdl
type: Opaque
stringData:
  PGURL: "postgresql://CHANGE_ME"          # 只读备份账号
  S3_ENDPOINT: "https://oss-cn-CHANGE.aliyuncs.com"
  S3_BUCKET: "superdl-pg-backup"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  # 备份客户端加密口令(必配):openssl rand -base64 48
  BACKUP_ENCRYPT_KEY: "CHANGE_ME"
---
# Harbor 拉镜像凭据(平台镜像 imagePullSecrets):首装手建;上线后在 管理端·平台配置·镜像仓库 录入,worker 覆写同名 Secret
# 并托管到各租户 ns。Harbor 项目为 public 可跳过。用 kubectl 生成(机器人仅 Pull + List Repository):
#   kubectl create secret docker-registry superdl-registry-pull -n superdl \
#     --docker-server=harbor.example.com --docker-username='robot$superdl+pull' --docker-password=CHANGE_ME
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry-pull
  namespace: superdl
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "CHANGE_ME"
# ---
# 泛域名证书 DNS01 凭据在 cert-manager 命名空间(仅 acmeDns.enabled=true 档需要):
#   acme-dns-account : key acmedns.json —— 由 deploy/app/k8s/05-cert-manager.yaml 的 ClusterIssuer letsencrypt-dns 引用;
#   建法见 deploy/cluster/runbooks/acme-dns.md,preflight.sh 校验存在。

# ---
# Alertmanager 告警通道凭据在 monitoring 命名空间,建法见 deploy/cluster/README.md「前置检查」;键位约定:
#   superdl-alert-token    : key token         —— 平台 webhook Bearer(与 SUPERDL_ALERTMANAGER_TOKEN 一致)
#   superdl-smtp-password  : key password      —— 外部 SMTP 口令(对应 kps.yaml 四个 CHANGE_ME)
#   superdl-dingtalk-token : key token         —— 钉钉机器人 access_token(sidecar 见 kps.yaml)
#   grafana-admin          : keys admin-user/admin-password(仅 full 档)
