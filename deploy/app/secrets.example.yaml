# 示例值，禁止直接 apply。
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-db
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://superdl_app:CHANGE_ME@CHANGE_ME_PG_HOST:5432/superdl?sslmode=verify-full&sslrootcert=/etc/superdl/db-ca/ca.crt"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-db-migrate
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://superdl:CHANGE_ME@CHANGE_ME_PG_HOST:5432/superdl?sslmode=verify-full&sslrootcert=/etc/superdl/db-ca/ca.crt"
---
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-auth
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-crypto
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_CONFIG_ENCRYPTION_KEY: "CHANGE_ME_URLSAFE_B64_32_BYTES"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-metrics
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_METRICS_TOKEN: "CHANGE_ME"
---
# Prometheus 抓 API / worker /metrics 的 Bearer(monitor 在 monitoring ns,见 deploy/app/k8s/08-monitoring.yaml);token 与上面的 SUPERDL_METRICS_TOKEN 同值
apiVersion: v1
kind: Secret
metadata:
  name: superdl-metrics-token
  namespace: monitoring
type: Opaque
stringData:
  token: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-edge
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_ALERTMANAGER_TOKEN: "CHANGE_ME"
  SUPERDL_ADMIN_EDGE_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-cloud
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_SMS_PROVIDER: "aliyun"
  SUPERDL_SMS_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_SMS_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_SMS_SIGN_NAME: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_VERIFY: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_NOTICE: "CHANGE_ME"
  # Twilio alternative: SUPERDL_SMS_PROVIDER=twilio with the three keys below instead of the Aliyun ones.
  # SUPERDL_SMS_TWILIO_ACCOUNT_SID: "CHANGE_ME"
  # SUPERDL_SMS_TWILIO_AUTH_TOKEN: "CHANGE_ME"
  # SUPERDL_SMS_TWILIO_FROM: "+CHANGE_ME"
  # Verification emails (required in prod: email_provider=mock is refused).
  SUPERDL_EMAIL_PROVIDER: "smtp"
  SUPERDL_SMTP_HOST: "CHANGE_ME"
  SUPERDL_SMTP_PORT: "587"
  SUPERDL_SMTP_SECURITY: "starttls"
  SUPERDL_SMTP_USERNAME: "CHANGE_ME"
  SUPERDL_SMTP_PASSWORD: "CHANGE_ME"
  SUPERDL_EMAIL_FROM: "SuperDL <no-reply@CHANGE_ME>"
  SUPERDL_CAPTCHA_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_REAL_NAME_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_REAL_NAME_ACCESS_KEY_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-payment
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_PAYMENT_MOCK: "false"
  SUPERDL_WECHAT_MCHID: "CHANGE_ME"
  SUPERDL_WECHAT_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_CERT_SERIAL_NO: "CHANGE_ME"
  SUPERDL_WECHAT_APIV3_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_APPID: "CHANGE_ME"
  SUPERDL_WECHAT_PUBLIC_KEY_ID: "CHANGE_ME"
  SUPERDL_WECHAT_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_APP_ID: "CHANGE_ME"
  SUPERDL_ALIPAY_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_SELLER_ID: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_REGISTRY_ROBOT_NAME: ""
  SUPERDL_REGISTRY_ROBOT_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-pg-backup
  namespace: superdl
type: Opaque
stringData:
  PGURL: "postgresql://CHANGE_ME"
  S3_ENDPOINT: "https://oss-cn-CHANGE.aliyuncs.com"
  S3_BUCKET: "superdl-pg-backup"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  BACKUP_ENCRYPT_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdl-registry-pull
  namespace: superdl
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "CHANGE_ME"
