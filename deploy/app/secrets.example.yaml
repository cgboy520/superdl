# Secret 模板(示例值,禁止直接 apply)。
# 放在 k8s/ 目录之外,`kubectl apply -f deploy/app/k8s/` 整目录不会碰到它。
#
# 用法(二选一):
#   a) 复制到仓库外 → 填真实值 → 手工 `kubectl apply -f` 一次(文件用后即焚,禁止提交);
#   b) 接 External Secrets / SealedSecrets 等外部 Secret 管理,本文件仅当字段清单用。
# 必填清单见 apps/api/app/core/config.py 的 prod 校验(启动 fail-fast 兜底),
# 人话版在 docs/reference/security.md;非密配置在 k8s/00-namespace-config.yaml 的 ConfigMap。
apiVersion: v1
kind: Secret
metadata:
  name: superdl-api-secrets
  namespace: superdl
type: Opaque
stringData:
  SUPERDL_DATABASE_URL: "postgresql+asyncpg://CHANGE_ME"
  SUPERDL_JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM_______"
  SUPERDL_ALERTMANAGER_TOKEN: "CHANGE_ME"
  SUPERDL_METRICS_TOKEN: "CHANGE_ME"
  SUPERDL_SMS_PROVIDER: "aliyun"
  SUPERDL_SMS_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_SMS_ACCESS_KEY_SECRET: "CHANGE_ME"
  SUPERDL_SMS_SIGN_NAME: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_VERIFY: "CHANGE_ME"
  SUPERDL_SMS_TEMPLATE_NOTICE: "CHANGE_ME"
  SUPERDL_PAYMENT_MOCK: "false"
  # 平台配置敏感项落库加密主密钥(必配):python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  SUPERDL_CONFIG_ENCRYPTION_KEY: "CHANGE_ME_URLSAFE_B64_32_BYTES"
  # 以下渠道凭据为可选的 env 默认值层:也可全部留空,上线后经 管理端·平台配置 在线录入(DB 覆盖,加密存储)
  SUPERDL_WECHAT_MCHID: "CHANGE_ME"
  SUPERDL_WECHAT_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_CERT_SERIAL_NO: "CHANGE_ME"
  SUPERDL_WECHAT_APIV3_KEY: "CHANGE_ME"
  SUPERDL_WECHAT_APPID: "CHANGE_ME"
  # 微信支付公钥模式(新商户唯一可用模式;两项同填,留空走平台证书模式)
  SUPERDL_WECHAT_PUBLIC_KEY_ID: ""
  SUPERDL_WECHAT_PUBLIC_KEY: ""
  SUPERDL_ALIPAY_APP_ID: "CHANGE_ME"
  SUPERDL_ALIPAY_PRIVATE_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_PUBLIC_KEY: "CHANGE_ME"
  SUPERDL_ALIPAY_SELLER_ID: "CHANGE_ME"   # 收款方 PID(2088 开头);启用支付宝时 prod 必填
  # 人机校验(阿里云验证码 2.0;开关在 管理端·安全策略,开启后凭据缺失即发码 502)。scene_id / prefix 为公开信息,放 ConfigMap
  SUPERDL_CAPTCHA_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_CAPTCHA_ACCESS_KEY_SECRET: "CHANGE_ME"
  # 镜像仓库(Harbor)机器人账户(仅 Pull + List Repository):可留空,上线后经 管理端·平台配置·镜像仓库 录入
  SUPERDL_REGISTRY_ROBOT_NAME: ""
  SUPERDL_REGISTRY_ROBOT_SECRET: ""
  # 实名认证(阿里云实人认证·三要素核验;开关 real_name_enabled 在 ConfigMap / 管理端·安全策略)
  SUPERDL_REAL_NAME_ACCESS_KEY_ID: "CHANGE_ME"
  SUPERDL_REAL_NAME_ACCESS_KEY_SECRET: "CHANGE_ME"
  # JuiceFS 元数据引擎连接串(数据盘目录配额下发的 CLI Job 以 secretKeyRef 引用本键;
  # 值与 kube-system/superdl-juicefs-secret 的 metaurl 相同;api/worker 进程本身不读)
  juicefs-metaurl: "postgres://juicefs:CHANGE_ME@CHANGE_ME_PG_HOST:5432/juicefs_meta?sslmode=require"
---
# PG 逻辑备份上传凭据(06-pg-backup.yaml 的 CronJob 引用)
apiVersion: v1
kind: Secret
metadata:
  name: superdl-pg-backup
  namespace: superdl
type: Opaque
stringData:
  PGURL: "postgresql://CHANGE_ME"          # 只读备份账号
  S3_ENDPOINT: "https://oss-cn-CHANGE.aliyuncs.com"
  S3_BUCKET: "superdl-pg-backup"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
---
# GHCR 拉镜像凭据:仅当 ghcr.io 上的镜像包为 private 时需要;public 包可跳过本 Secret,
# 各清单里的 imagePullSecrets 保持注释状态即可(匿名可拉)。
# 更推荐直接用 kubectl 生成,避免手写 base64:
#   kubectl create secret docker-registry superdl-ghcr-pull -n superdl \
#     --docker-server=ghcr.io --docker-username=CHANGE_ME --docker-password=CHANGE_ME_READ_PACKAGES_PAT
apiVersion: v1
kind: Secret
metadata:
  name: superdl-ghcr-pull
  namespace: superdl
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "CHANGE_ME"
# ---
# 泛域名证书 DNS01 凭据在 cert-manager 命名空间,不属本文件 apply 范围:
#   acme-dns-account : key acmedns.json —— acme-dns 账户(只能更新 _acme-challenge 子域的 TXT),
#   由 deploy/app/k8s/05-cert-manager.yaml 的 ClusterIssuer letsencrypt-dns 引用(tsigSecretName);
#   注册账户与建 Secret 的命令见 deploy/cluster/runbooks/acme-dns.md,preflight.sh 强制校验存在。
#   (原 alidns-credentials / cert-manager-webhook-alidns 已退役,不再需要全域 RAM DNS 凭据。)

# ---
# Alertmanager 告警通道凭据在 monitoring 命名空间,不属本文件 apply 范围,
# helm 不代建,建法见 deploy/cluster/README.md「前置检查」;键位约定:
#   superdl-alert-token    : key token         —— 平台 webhook Bearer(与 SUPERDL_ALERTMANAGER_TOKEN 一致)
#   superdl-smtp-password  : key password      —— 外部 SMTP 口令(邮件第二通道,对应 kps.yaml 四个 CHANGE_ME 的账号体系)
#   superdl-dingtalk-token : key token         —— 钉钉机器人 access_token(第三通道,仅 critical;sidecar 见 kps.yaml 注释)
#   grafana-admin          : keys admin-user/admin-password(仅 full 档)
