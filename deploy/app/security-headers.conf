# 静态站公共安全头(web/admin 共用)。每个带 add_header 的 location 都要 include:
# nginx 的 add_header 就近整组覆盖,location 里出现一条即不再继承 server 层。
# CSP 按站点拆分:web 见 security-headers-web-csp.conf(放行阿里云验证码 SDK 域),
# admin 见 security-headers-admin-csp.conf(严格 'self',不加载任何第三方 SDK)。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# HSTS:TLS 终止在 ingress-nginx(ssl-redirect 已强制 HTTPS),本头经反代透传给浏览器;
# 纯 HTTP 响应里带 HSTS 会被浏览器忽略,无副作用。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
