# 静态站安全头。每个带 add_header 的 location 都要 include:
# nginx 的 add_header 就近整组覆盖,location 里出现一条即不再继承 server 层。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# HSTS:TLS 终止在 ingress-nginx(ssl-redirect 已强制 HTTPS),本头经反代透传给浏览器;
# 纯 HTTP 响应里带 HSTS 会被浏览器忽略,无副作用。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# SPA 自身资源全部同源:脚本只允许打包产物(无内联脚本),样式需 unsafe-inline
# (antd 6 CSS-in-JS 运行时注入 <style>),接口同源,禁止被任何页面内嵌。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
