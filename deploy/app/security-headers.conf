# 静态站公共安全头(web/admin 共用),每个带 add_header 的 location 都要 include。
# CSP 按站点拆分:security-headers-web-csp.conf / security-headers-admin-csp.conf
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# 浏览器特性面收窄
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
# 浏览上下文隔离
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 静态资源只许同源嵌入
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS(TLS 终止在 Envoy Gateway,本头经反代透传)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
