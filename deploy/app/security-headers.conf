# 静态站公共安全头(web/admin 共用)。每个带 add_header 的 location 都要 include:
# nginx 的 add_header 就近整组覆盖,location 里出现一条即不再继承 server 层。
# CSP 按站点拆分:web 见 security-headers-web-csp.conf(放行阿里云验证码 SDK 域),
# admin 见 security-headers-admin-csp.conf(严格 'self',不加载任何第三方 SDK)。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# 浏览器特性面收窄:本平台用不到这些硬件/支付 API,一律禁
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
# 浏览上下文隔离:window.opener 断开 + 跨源不共窗格组
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 静态资源只许同源嵌入(前端全部资源本就同源;跨站引用直接被浏览器丢弃)
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS:TLS 终止在 Envoy Gateway(80 端口由 superdl-https-redirect 强制跳 HTTPS),本头经反代透传给浏览器;
# 纯 HTTP 响应里带 HSTS 会被浏览器忽略,无副作用。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
