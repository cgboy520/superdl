# web 站 CSP(用户控制台):放行阿里云验证码 2.0 SDK 所需域。
# 依据官方接入文档:SDK 脚本源 o.alicdn.com;初始化/校验请求 https://<身份标>.captcha-open.aliyuncs.com。
# 上线/变更流程(发布检查单):staging 若发现加载链仍被拦,把头名改为
# Content-Security-Policy-Report-Only 重新部署(只上报不阻断),按浏览器控制台违规报告
# 收敛清单后改回本头 enforce。不要未经实测直接追加域。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://o.alicdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://o.alicdn.com; font-src 'self' data:; connect-src 'self' https://*.captcha-open.aliyuncs.com; frame-src https://*.captcha-open.aliyuncs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
