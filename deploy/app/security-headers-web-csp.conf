# web 站 CSP(用户控制台):放行阿里云验证码 2.0 SDK(脚本源 o.alicdn.com 验证码产品路径前缀;请求 https://<身份标>.captcha-open.aliyuncs.com)。
# 变更流程:staging 先以 Content-Security-Policy-Report-Only 收敛清单再改回 enforce;不用 SRI(上游滚动更新)。
# 'sha256-maAahyMEq+gIzkbgffpfS4uBU2srRF17Oh/RQt6oFEA=' 是 apps/web/index.html 内联主题预置脚本的 SHA-256,
# 由 scripts/check-csp-hash.sh 校验,改脚本后重算同步
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-maAahyMEq+gIzkbgffpfS4uBU2srRF17Oh/RQt6oFEA=' https://o.alicdn.com/captcha-frontend/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://o.alicdn.com; font-src 'self' data:; connect-src 'self' https://*.captcha-open.aliyuncs.com; frame-src https://*.captcha-open.aliyuncs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
