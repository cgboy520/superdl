# web 站 CSP(用户控制台):放行阿里云验证码 2.0 SDK 所需域。
# 依据官方接入文档:SDK 脚本源 o.alicdn.com;初始化/校验请求 https://<身份标>.captcha-open.aliyuncs.com。
# 上线/变更流程(发布检查单):staging 若发现加载链仍被拦,把头名改为
# Content-Security-Policy-Report-Only 重新部署(只上报不阻断),按浏览器控制台违规报告
# 收敛清单后改回本头 enforce。不要未经实测直接追加域。
# 'sha256-maAahyMEq+gIzkbgffpfS4uBU2srRF17Oh/RQt6oFEA=' 是 apps/web/index.html 内联主题
# 预置脚本(防 FOUC)的 SHA-256:该脚本任何字节改动都必须重算并同步此处,
# 由 scripts/check-csp-hash.sh(CI 挂载)强制校验,改脚本前先跑该脚本看新 hash。
#
# script-src 只放行验证码产品路径前缀(而非整个 o.alicdn.com 源):CDN 上其它产品的
# 脚本不再可注入。SDK 运行期会从该路径下惰性加载同目录组件,故收窄到目录级而非单文件。
# 不用 SRI:上游是无版本号滚动更新文件,钉 hash 会在阿里云轮换时静默打死验证码;
# 不自托管同理(SDK 仍要回源惰性加载, vendoring 只是虚假安全感)。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-maAahyMEq+gIzkbgffpfS4uBU2srRF17Oh/RQt6oFEA=' https://o.alicdn.com/captcha-frontend/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://o.alicdn.com; font-src 'self' data:; connect-src 'self' https://*.captcha-open.aliyuncs.com; frame-src https://*.captcha-open.aliyuncs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
