# 管理控制台 SPA 托管(admin 镜像;用户端见 nginx.web.conf)。仅反代 /api/admin/;指纹资源长缓存,index.html 不缓存。
# 安全头见 security-headers.conf,逐 location include(不放 server 层)
server {
    listen 8080;  # 非特权镜像,非 root 不可绑 80
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/admin/ {
        proxy_pass http://superdl-api.superdl.svc.cluster.local/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # 边缘共享密钥(edge_guard 第二闸):envsubst 模板变量,Secret 只挂 admin Pod
        proxy_set_header X-Admin-Edge-Token ${ADMIN_EDGE_TOKEN};
        # 引入 SSE/长轮询时须上调 proxy_read_timeout
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-admin-csp.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/security-headers-admin-csp.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
