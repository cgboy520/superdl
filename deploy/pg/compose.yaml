# 自建单实例 PG 18(控制面宿主机 Docker)。落位 /etc/superdl/pg/compose.yaml;CHANGE_ME_PG_IP 换成宿主机内网地址。
# host 网络:Pod 出向 NetworkPolicy 按 <宿主机 IP>/32 放行,而 Docker 端口映射会在 PREROUTING 先 DNAT 到
# 容器 IP,netpol 在 FORWARD 看到的目的地址不在白名单而 REJECT;直接绑宿主地址即无 DNAT
name: superdl-pg
services:
  postgres:
    # 与 deploy/app/k8s/06-pg-backup.yaml 同一 digest;升版本两处同改
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    env_file: [/etc/superdl/pg/pg.env]   # POSTGRES_USER=superdl / POSTGRES_PASSWORD=<owner 口令>
    network_mode: host
    volumes:
      - /var/lib/superdl/pg/data:/var/lib/postgresql
      - /etc/superdl/pg/certs:/certs:ro
      - /etc/superdl/pg/pg_hba.conf:/etc/pg/pg_hba.conf:ro
    command: >
      postgres -c listen_addresses=CHANGE_ME_PG_IP,127.0.0.1 -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
      -c hba_file=/etc/pg/pg_hba.conf -c max_connections=200 -c shared_buffers=2GB
      -c effective_cache_size=8GB -c timezone=UTC -c log_min_duration_statement=2000
      -c archive_mode=on -c archive_timeout=300
      -c "archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdl"]
      interval: 5s
      timeout: 3s
      retries: 20
