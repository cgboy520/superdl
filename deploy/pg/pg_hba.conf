# 落位 /etc/superdl/pg/pg_hba.conf(compose 以 hba_file 指向)。TCP 只认 TLS + scram;socket 只有 docker exec 能到
local   all all                 trust
hostssl all all 127.0.0.1/32    scram-sha-256
hostssl all all 10.42.0.0/16    scram-sha-256   # Pod 网段(tenant_pod_cidr)
hostssl all all 172.31.36.0/24  scram-sha-256   # 节点内网(改成本机房网段)
hostnossl all all 0.0.0.0/0     reject
