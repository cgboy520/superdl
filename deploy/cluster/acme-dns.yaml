apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-dns-config
  namespace: cert-manager
data:
  config.cfg: |
    [general]
    listen = "0.0.0.0:53"
    protocol = "both"
    domain = "auth.superdl.example.com"
    nsname = "ns1.auth.superdl.example.com"
    nsadmin = "ops.superdl.example.com"
    records = [
        "auth.superdl.example.com. A CHANGE_ME_ACME_DNS_LB_IP",
        "auth.superdl.example.com. NS ns1.auth.superdl.example.com.",
      ]
    debug = false
    [database]
    engine = "sqlite3"
    connection = "/var/lib/acme-dns/acme-dns.db"
    [api]
    ip = "0.0.0.0"
    port = "8080"
    disable_registration = false
    tls = "none"
    [logconfig]
    loglevel = "info"
    logtype = "stdout"
    logformat = "text"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acme-dns-data
  namespace: cert-manager
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: topolvm-provisioner
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-dns
  namespace: cert-manager
  labels:
    app: acme-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: acme-dns
  template:
    metadata:
      labels:
        app: acme-dns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: acme-dns
          image: joohoi/acme-dns:v1.0@sha256:CHANGE_ME_ACME_DNS_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - {containerPort: 53, protocol: UDP}
            - {containerPort: 53, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/acme-dns}
            - {name: data, mountPath: /var/lib/acme-dns}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 53}
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: acme-dns-config
        - name: data
          persistentVolumeClaim:
            claimName: acme-dns-data
---
apiVersion: v1
kind: Service
metadata:
  name: acme-dns
  namespace: cert-manager
spec:
  type: LoadBalancer
  selector:
    app: acme-dns
  ports:
    - {name: dns-udp, port: 53, protocol: UDP}
    - {name: dns-tcp, port: 53, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: acme-dns-api
  namespace: cert-manager
spec:
  type: ClusterIP
  selector:
    app: acme-dns
  ports:
    - {name: api, port: 8080, protocol: TCP, targetPort: 8080}
