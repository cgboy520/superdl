# light 档(k3s 单机/小规模):helmfile -e light apply。差异在 values/light/ 覆盖;CNI 与 full 同为 Cilium。
# TopoLVM 必装(实例盘,需 VG superdl-nvme;Ceph 的 OSD 也落在它上面);Rook-Ceph 必装(数据盘)
# k3s 须 flannel-backend=none + disable-network-policy(k3s/server-config.yaml,server 端一处即全集群生效);
# CNI 路径与 LB 归属见 values/light/cilium-light.yaml
cilium: {enabled: true}
# GPU 栈同 full;k3s 覆盖见 values/light/gpu-operator-light.yaml
gpuOperator: {enabled: true}
hami: {enabled: true}
kataDeploy: {enabled: true}   # dedicated 档运行时;chart 按 k8sDistribution=k3s 写 k3s 的 containerd 配置
kps: {enabled: true}
topolvm: {enabled: true}
# 数据盘后端(CephFS);OSD 用 TopoLVM 的 Block PVC,与实例盘共用 VG superdl-nvme
rookCeph: {enabled: true}
certManager: {enabled: true}
# acme-dns 不装(见 helmfile 注释);通配证书手工灌成 superdl/superdl-jupyter-wildcard-tls 与 superdl-svc-wildcard-tls
acmeDns: {enabled: false}
envoyGateway: {enabled: true}   # 北向唯一入口(Gateway API);light 覆盖见 values/light/envoy-gateway-light.yaml
# 平台库进 K8s(CloudNativePG)时打开;默认用托管 PG(deploy/README.md「生产数据库要求」)
cnpg: {enabled: false}
# 日志栈(values/light/loki-light.yaml);置 false 整栈关掉后 API 审计日志留存只剩 DB audit_log
loki: {enabled: true}
logCollector: {enabled: true}
