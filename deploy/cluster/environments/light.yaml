# light 档(k3s 单机/小规模):仅共享档(hami 池)SKU;dedicated/mig 需 full 集群。
# CNI 用 k3s 内置 flannel(不装 Cilium);GPU 栈用 HAMi 直装(不装 gpu-operator);
# 监控 kps 精简 values。
# TopoLVM 是实例盘的强制依赖(每个租户 Pod 都要挂),前提是该机已建出 VG superdl-nvme;
# JuiceFS 是可选项,只有数据盘用。
cilium: {enabled: false}
gpuOperator: {enabled: false}
hami: {enabled: true}
gfd: {enabled: true}
dcgmExporter: {enabled: true}   # 节点级 GPU 曲线/XID 告警的指标源(full 档由 gpu-operator 自带)   # light 无 gpu-operator,GFD 单独装(hami 池 nvidia.com/gpu.count 标签的来源)
kps: {enabled: true}
juicefs: {enabled: false}
topolvm: {enabled: true}
certManager: {enabled: true}
# acme-dns 不装:其 LoadBalancer 53 在 k3s klipper-lb 上会占节点 hostPort 53、劫持节点自身 DNS(见 helmfile 注释);
# light 档租户 Jupyter 泛域名证书用平台侧现成通配证书灌成 superdl/superdl-jupyter-wildcard-tls
acmeDns: {enabled: false}
ingressNginx: {enabled: true}
# 平台库进 K8s(CloudNativePG)时打开;默认关闭 = 用托管 PG(见 deploy/README.md「生产数据库要求」)
cnpg: {enabled: false}
# 日志栈:默认同开(资源已收紧,见 values/light/loki-light.yaml);
# 单机盘紧张可置 false 整栈关掉(API 审计日志 ≥6 个月留存义务随之回到 DB audit_log 一路)
loki: {enabled: true}
logCollector: {enabled: true}
