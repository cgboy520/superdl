# full 档(RKE2 生产):全组件。用法:helmfile -e full apply
cilium: {enabled: true}
gpuOperator: {enabled: true}
hami: {enabled: true}
kataDeploy: {enabled: true}   # dedicated 档运行时;chart 按 k8sDistribution=rke2 写 rke2 的 containerd 配置
kps: {enabled: true}
juicefs: {enabled: true}
topolvm: {enabled: true}
certManager: {enabled: true}
acmeDns: {enabled: true}   # DNS01 中转(公网 53 经真实 LB 暴露);随 cert-manager presync 应用
ingressNginx: {enabled: true}
# 平台库进 K8s(CloudNativePG)时打开;默认关闭 = 用托管 PG(见 deploy/README.md「生产数据库要求」)
cnpg: {enabled: false}
# 日志栈:Loki + Alloy 采集;API 审计日志经 Loki 留存 ≥6 个月
loki: {enabled: true}
logCollector: {enabled: true}
