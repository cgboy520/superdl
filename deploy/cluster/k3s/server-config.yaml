write-kubeconfig-mode: "0640"
flannel-backend: none
disable-network-policy: true
disable-kube-proxy: true
disable:
  - traefik
secrets-encryption: true
agent-token: "CHANGE_ME_AGENT_TOKEN"
embedded-registry: true
# Embedded etcd even on a single server (a server with an existing SQLite datastore migrates automatically when restarted with this option); snapshots stay local, off-host encryption is done by k3s/state-backup.sh
cluster-init: true
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 28
etcd-snapshot-dir: /var/lib/rancher/k3s/server/db/snapshots
kube-apiserver-arg:
  - enable-admission-plugins=NodeRestriction
  - audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
  - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
  - audit-log-maxage=30
  - audit-log-maxsize=100
  - audit-log-maxbackup=100
