# /var/lib/rancher/<rke2|k3s>/agent/etc/kubelet.conf.d/50-superdl.conf —— kubelet 配置 drop-in
# (k3s/rke2 自动按文件名序合并进 kubelet 配置;00-*.conf 由发行版自管)。server 节点由 ansible 分发,
# GPU 节点由 node-join.sh 写同内容。podPidsLimit:单 Pod PID 上限(默认 -1 = 无限),fork bomb 会耗尽
# 节点进程表拖垮 kubelet/containerd,殃及同机租户;改值须与 node-join.sh 的 POD_PIDS_LIMIT 同步。
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
podPidsLimit: 4096
