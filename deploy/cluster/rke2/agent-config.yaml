# /etc/rancher/rke2/config.yaml —— GPU agent 节点(装机后按池打标签)
# 配套:registries.yaml 必须同步分发到本节点(Spegel P2P + registry mirror)
# 新节点首选管理端「添加节点」一键命令,会自动生成本文件与 registries.yaml
# HA 集群填控制面 VIP:agent 只连这个地址注册/续证,填单台 server IP 则该 server 宕机时新节点
# 无法加入(在册节点靠客户端证书,不受影响)。单 server 集群填该 server IP。
server: https://<api-vip>:9345
# token 必须是专用 agent token(server-config.yaml 的 agent-token 值),禁止填 server 的
# node-token:server token 能再拉 server 进 etcd 环,落到跑租户负载的 GPU 节点等于把控制面
# 钥匙挂在最不安全的机器上。平台「集群接入」的 cluster_join_token 录的也是 agent token。
token: <cluster-token>
node-label:
  - "superdl.io/pool=<kata|hami|mig|cpu>" # 分池铁律:装机时定池,Kata 与 HAMi 永不混布;cpu = 无卡机池
