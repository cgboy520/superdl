# /etc/rancher/rke2/registries.yaml —— 分发到全部节点(server + agent),改动后重启 rke2 服务生效
# 作用:①声明参与 Spegel P2P 共享的仓库(embedded-registry,见 server-config.yaml)
#      ②把 registry.superdl.local 指到托管镜像仓(P1-7:阿里云 ACR 企业版或 Harbor,https)
# 分发途径:GPU 节点由管理端一键加入脚本(node-join.sh)按平台配置 node_registries_yaml 落位;
#          server 节点手工放到同一路径后重启 rke2-server。本文件是该模板的仓库副本
mirrors:
  "*": {}                    # 所有仓库参与 P2P:任一节点已缓存的镜像,其余节点内网互拉(latest tag 除外)
  registry.superdl.local:
    endpoint:
      # 托管仓地址(ACR 企业版:<instance>-registry.cn-<region>.cr.aliyuncs.com;Harbor:harbor.<域>)。
      # 替换 CHANGE_ME_REGISTRY_HOST 为真实主机名(不含 scheme 时默认 https;显式 https 更清楚)。
      # 集群内自建 registry(明文 http)已退役、清单已删除;接入流程见
      # runbooks/image-prewarm.md「托管仓迁移」节。
      - "https://CHANGE_ME_REGISTRY_HOST"
# 托管仓拉取凭据:节点 pull 用。ACR 用独立访问凭据(非主账号 AK);Harbor 用机器人账户。
# CHANGE_ME_REGISTRY_PASSWORD 替换后须同步 管理端·平台配置·集群接入 的 node_registries_yaml
# (DB 覆盖层)——新节点的 registries.yaml 由平台按该模板生成下发,不更新则新节点无法 pull。
configs:
  registry.superdl.local:
    auth:
      username: CHANGE_ME_REGISTRY_USERNAME
      password: CHANGE_ME_REGISTRY_PASSWORD
# 托管仓迁移说明(P1-7):
# - 镜像引用主机名不变(registry.superdl.local 为逻辑名,经本 mirror 解析),seed/测试/前端占位均无需改;
# - 托管仓自带 TLS/扫描/权限,原「明文 http + htpasswd + NetworkPolicy 收窄」的残余风险整体消除;
# - 租户 Pod 的 Egress NetworkPolicy 已禁全部私网段(app/core/k8s/real.py PRIVATE_CIDRS),
#   托管仓为公网/专网地址时须确认租户 Egress 白名单不含该地址(防租户直拉平台镜像面)。
