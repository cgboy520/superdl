# /etc/rancher/rke2/audit-policy.yaml —— apiserver 审计策略
# server-config.yaml 的 audit-policy-file 指向本文件:两个文件必须一起拷到
# /etc/rancher/rke2/,缺失时 kube-apiserver 起不来(fail-fast)。
# 取向:租户隔离与凭据访问全留痕,高频只读噪声降级/丢弃,控制日志量。
apiVersion: audit.k8s.io/v1
kind: Policy
# 认证阶段失败(RequestReceived 之外)不重复记
omitStages:
  - RequestReceived
rules:
  # 高频系统读噪声:不记
  - level: None
    users: ["system:kube-proxy", "system:apiserver", "system:kube-scheduler", "system:kube-controller-manager"]
    verbs: ["get", "list", "watch"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/metrics", "/version", "/openapi*"]
  # lease 心跳(每节点每秒级)不记
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
  # Secret/ConfigMap/Token:谁在什么时候动了凭据必须可追溯;
  # 只记元数据,永不把 Secret 内容写进审计日志
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
  # 平台与租户命名空间内的写操作:记请求体(排查「谁改了租户 Pod/NetPol」)
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: ""
      - group: "apps"
      - group: "batch"
      - group: "networking.k8s.io"
      - group: "rbac.authorization.k8s.io"
  # 其余资源的写操作:记元数据
  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  # 兜底:读操作不记(上面未匹配到的)
  - level: None
