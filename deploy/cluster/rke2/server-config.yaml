write-kubeconfig-mode: "0640"
cni: none
disable:
  - rke2-ingress-nginx
  - rke2-canal
secrets-encryption: true
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 12
etcd-s3: true
etcd-s3-bucket: "CHANGE_ME_ETCD_SNAPSHOT_BUCKET"
etcd-s3-region: "CHANGE_ME_ETCD_S3_REGION"
etcd-s3-endpoint: "CHANGE_ME_ETCD_S3_ENDPOINT"
etcd-s3-access-key: "CHANGE_ME_ETCD_S3_ACCESS_KEY"
etcd-s3-secret-key: "CHANGE_ME_ETCD_S3_SECRET_KEY"
etcd-s3-folder: "etcd-snapshots"
agent-token: "CHANGE_ME_AGENT_TOKEN"
embedded-registry: true
supervisor-metrics: true
kube-apiserver-arg:
  - enable-admission-plugins=NodeRestriction
  - audit-policy-file=/etc/rancher/rke2/audit-policy.yaml
  - audit-log-path=/var/lib/rancher/rke2/server/logs/audit.log
  - audit-log-maxage=30
  - audit-log-maxsize=100
  - audit-log-maxbackup=100
node-taint:
  - "CriticalAddonsOnly=true:NoExecute"
