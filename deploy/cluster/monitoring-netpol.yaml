apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-access
  namespace: monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: loki}
      ports:
        - {protocol: TCP, port: 7946}
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [alloy, grafana, prometheus]}
      ports:
        - {protocol: TCP, port: 3100}
