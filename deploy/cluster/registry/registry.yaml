# 集群内私有镜像仓库:registry.superdl.local 的真实落点。
# 哑仓库(无 UI/扫描/租户),只服务平台镜像的 push(运维经 kubectl port-forward)与
# pull(节点 registries.yaml mirror 到 ClusterIP)。
# 应用:kubectl apply -f registry.yaml。htpasswd 凭据不落 git(占位
# 口令的 bcrypt hash 已泄漏,不得入库),apply 前必须手工建 Secret——缺失则
# registry Pod 挂载失败、永不就绪,Service 保持无端点(预期兜底,建好后自动恢复):
#   htpasswd -nbB ops '<强口令>' > htpasswd   # 生成法见 runbooks/image-prewarm.md
#   kubectl -n registry create secret generic registry-htpasswd --from-file=htpasswd
#   rm -f htpasswd                            # 用后即焚
# 轮换:重建 Secret → kubectl -n registry rollout restart deploy/registry → 同步全部节点
# configs.auth(滚动顺序铁律:先铺节点凭据,后开仓库认证,见 runbooks/image-prewarm.md)。
# 开启认证后,新节点的 registries.yaml 须在 管理端·平台配置·集群接入 的
# node_registries_yaml(DB 覆盖层)放入含 configs.auth 的完整模板。
# 残余边界:ClusterIP 仅集群内可达(节点经 kube-proxy 回源),机房防火墙不得把集群
# 网段对外暴露;TLS 升级路径见文件末尾 Service 注释。
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: ["ReadWriteOnce"]
  # 存储移出 GPU 节点 superdl-nvme VG(原 topolvm-provisioner,与实例盘同源、
  # 挤占 GPU 节点盘位)——改 JuiceFS 共享卷:registry 已固定在控制面/infra 节点(下方
  # nodeSelector),JuiceFS 与其解耦,且仓库内容全部可重 push(灾备见
  # runbooks/image-prewarm.md),对共享卷性能无硬要求。RWO:registry 单副本(strategy
  # Recreate),无需 RWX。light 档默认无 JuiceFS:改回 topolvm-provisioner(此时 registry
  # 落回单机,占 superdl-nvme VG,单机可接受)。
  storageClassName: superdl-juicefs
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy:
    type: Recreate               # RWO 卷(现 JuiceFS,见 PVC 注释),单副本不允许并存滚动
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      automountServiceAccountToken: false
      # 平台组件与租户隔离:迁到控制面/infra 节点运行(存储已改 JuiceFS 共享卷,
      # 不再要求目标节点建出 TopoLVM VG,见上方 PVC 注释),
      # 优先级压过租户 Pod,节点资源紧张时不与租户同级被驱逐。
      priorityClassName: system-cluster-critical
      nodeSelector:
        # full 档 RKE2 server / light 档 k3s server 自带该标签;自建 infra 节点改打
        # node-role.kubernetes.io/infra: "true" 并同步改此处。GPU 节点不得带此标签。
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        # 容忍控制面/infra 节点的 CriticalAddonsOnly=true:NoExecute(rke2/server-config.yaml node-taint)
        - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000            # PVC 数据目录写权限
      containers:
        - name: registry
          image: registry:3.0.0  # distribution v3,钉版本
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: superdl-registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            # 关闭 API DELETE(防误删/恶意删 manifest)。空间回收走 Pod 内
            # `registry garbage-collect /etc/registry/config.yml -m`(二进制直操作存储,
            # 不受本开关影响),见 runbooks/image-prewarm.md。
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
          # 认证开启后 /v2/ 匿名返回 401,httpGet 探针会误判不就绪,故用 TCP 探活
          readinessProbe:
            tcpSocket: {port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5000}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:       # 最小权限基线(数据写 PVC,根文件系统可只读)
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: auth
          secret:
            secretName: registry-htpasswd
---
# 默认拒绝入方向;放行段为注释示例——取消注释并把 CIDR 改成真实 节点网段+运维网段
# (可多段)后才生效,未启用前 = 全拒绝(registry 完全不可达,属安全默认)。
# 节点 pull 经 ClusterIP 回源(源地址为节点 IP)、运维 push 经
# `kubectl -n registry port-forward svc/registry 5000`(源地址折进节点网段),均需被放行。
# Cilium 若对本 Service 做 SNAT,源地址会折进节点网段,本策略仍生效。
# 注意:light 档 k3s 默认自带 netpol 控制器(内嵌 kube-router),NetworkPolicy 照常执行;
# 外层防火墙仍建议作为第二道边界(等效性核查见 runbooks/cluster-validation.md)。
# preflight.sh 会校验集群内必须存在本 NetworkPolicy 才放行部署。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-default-deny
  namespace: registry
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  # 放行示例(整段注释,按实际网段启用后重新 apply):
  # ingress:
  #   - from:
  #       - ipBlock: {cidr: "<node-ops-cidr>/24"}
  #     ports:
  #       - {protocol: TCP, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: ClusterIP              # 由 NodePort 30500 收编为 ClusterIP,不再全节点开端口;
                               # ClusterIP 稳定且 kube-proxy 全节点编程,节点 host 网络
                               # (containerd pull)可达,装机链路不断;节点 endpoint 见
                               # ../rke2/registries.yaml。
  selector: {app: registry}
  ports:
    - port: 5000
      targetPort: 5000
# 残余风险:集群内任意能触达 ClusterIP 的主体,凭 htpasswd 口令即可 push/pull;口令强度与
# 分发范围因此成为边界(叠加租户 Egress NetworkPolicy 禁全部私网段兜底,ClusterIP 段在其内)。
# TLS 升级路径:registry 加 REGISTRY_HTTP_TLS_CERTIFICATE/KEY(cert-manager 签内网 CA 证书),
# 节点 registries.yaml 的 endpoint 改 https 并配 configs.tls.ca_file;之后再评估 mutual TLS。
# 未上 TLS 前,口令在内网明文传输,须按季度轮换。
