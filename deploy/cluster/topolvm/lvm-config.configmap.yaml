# topolvm lvmd 的 LVM 配置:lvremove 时发 NVMe TRIM(跨租户数据残留防护)。只写差异项。
# 由 helmfile topolvm release 的 presync hook 应用,自带 Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: topolvm-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: topolvm-lvm-config
  namespace: topolvm-system
  labels:
    superdl.io/managed: "true"
data:
  lvm.conf: |
    # 实例盘销毁发 NVMe TRIM
    devices {
        issue_discards = 1
    }
