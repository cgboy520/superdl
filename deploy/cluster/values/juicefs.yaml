# JuiceFS CSI(JuiceFS 1.4.x LTS)。
# 后端用云 OSS 或自建 SeaweedFS 4.4x。
# 凭据零明文:预建 Secret,values 只引用。
# 元数据引擎用 PostgreSQL:
#   - 独立 database(juicefs_meta)+ 独立最小授权账号(juicefs,仅该库权限,禁止复用超管);
#   - 复用平台 PG 备份体系(WAL 归档 + 每日备份,见 runbooks/pg-backup-restore.md);
#   kubectl -n kube-system create secret generic superdl-juicefs-secret \
#     --from-literal=name=superdl-data \
#     --from-literal=metaurl='postgres://juicefs:<password>@<pg-host>:5432/juicefs_meta?sslmode=require' \
#     --from-literal=storage=oss \
#     --from-literal=bucket='https://<bucket>.<oss-endpoint>' \
#     --from-literal=access-key=<ak> --from-literal=secret-key=<sk>
# SC 名须与 apps/api/app/core/k8s/base.py 的 JUICEFS_STORAGE_CLASS 一致;
# 不得叫 juicefs-shared,那是每租户 ns 里 PVC 的名字。
storageClasses:
  - name: superdl-juicefs
    enabled: true
    reclaimPolicy: Retain
    existingSecret: superdl-juicefs-secret
    # 不开 writeback:异步写回下节点崩溃会丢未上传写入,而该 SC 承载用户付费数据盘。
    # 性能基线以 fio 实测为准(runbooks/cluster-validation.md D 节)
    mountOptions:
      - cache-size=102400        # 热数据本地缓存 100G(读缓存,无写丢失面)
