alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "tenant"
          replacement   = "platform"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "tenant-.+"
          target_label  = "tenant"
          replacement   = "tenant"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.tenant.receiver]
      }

      local.file_match "apiserver_audit" {
        path_targets = [{
          __path__   = "/host-logs/*/server/logs/audit.log",
          job        = "kube-apiserver-audit",
          component  = "kube-apiserver",
          tenant     = "platform",
        }]
        sync_period = "10s"
      }

      loki.source.file "apiserver_audit" {
        targets    = local.file_match.apiserver_audit.targets
        forward_to = [loki.process.tenant.receiver]
      }

      loki.process "tenant" {
        forward_to = [loki.write.default.receiver]
        stage.replace {
          expression = "(?i)(token=)[A-Za-z0-9_\\-]+"
          replace    = "${1}<redacted>"
        }
        // apiserver 审计行里 Pod 模板的 JUPYTER_TOKEN / AUTHORIZED_KEYS 明文
        stage.replace {
          expression = "(\"name\":\"(?:JUPYTER_TOKEN|AUTHORIZED_KEYS)\",\"value\":\")[^\"]*"
          replace    = "${1}<redacted>"
        }
        stage.tenant {
          source = "tenant"
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  mounts:
    extra:
      - name: rke2-audit-logs
        mountPath: /host-logs/rke2/server/logs
        readOnly: true
      - name: k3s-audit-logs
        mountPath: /host-logs/k3s/server/logs
        readOnly: true
# 只保留 discovery.kubernetes(pod)+ loki.source.kubernetes 所需;无 secrets / configmaps。
# Alloy 是 DaemonSet,跑在全部租户 GPU 节点上,其 SA token 不得能读任何 Secret(CI helm 渲染断言)。
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "services", "endpoints"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
controller:
  tolerations:
    - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  volumes:
    extra:
      - name: rke2-audit-logs
        hostPath: {path: /var/lib/rancher/rke2/server/logs, type: DirectoryOrCreate}
      - name: k3s-audit-logs
        hostPath: {path: /var/lib/rancher/k3s/server/logs, type: DirectoryOrCreate}
