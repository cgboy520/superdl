# Grafana Alloy 日志采集。chart 版本钉在 ../helmfile.yaml.gotmpl。
alloy:
  configMap:
    content: |
      // ── 集群容器日志:全命名空间 Pod ──
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 标签收敛为 namespace/pod/container/app;再按 namespace 打 Loki 租户标签
      // (auth_enabled=true 后 X-Scope-OrgID 必填):tenant-* = tenant,其余 = platform
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // 顺序敏感:先全员 platform 兜底,再让 tenant-* 覆盖为 tenant
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "tenant"
          replacement   = "platform"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "tenant-.+"
          target_label  = "tenant"
          replacement   = "tenant"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.tenant.receiver]
      }

      // ── 控制面 apiserver 审计日志(rke2/k3s server 节点宿主机文件,
      //    路径见 ../rke2/server-config.yaml 与 ../k3s/server-config.yaml 的
      //    audit-log-path;卷挂载已收窄到 server/logs,见本文件 alloy.mounts.extra)──
      local.file_match "apiserver_audit" {
        path_targets = [{
          __path__   = "/host-logs/*/server/logs/audit.log",
          job        = "kube-apiserver-audit",
          component  = "kube-apiserver",
          tenant     = "platform",
        }]
        sync_period = "10s"
      }

      loki.source.file "apiserver_audit" {
        targets    = local.file_match.apiserver_audit.targets
        forward_to = [loki.process.tenant.receiver]
      }

      // 按 tenant 标签打 X-Scope-OrgID(Loki auth_enabled=true 必需)
      loki.process "tenant" {
        forward_to = [loki.write.default.receiver]
        stage.tenant {
          source = "tenant"
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  # 采集 agent 每节点一只,按 kps-light 的 node-exporter 量级(20m/32Mi)留一倍余量;
  # 日志洪峰靠 Loki 侧摄入限流兜底。
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  mounts:
    extra:
      # 只挂 apiserver 审计日志目录(server/logs),不挂整棵 /var/lib/rancher:
      # 后者含 node-token、cluster-admin kubeconfig、集群 CA 与 etcd 快照,
      # 「只读」挡不住「读到即拥有」的凭据泄漏。rke2/k3s 路径分开挂,
      # DirectoryOrCreate 对不存在的发行版建空目录,file_match 自然无目标。
      - name: rke2-audit-logs
        mountPath: /host-logs/rke2/server/logs
        readOnly: true
      - name: k3s-audit-logs
        mountPath: /host-logs/k3s/server/logs
        readOnly: true
controller:
  # DaemonSet 每节点一只;控制面节点的 apiserver 审计文件也要采,必须容忍 server 侧 taint
  # (full 档 CriticalAddonsOnly + 标准 control-plane 污点)
  tolerations:
    - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  volumes:
    extra:
      - name: rke2-audit-logs
        hostPath: {path: /var/lib/rancher/rke2/server/logs, type: DirectoryOrCreate}
      - name: k3s-audit-logs
        hostPath: {path: /var/lib/rancher/k3s/server/logs, type: DirectoryOrCreate}
