deploymentMode: Monolithic
loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  storage:
    type: filesystem
  pattern_ingester: {enabled: true}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 4320h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 10MB
    max_global_streams_per_user: 10000
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  automountServiceAccountToken: false
  persistence:
    enabled: true
    storageClass: superdl-cephfs
    accessModes: ["ReadWriteMany"]
    size: 50Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
minio: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
gateway: {enabled: false}
test: {enabled: false}
monitoring:
  serviceMonitor:
    enabled: true
# Loki does not access the apiserver: the ruler sidecar is off (the only chart component needing cluster-wide configmaps/secrets read),
# the rendered loki-clusterrole has empty rules; neither the SA nor the Pod mounts a token.
sidecar:
  rules:
    enabled: false
serviceAccount:
  automountServiceAccountToken: false
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}
