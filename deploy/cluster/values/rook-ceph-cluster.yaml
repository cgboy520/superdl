operatorNamespace: rook-ceph

toolbox:
  enabled: true

cephClusterSpec:
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 1
    allowMultiplePerNode: false
  dashboard:
    enabled: false
  storage:
    useAllNodes: false
    useAllDevices: false
    storageClassDeviceSets:
      - name: superdl-nvme
        count: 3
        portable: false
        encrypted: false
        placement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - {key: app, operator: In, values: [rook-ceph-osd, rook-ceph-osd-prepare]}
                topologyKey: kubernetes.io/hostname
        preparePlacement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - {key: app, operator: In, values: [rook-ceph-osd, rook-ceph-osd-prepare]}
                topologyKey: kubernetes.io/hostname
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              resources:
                requests:
                  storage: 500Gi
              storageClassName: topolvm-provisioner
              volumeMode: Block
              accessModes: [ReadWriteOnce]

cephBlockPools: []
cephObjectStores: []

cephFileSystems:
  - name: superdl-fs
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - name: data0
          failureDomain: host
          replicated:
            size: 2
      metadataServer:
        activeCount: 1
        activeStandby: true
        priorityClassName: system-cluster-critical
        resources:
          requests: {cpu: 500m, memory: 2Gi}
          limits: {memory: 4Gi}
    storageClass:
      enabled: true
      name: superdl-cephfs
      isDefault: false
      pool: data0
      # 数据盘删除即由 CSI 删子卷;存量 PV 的 persistentVolumeReclaimPolicy 不随 SC 改,迁移见 runbooks/cluster-validation.md「D. 存储」
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      mountOptions: []
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4
