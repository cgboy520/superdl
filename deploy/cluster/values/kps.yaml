# kube-prometheus-stack 88.x:Prometheus 本地 15 天,长期数据进 PostgreSQL(usage_hourly)
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "40GB"      # 约为 PVC 的 80%,到量先删最旧块,与 retention 双闸
    # 持久化:默认 emptyDir 意味着 Pod 重建丢全部指标历史(用量对账曲线断档)。
    # 升级路径(已部署集群):StatefulSet 的 volumeClaimTemplates 不可变,需先
    # `kubectl -n monitoring delete sts prometheus-kube-prometheus-stack-prometheus --cascade=orphan`
    # 再 helmfile apply(或接受重建;空窗期告警仍由 Alertmanager 工作,历史指标可放弃)。
    storageSpec:
      volumeClaimTemplate:
        spec:
          # P1-34:共享存储(JuiceFS,RWX)而非节点本地 NVMe——节点死后可跨节点重调度
          # 重挂载(本地卷随节点一起丢)。取舍记录:监控指标可重建(长期数据已进 PG
          # usage_hourly)、JuiceFS 性能对监控查询足够,节点复活前历史查询断档可接受。
          # light 档默认无 JuiceFS,由 values/light/kps-light.yaml 覆盖回 topolvm。
          storageClassName: superdl-juicefs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 50Gi}
    # 副本数暂保 1(取舍,P0-10 后续):可用性由 JuiceFS 底层(元数据走 PG、数据走对象存储)
    # 与跨节点重调度提供;双副本 Prometheus 需双份存储 + 查询去重,对「可重建的监控数据」
    # 不抵成本。判据变化(如对监控查询连续性有 SLA)再评 Thanos/双副本。
    replicas: 1
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}    # 只限内存:CPU 限速会拖慢查询/规则评估,OOMKill 反而更可见
    # postgres_exporter(最小方案记录):cnpg 进集群时 operator 自带监控
    # (values/cnpg-cluster.yaml monitoring.enabled=true,生成 PodMonitor + 默认规则,
    # 无需另起 exporter);托管 PG 走云厂商指标,不在本栈抓取——故此处不重复加
    # postgres_exporter additionalScrapeConfigs。
    # HAMi 自带指标:scheduler 的池级 vGPU 分配 + vGPUmonitor 的容器级利用率
    # (共享档实例曲线的数据源;端口/标签为 HAMi v2.9 默认值)
    additionalScrapeConfigs:
      - job_name: hami-scheduler
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: hami-scheduler
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: monitor
            action: keep
      - job_name: hami-device-plugin
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: hami-device-plugin
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9394"
            action: keep
grafana:
  # 管理员口令不落 values,经 Secret 注入(默认 prom-operator 口令必须废弃):
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password=<强口令>
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    security:
      # 管理端节点页是自绘曲线 + 「在 Grafana 打开」外链,不做 iframe 嵌入,
      # 故不放开内嵌、cookie 不跨站;改用 iframe 方案时这三项须一起改。
      allow_embedding: false
      content_security_policy: true
      content_security_policy_template: >-
        frame-ancestors 'self';
        default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline'; img-src 'self' data:;
      cookie_secure: true
      cookie_samesite: lax
    auth.anonymous:
      enabled: false
  # Dashboard as code:SuperDL 基础大盘随监控栈 provisioning(sidecar 发现 grafana_dashboard
  # ConfigMap),实例/账单/节点三面板起步。改盘 = 改本 values(随仓库评审);Grafana UI 内
  # 手改不落盘、Pod 重启即失,需要长期盘一律回写这里。light 档 grafana.enabled=false 时忽略。
  dashboards:
    superdl:
      superdl-overview:
        json: |
          {
            "uid": "superdl-overview",
            "title": "SuperDL 总览",
            "schemaVersion": 39,
            "version": 1,
            "editable": false,
            "timezone": "browser",
            "time": {"from": "now-6h", "to": "now"},
            "panels": [
              {
                "id": 1,
                "title": "实例编排健康",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(superdl_reconcile_stuck_instances)",
                    "legendFormat": "悬挂实例({{status}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_instance_node_lost_total[1h])",
                    "legendFormat": "节点失联判停/h"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_outbox_dead_total[1h])",
                    "legendFormat": "outbox 死信/h({{task_type}})"
                  }
                ]
              },
              {
                "id": 2,
                "title": "账单结算",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "superdl_settlement_lag_windows",
                    "legendFormat": "结算水位滞后窗口({{kind}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_settlement_failed_total[1h])",
                    "legendFormat": "结算失败/h({{kind}})"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_fund_reconcile_mismatch_total[1h])",
                    "legendFormat": "账实不平/h({{kind}})"
                  }
                ]
              },
              {
                "id": 3,
                "title": "节点与 GPU",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
                    "legendFormat": "Ready 节点数"
                  },
                  {
                    "refId": "B",
                    "expr": "avg by (node) (DCGM_FI_DEV_GPU_UTIL)",
                    "legendFormat": "GPU 利用率%({{node}})"
                  },
                  {
                    "refId": "C",
                    "expr": "max by (node) (DCGM_FI_DEV_GPU_TEMP)",
                    "legendFormat": "GPU 温度°C({{node}})"
                  }
                ]
              }
            ]
          }
alertmanager:
  config:
    route:
      receiver: superdl-api
      group_by: [alertname, namespace]
      repeat_interval: 4h
      routes:
        # critical 多通道:平台 webhook 之外必须有不依赖平台自身的路(邮件 + 钉钉机器人)
        - matchers: ['severity="critical"']
          receiver: superdl-oncall-mail
          continue: true
        - matchers: ['severity="critical"']
          receiver: superdl-dingtalk
          continue: true
        # Watchdog(severity=none)只用于链路探活,直接进 null 不通知;
        # 排在通配路由之前,不匹配 continue,到此为止
        - matchers: ['severity="none"']
          receiver: "null"
        # warning 只走平台 webhook(管理端告警中心)
        - matchers: ['severity=~".+"']
          receiver: superdl-api
    inhibit_rules:
      # Watchdog 抑制:任一真实告警 firing 期间,探活 Watchdog 不再重复通知(降噪);
      # Watchdog 本身路由到 null,这里兜底多通道/未来路由变更时的刷屏
      - source_matchers: ['severity=~"warning|critical"']
        target_matchers: ['alertname="Watchdog"']
      # 同故障只报最高级:critical 抑制同名同租户的 warning
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ['alertname', 'namespace']
    receivers:
      - name: "null"           # Watchdog 等探活告警的丢弃口
      - name: superdl-api
        webhook_configs:
          - url: "http://superdl-api.superdl.svc:80/api/v1/webhooks/alertmanager"
            http_config:
              authorization:
                type: Bearer
                # 凭据不落 values:经 Secret 挂载读取
                # kubectl -n monitoring create secret generic superdl-alert-token \
                #   --from-literal=token=<随机强 token>
                credentials_file: /etc/alertmanager/secrets/superdl-alert-token/token
      # 第二通道必填:外部 SMTP,不经过平台任何组件;留占位值等于没有第二通道。
      - name: superdl-oncall-mail
        email_configs:
          - to: "oncall@superdl.example.com"          # CHANGE_ME
            from: "alertmanager@superdl.example.com"  # CHANGE_ME
            smarthost: "smtp.example.com:465"         # CHANGE_ME(外部邮件服务商)
            auth_username: "alertmanager@superdl.example.com"  # CHANGE_ME
            auth_password_file: /etc/alertmanager/secrets/superdl-smtp-password/password
            require_tls: true
      # 第三通道(仅 critical):钉钉群机器人。Alertmanager 原生不签发钉钉格式,
      # 经 prometheus-webhook-dingtalk 转换器中转,sidecar 部署方式见 alertmanagerSpec 注释;
      # 转换器不可用时本通道静默失败,邮件 + 平台 webhook 仍兜底。
      - name: superdl-dingtalk
        webhook_configs:
          - url: "http://localhost:8060/dingtalk/oncall/send"
  alertmanagerSpec:
    # silence/通知状态持久化:默认 emptyDir,Pod 重建后进行中的静默全部丢失
    storage:
      volumeClaimTemplate:
        spec:
          # P1-34:同 Prometheus——共享存储(JuiceFS,RWX),节点死后单副本可跨节点重调度;
          # 取舍记录见上方 prometheusSpec 存储/副本注释。
          storageClassName: superdl-juicefs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 2Gi}
    secrets:
      - superdl-alert-token
      # kubectl -n monitoring create secret generic superdl-smtp-password \
      #   --from-literal=password=<SMTP 口令>
      - superdl-smtp-password
    # 钉钉触达(P0-10):prometheus-webhook-dingtalk 转换器以 sidecar 进 Alertmanager Pod
    # (不新增 helm release;superdl-dingtalk receiver 已指 http://localhost:8060/dingtalk/oncall/send)。
    # 上线时取消下面注释,镜像钉版本;access_token 不落 values,经 Secret 注入:
    #   kubectl -n monitoring create secret generic superdl-dingtalk-token \
    #     --from-literal=token=<钉钉机器人 access_token>
    # containers:
    #   - name: dingtalk-transformer
    #     image: timonwong/prometheus-webhook-dingtalk:v2.1.0   # TODO(上线前钉死最新稳定版)
    #     args:
    #       - --ding.profile=oncall=https://oapi.dingtalk.com/robot/send?access_token=$(DINGTALK_TOKEN)
    #     env:
    #       - name: DINGTALK_TOKEN
    #         valueFrom: {secretKeyRef: {name: superdl-dingtalk-token, key: token}}
    #     ports:
    #       - {containerPort: 8060}
    #     resources:
    #       requests: {cpu: 10m, memory: 32Mi}
    #       limits: {memory: 64Mi}
    # 机器人若开加签,image 版本需支持 secret 参数(一并经 Secret 注入);关键链路有邮件兜底。
additionalPrometheusRulesMap:
  superdl-gpu:
    groups:
      - name: superdl.gpu
        rules:
          - alert: GPUXidCriticalError
            expr: increase(DCGM_FI_DEV_XID_ERRORS{xid=~"48|63|64|79|94|95"}[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "GPU Xid 致命错误(节点 {{ $labels.node }}):自动 cordon + 补偿 SOP"}
          - alert: GPUHighTemperature
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "GPU 温度 >85°C 持续 5 分钟({{ $labels.node }})"}
          - alert: NodeGPUUnavailable
            expr: (kube_node_status_capacity{resource="nvidia_com_gpu"} > 0) and on(node) (kube_node_status_condition{condition="Ready",status="true"} == 0)
            for: 2m
            labels: {severity: critical}
            annotations: {summary: "GPU 节点 NotReady:{{ $labels.node }}"}
          - alert: SharedPoolUtilSaturated
            expr: avg by (node) (DCGM_FI_DEV_GPU_UTIL{superdl_pool="hami"}) > 95
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "共享池节点持续打满(超卖回调阈值 85% 参考)"}
          - alert: JuiceFSMountFailed
            expr: increase(juicefs_mount_errors_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "JuiceFS 挂载失败,数据盘可用性受影响"}
          - alert: HamiSchedulerDown
            expr: absent(up{job="hami-scheduler"} == 1)
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "HAMi scheduler 指标缺失:共享池调度器可能不可用,新建共享档实例将被拒绝"}
  # 证书过期预警:指标来自 cert-manager ServiceMonitor(values/cert-manager.yaml);
  # 覆盖 api/console/admin 入口证书与租户 Jupyter 泛域名证书。
  superdl-certmanager:
    groups:
      - name: superdl.certmanager
        rules:
          - alert: CertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
            labels: {severity: warning}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})7 天内到期:查 cert-manager 续签"}
          - alert: CertExpiringCritical
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 2 * 24 * 3600
            labels: {severity: critical}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})48 小时内到期:立即人工介入"}
          - alert: CertManagerMetricsMissing
            expr: absent(certmanager_certificate_expiration_timestamp_seconds)
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "cert-manager 指标缺失 1 小时:ServiceMonitor/组件异常,证书过期将无预警"}
  # 平台自身业务指标。抓取接线:deploy/app/k8s/08-monitoring.yaml
  # (API 走 ServiceMonitor + SUPERDL_METRICS_TOKEN Bearer;worker 走 PodMonitor)
  superdl-platform:
    groups:
      - name: superdl.platform
        rules:
          - alert: OutboxTaskDead
            expr: increase(superdl_outbox_dead_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "outbox 任务进入死信({{ $labels.task_type }}):编排执行链路断裂,管理端总览可重放"}
          - alert: SettlementFailed
            expr: increase(superdl_settlement_failed_total[1h]) > 0
            labels: {severity: critical}
            annotations: {summary: "结算失败({{ $labels.kind }}):检查 worker 日志,结算函数幂等可重跑"}
          - alert: SettlementLagging
            expr: superdl_settlement_lag_windows > 1
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "结算水位线落后 {{ $value }} 个窗口({{ $labels.kind }}):有账期未追平,worker 日志查失败实例"}
          - alert: PaymentCallbackMismatch
            expr: increase(superdl_payment_callback_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "支付回调金额与订单不符:疑似攻击或渠道异常,见财务异常清单"}
          - alert: InstanceNodeLost
            expr: increase(superdl_instance_node_lost_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "有租户实例因所在节点失联被判停:需人工核对是否退费"}
          - alert: LeakedPodsReclaimed
            expr: increase(superdl_reconcile_leaked_total[30m]) > 3
            labels: {severity: warning}
            annotations: {summary: "30 分钟内回收泄漏 Pod 超 3 个:编排链路可能存在系统性问题"}
          - alert: ApiHighErrorRate
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "API 5xx 率 >5% 持续 5 分钟"}
          - alert: PaymentClosedOrderRescued
            expr: increase(superdl_payment_closed_order_rescued_total[1h]) > 0
            labels: {severity: warning}
            annotations: {summary: "关单后回调自动入账发生:本地关单早于渠道过期,核对订单 TTL 与渠道 time_expire 是否同步"}
          - alert: OutboxTaskTimeout
            expr: increase(superdl_outbox_task_timeout_total[30m]) > 0
            labels: {severity: warning}
            annotations: {summary: "outbox 有任务被执行超时中断:队列全局串行,队头卡死会让全部编排请求排队"}
          # 以心跳 Gauge 判定存活:带 label 的 Counter 首次 inc 前无序列,不能用 absent
          - alert: WorkerDown
            expr: (time() - max(superdl_worker_heartbeat_timestamp_seconds)) > 120 or absent(superdl_worker_heartbeat_timestamp_seconds)
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "worker 心跳缺失超 2 分钟:outbox/结算/巡检/查单全部停摆"}
          - alert: PgBackupFailed
            expr: kube_job_status_failed{namespace="superdl", job_name=~"pg-backup-daily-.*"} > 0
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "PG 每日备份 Job 失败:资金库 RPO 正在拉长,立即处理"}
          - alert: PgBackupStale
            expr: (time() - max(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})) > 100800 or absent(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "PG 备份超 28h 无成功记录(CronJob 未跑或历史被清)"}
          # P0-11:资金/结算/巡检/查单/编排收尾的硬告警(指标定义见 apps/api/app/core/metrics.py)
          - alert: FundReconcileMismatch
            expr: increase(superdl_fund_reconcile_mismatch_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "资金账实不平({{ $labels.kind }}):余额与流水不一致,先冻结出账再人工核对"}
          - alert: SettlementGapRecorded
            expr: increase(superdl_settlement_gap_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "结算缺口登记({{ $labels.kind }}/{{ $labels.reason }}):有账期追不平,按缺口清单人工补结算"}
          - alert: PatrolFailed
            expr: increase(superdl_patrol_failed_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "余额巡检环节异常({{ $labels.stage }}):巡检停摆会掩盖账实漂移,查 worker 日志"}
          - alert: PaymentRecoverFailed
            expr: increase(superdl_payment_recover_failed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "查单收敛单笔入账失败({{ $labels.error }}):整轮不中断,该笔需人工核对入账"}
          # 悬挂实例是 Gauge(当前滞留数,非单调),不能用 increase:>0 持续 15 分钟即告警
          - alert: ReconcileStuckInstances
            expr: max(superdl_reconcile_stuck_instances) > 0
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "实例悬挂在 {{ $labels.status }} 超 15 分钟未收敛:编排收尾卡死,管理端实例详情人工介入"}
          - alert: ReconcileLeakAborted
            expr: increase(superdl_reconcile_leak_aborted_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "泄漏回收被熔断中止(未知 Pod 占比超阈):本轮泄漏未回收,人工核对节点残留"}
          - alert: CertNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})持续 10 分钟未就绪:查 cert-manager 签发事件与 DNS01 solver"}
