# kube-prometheus-stack 88.x:Prometheus 本地 15 天,长期数据进 PostgreSQL(usage_hourly)
prometheus:
  prometheusSpec:
    retention: 15d                       # 不引 Thanos
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 500m, memory: 2Gi}
grafana:
  # 管理员口令不落 values,经 Secret 注入(默认 prom-operator 口令必须废弃):
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password=<强口令>
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    security:
      allow_embedding: true              # 管理端 iframe 嵌入(反代注入只读 Viewer)
      # 防点击劫持:仅允许管理控制台域名内嵌(按环境替换域名)
      content_security_policy: true
      content_security_policy_template: >-
        frame-ancestors 'self' https://admin.superdl.example.com;
        default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline'; img-src 'self' data:;
      cookie_secure: true
      cookie_samesite: none              # 跨站 iframe 内会话所需(Secure 已开)
    auth.anonymous:
      enabled: false
alertmanager:
  config:
    route:
      receiver: superdl-api
      group_by: [alertname, namespace]
      repeat_interval: 4h
      routes:
        # critical 双通道:平台 webhook 之外必须有一条不依赖平台自身的路
        # (API/DB 挂掉时恰好是 webhook 送不出去的时刻 —— 自引用死结)
        - matchers: ['severity="critical"']
          receiver: superdl-oncall-mail
          continue: true
        - matchers: ['severity=~".+"']
          receiver: superdl-api
    receivers:
      - name: superdl-api
        webhook_configs:
          - url: "http://superdl-api.superdl.svc:8000/api/v1/webhooks/alertmanager"
            http_config:
              authorization:
                type: Bearer
                # 凭据不落 values:经 Secret 挂载读取
                # kubectl -n monitoring create secret generic superdl-alert-token \
                #   --from-literal=token=<随机强 token>
                credentials_file: /etc/alertmanager/secrets/superdl-alert-token/token
      # ⚠️ 上线前必填:独立第二通道(外部 SMTP,不经过平台任何组件)。
      # 占位值不影响 webhook 通道工作,但等于没有第二通道 —— 属上线前人工事项。
      - name: superdl-oncall-mail
        email_configs:
          - to: "oncall@superdl.example.com"          # CHANGE_ME
            from: "alertmanager@superdl.example.com"  # CHANGE_ME
            smarthost: "smtp.example.com:465"         # CHANGE_ME(外部邮件服务商)
            auth_username: "alertmanager@superdl.example.com"  # CHANGE_ME
            auth_password_file: /etc/alertmanager/secrets/superdl-smtp-password/password
            require_tls: true
  alertmanagerSpec:
    secrets:
      - superdl-alert-token
      # kubectl -n monitoring create secret generic superdl-smtp-password \
      #   --from-literal=password=<SMTP 口令>
      - superdl-smtp-password
additionalPrometheusRulesMap:
  superdl-gpu:
    groups:
      - name: superdl.gpu
        rules:
          # 5 条核心告警
          - alert: GPUXidCriticalError
            expr: increase(DCGM_FI_DEV_XID_ERRORS{xid=~"48|63|64|79|94|95"}[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "GPU Xid 致命错误(节点 {{ $labels.node }}):自动 cordon + 补偿 SOP"}
          - alert: GPUHighTemperature
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "GPU 温度 >85°C 持续 5 分钟({{ $labels.node }})"}
          - alert: NodeGPUUnavailable
            expr: (kube_node_status_capacity{resource="nvidia_com_gpu"} > 0) and on(node) (kube_node_status_condition{condition="Ready",status="true"} == 0)
            for: 2m
            labels: {severity: critical}
            annotations: {summary: "GPU 节点 NotReady:{{ $labels.node }}"}
          - alert: SharedPoolUtilSaturated
            expr: avg by (node) (DCGM_FI_DEV_GPU_UTIL{superdl_pool="hami"}) > 95
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "共享池节点持续打满(超卖回调阈值 85% 参考)"}
          - alert: JuiceFSMountFailed
            expr: increase(juicefs_mount_errors_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "JuiceFS 挂载失败,数据盘可用性受影响"}
  # 平台自身业务指标。抓取接线:deploy/app/k8s/08-monitoring.yaml
  # (API 走 ServiceMonitor + SUPERDL_METRICS_TOKEN Bearer;worker 走 PodMonitor:
  # 结算/死信/泄漏回收指标都在 worker 进程内,漏抓 = 这组告警永不触发)
  superdl-platform:
    groups:
      - name: superdl.platform
        rules:
          - alert: OutboxTaskDead
            expr: increase(superdl_outbox_dead_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "outbox 任务进入死信({{ $labels.task_type }}):编排执行链路断裂,管理端总览可重放"}
          - alert: SettlementFailed
            expr: increase(superdl_settlement_failed_total[1h]) > 0
            labels: {severity: critical}
            annotations: {summary: "结算失败({{ $labels.kind }}):检查 worker 日志,结算函数幂等可重跑"}
          - alert: PaymentCallbackMismatch
            expr: increase(superdl_payment_callback_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "支付回调金额与订单不符:疑似攻击或渠道异常,见财务异常清单"}
          - alert: LeakedPodsReclaimed
            expr: increase(superdl_reconcile_leaked_total[30m]) > 3
            labels: {severity: warning}
            annotations: {summary: "30 分钟内回收泄漏 Pod 超 3 个:编排链路可能存在系统性问题"}
          - alert: ApiHighErrorRate
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "API 5xx 率 >5% 持续 5 分钟"}
          - alert: PaymentClosedOrderRescued
            expr: increase(superdl_payment_closed_order_rescued_total[1h]) > 0
            labels: {severity: warning}
            annotations: {summary: "关单后回调自动入账发生:本地关单早于渠道过期,核对订单 TTL 与渠道 time_expire 是否同步"}
          # 带 label 的 Counter 首次 inc 前无序列,absent(superdl_outbox_dead_total)
          # 会在 worker 健康时常驻误报 —— 以心跳 Gauge 判定存活
          - alert: WorkerDown
            expr: (time() - max(superdl_worker_heartbeat_timestamp_seconds)) > 120 or absent(superdl_worker_heartbeat_timestamp_seconds)
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "worker 心跳缺失超 2 分钟:outbox/结算/巡检/查单全部停摆"}
          - alert: PgBackupFailed
            expr: kube_job_status_failed{namespace="superdl", job_name=~"pg-backup-daily-.*"} > 0
            labels: {severity: critical}
            annotations: {summary: "PG 每日备份 Job 失败:资金库 RPO 正在拉长,立即处理"}
          - alert: PgBackupStale
            expr: (time() - max(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})) > 100800 or absent(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})
            labels: {severity: warning}
            annotations: {summary: "PG 备份超 28h 无成功记录(CronJob 未跑或历史被清)"}
