# chart 自带的 ClusterRole 给 operator 集群级 secrets/configmaps *,关掉;等价且收窄的一套在 ../monitoring-rbac.yaml
# (helmfile presync 下发,名字带 superdl- 前缀,不与 chart 旧对象同名)。kube-state-metrics / node-exporter 子 chart 各自的 rbac 不受此键影响。
global:
  rbac:
    create: false
prometheusOperator:
  # operator 只在这些 ns 找 ServiceMonitor/PodMonitor/PrometheusRule;Prometheus/Alertmanager 实例与其 Secret informer 只在 monitoring。
  # 监控对象引用的 Secret 由 operator 按名 GET:引用凭据的 monitor 一律放 monitoring ns(../../app/k8s/08-monitoring.yaml)。
  namespaces:
    releaseNamespace: true
    additional:
      - superdl
      - kube-system
      - rook-ceph
      - gpu-operator
      - envoy-gateway-system
      - cert-manager
      - topolvm-system
      - cnpg-system
  prometheusInstanceNamespaces: [monitoring]
  alertmanagerInstanceNamespaces: [monitoring]
  alertmanagerConfigNamespaces: [monitoring]
  thanosRulerInstanceNamespaces: [monitoring]
kube-state-metrics:
  # 默认采集器去掉 secrets(其 ClusterRole 会随之少掉 secrets list/watch)
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - daemonsets
    - deployments
    - endpointslices
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments
prometheus:
  prometheusSpec:
    maximumStartupDurationSeconds: 900
    retention: 15d
    retentionSize: "40GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: superdl-cephfs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 50Gi}
    replicas: 1
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}
    additionalScrapeConfigs:
      - job_name: hami-scheduler
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: hami-scheduler
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: monitor
            action: keep
      - job_name: hami-device-plugin
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: hami-device-plugin
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: vgpu-monitor
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9394
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    security:
      allow_embedding: false
      content_security_policy: true
      content_security_policy_template: >-
        frame-ancestors 'self';
        default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline'; img-src 'self' data:;
      cookie_secure: true
      cookie_samesite: lax
    auth.anonymous:
      enabled: false
  additionalDataSources:
    - name: Loki(平台)
      uid: loki-platform
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: platform
    - name: Loki(租户)
      uid: loki-tenant
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: tenant
  dashboards:
    superdl:
      superdl-overview:
        json: |
          {
            "uid": "superdl-overview",
            "title": "SuperDL 总览",
            "schemaVersion": 39,
            "version": 1,
            "editable": false,
            "timezone": "browser",
            "time": {"from": "now-6h", "to": "now"},
            "panels": [
              {
                "id": 1,
                "title": "实例编排健康",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(superdl_reconcile_stuck_instances)",
                    "legendFormat": "悬挂实例({{status}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_instance_node_lost_total[1h])",
                    "legendFormat": "节点失联判停/h"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_outbox_dead_total[1h])",
                    "legendFormat": "outbox 死信/h({{task_type}})"
                  }
                ]
              },
              {
                "id": 2,
                "title": "账单结算",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "superdl_settlement_lag_windows",
                    "legendFormat": "结算水位滞后窗口({{kind}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_settlement_failed_total[1h])",
                    "legendFormat": "结算失败/h({{kind}})"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_fund_reconcile_mismatch_total[1h])",
                    "legendFormat": "账实不平/h({{kind}})"
                  }
                ]
              },
              {
                "id": 3,
                "title": "节点与 GPU",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
                    "legendFormat": "Ready 节点数"
                  },
                  {
                    "refId": "B",
                    "expr": "avg by (node) (DCGM_FI_DEV_GPU_UTIL)",
                    "legendFormat": "GPU 利用率%({{node}})"
                  },
                  {
                    "refId": "C",
                    "expr": "max by (node) (DCGM_FI_DEV_GPU_TEMP)",
                    "legendFormat": "GPU 温度°C({{node}})"
                  }
                ]
              }
            ]
          }
alertmanager:
  config:
    route:
      receiver: superdl-api
      group_by: [alertname, namespace]
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: superdl-oncall-mail
          continue: true
        - matchers: ['severity="critical"']
          receiver: superdl-dingtalk
          continue: true
        - matchers: ['severity="none"']
          receiver: "null"
        - matchers: ['severity=~".+"']
          receiver: superdl-api
    inhibit_rules:
      - source_matchers: ['severity=~"warning|critical"']
        target_matchers: ['alertname="Watchdog"']
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ['alertname', 'namespace']
    receivers:
      - name: "null"
      - name: superdl-api
        webhook_configs:
          - url: "http://superdl-api.superdl.svc:80/api/v1/webhooks/alertmanager"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/superdl-alert-token/token
      - name: superdl-oncall-mail
        email_configs:
          - to: "CHANGE_ME_ONCALL_MAIL"
            from: "CHANGE_ME_ALERT_FROM_MAIL"
            smarthost: "CHANGE_ME_SMTP_HOST:465"
            auth_username: "CHANGE_ME_SMTP_USERNAME"
            auth_password_file: /etc/alertmanager/secrets/superdl-smtp-password/password
            require_tls: true
      - name: superdl-dingtalk
        webhook_configs:
          - url: "http://localhost:8060/dingtalk/oncall/send"
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: superdl-cephfs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 2Gi}
    secrets:
      - superdl-alert-token
      - superdl-smtp-password
additionalPrometheusRulesMap:
  superdl-gpu:
    groups:
      - name: superdl.gpu
        rules:
          - alert: GPUXidCriticalError
            expr: (changes(DCGM_FI_DEV_XID_ERRORS[5m]) > 0) and (DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 95)
            labels: {severity: critical}
            annotations: {summary: "GPU Xid 致命错误(节点 {{ $labels.hostname }} 卡 {{ $labels.gpu }}):自动 cordon + 补偿 SOP", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: GPUHighTemperature
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "GPU 温度 >85°C 持续 5 分钟({{ $labels.hostname }} 卡 {{ $labels.gpu }})", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: NodeGPUUnavailable
            expr: (kube_node_status_capacity{resource="nvidia_com_gpu"} > 0) and on(node) (kube_node_status_condition{condition="Ready",status="true"} == 0)
            for: 2m
            labels: {severity: critical}
            annotations: {summary: "GPU 节点 NotReady:{{ $labels.node }}"}
          - alert: SharedPoolUtilSaturated
            expr: avg by (node) (hami_host_gpu_utilization_ratio) > 95
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "共享池节点持续打满(超卖回调阈值 85% 参考)"}
          - alert: CephUnhealthy
            expr: ceph_health_status > 0
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "Ceph 集群非 HEALTH_OK 超 15 分钟,数据盘可用性受影响", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#d-存储"}
          - alert: HamiSchedulerDown
            expr: absent(up{job="hami-scheduler"} == 1)
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "HAMi scheduler 指标缺失:共享池调度器可能不可用,新建共享档实例将被拒绝", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#c-hami-共享池"}
          - alert: GpuTelemetryMissing
            expr: absent(DCGM_FI_DEV_GPU_UTIL) or absent(hami_host_gpu_utilization_ratio)
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "GPU 遥测缺失:无法发现配额逃逸与滥用(dcgm-exporter 或 HAMi vGPUmonitor 抓取断了)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#e-监控与告警"}
  superdl-certmanager:
    groups:
      - name: superdl.certmanager
        rules:
          - alert: CertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
            labels: {severity: warning}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})7 天内到期:查 cert-manager 续签", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: CertExpiringCritical
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 2 * 24 * 3600
            labels: {severity: critical}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})48 小时内到期:立即人工介入", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: CertManagerMetricsMissing
            expr: absent(certmanager_certificate_expiration_timestamp_seconds)
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "cert-manager 指标缺失 1 小时:ServiceMonitor/组件异常,证书过期将无预警", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: PlatformCertExpiringSoon
            expr: (superdl_cert_not_after_seconds - time()) < 14 * 24 * 3600
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "平台域证书 {{ $labels.domain }} 14 天内到期:三个平台域由宿主机 acme 续期脚本管理,查其 cron 日志"}
          - alert: PlatformCertExpiringCritical
            expr: (superdl_cert_not_after_seconds - time()) < 3 * 24 * 3600
            for: 1h
            labels: {severity: critical}
            annotations: {summary: "平台域证书 {{ $labels.domain }} 3 天内到期:三个平台域由宿主机 acme 续期脚本管理,立即人工续签并灌入 TLS Secret"}
  superdl-platform:
    groups:
      - name: superdl.platform
        rules:
          - alert: OutboxTaskDead
            expr: increase(superdl_outbox_dead_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "outbox 任务进入死信({{ $labels.task_type }}):编排执行链路断裂,管理端总览可重放"}
          - alert: SettlementFailed
            expr: increase(superdl_settlement_failed_total[1h]) > 0
            labels: {severity: critical}
            annotations: {summary: "结算失败({{ $labels.kind }}):检查 worker 日志,结算函数幂等可重跑"}
          - alert: SettlementLagging
            expr: superdl_settlement_lag_windows > 1
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "结算水位线落后 {{ $value }} 个窗口({{ $labels.kind }}):有账期未追平,worker 日志查失败实例"}
          - alert: PaymentCallbackMismatch
            expr: increase(superdl_payment_callback_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "支付回调金额与订单不符:疑似攻击或渠道异常,见财务异常清单"}
          - alert: InstanceNodeLost
            expr: increase(superdl_instance_node_lost_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "有租户实例因所在节点失联被判停:需人工核对是否退费"}
          - alert: LeakedPodsReclaimed
            expr: increase(superdl_reconcile_leaked_total[30m]) > 3
            labels: {severity: warning}
            annotations: {summary: "30 分钟内回收泄漏 Pod 超 3 个:编排链路可能存在系统性问题"}
          - alert: ApiHighErrorRate
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "API 5xx 率 >5% 持续 5 分钟", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md"}
          - alert: PaymentClosedOrderRescued
            expr: increase(superdl_payment_closed_order_rescued_total[1h]) > 0
            labels: {severity: warning}
            annotations: {summary: "关单后回调自动入账发生:本地关单早于渠道过期,核对订单 TTL 与渠道 time_expire 是否同步"}
          - alert: OutboxTaskTimeout
            expr: increase(superdl_outbox_task_timeout_total[30m]) > 0
            labels: {severity: warning}
            annotations: {summary: "outbox 有任务被执行超时中断:队列全局串行,队头卡死会让全部编排请求排队", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md"}
          - alert: WorkerDown
            expr: (time() - max(superdl_worker_heartbeat_timestamp_seconds)) > 120 or absent(superdl_worker_heartbeat_timestamp_seconds)
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "worker 心跳缺失超 2 分钟:outbox/结算/巡检/查单全部停摆"}
          - alert: OutboxBacklogStale
            expr: superdl_outbox_pending_oldest_age_seconds > 600
            for: 10m
            labels: {severity: critical}
            annotations: {summary: "最老 pending outbox 任务已滞留 {{ $value }}s:worker 活着但领不动任务,查 outbox_loop_error 日志"}
          - alert: PgBackupFailed
            expr: kube_job_status_failed{namespace="superdl", job_name=~"pg-backup-daily-.*"} > 0
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "PG 每日备份 Job 失败:资金库 RPO 正在拉长,立即处理", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBackupStale
            expr: (time() - max(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})) > 100800 or (absent(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"}) and absent(superdl_pg_backup_last_success_timestamp_seconds))
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "PG 备份超 28h 无成功记录(CronJob 未跑或历史被清)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBackupStandaloneStale
            expr: (time() - max(superdl_pg_backup_last_success_timestamp_seconds)) > 100800
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "自建 PG 每日备份(dump + 异地同步 + 恢复冒烟)超 28h 无成功:查控制面宿主机 cron 邮件与 /var/lib/superdl/pg/backup", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBaseBackupStale
            expr: (time() - max(superdl_pg_basebackup_last_success_timestamp_seconds)) > 8 * 86400 or absent(superdl_pg_basebackup_last_success_timestamp_seconds)
            for: 1h
            labels: {severity: critical}
            annotations: {summary: "每周 pg_basebackup 超 8 天无成功:PITR 基准缺失", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgWalSyncStale
            expr: (time() - max(superdl_pg_wal_sync_last_success_timestamp_seconds)) > 1800 or absent(superdl_pg_wal_sync_last_success_timestamp_seconds)
            for: 10m
            labels: {severity: critical}
            annotations: {summary: "WAL 归档异地同步超 30 分钟无成功:PITR 可恢复点正在拉长", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: K3sStateBackupStale
            expr: (time() - max(superdl_k3s_state_backup_last_success_timestamp_seconds)) > 13 * 3600 or absent(superdl_k3s_state_backup_last_success_timestamp_seconds)
            for: 30m
            labels: {severity: critical}
            annotations: {summary: "k3s 集群状态备份超 13 小时无成功:查控制面宿主机 cron 与备份目标可写性"}
          - alert: NodeUnenrolledJoined
            expr: max(superdl_node_unenrolled) > 0
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "有未登记节点加入集群并已被 cordon:核对 agent token 是否泄漏", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/README.md#server-token-与-agent-token轮换-快照托管"}
          - alert: SubscriptionUnpaidRunning
            expr: max(superdl_subscription_unpaid_running_instances) > 0
            for: 45m
            labels: {severity: critical}
            annotations: {summary: "包周期已到期的实例仍在运行超一轮巡检:到期停机巡检未生效,管理端逐台核对"}
          - alert: ScheduleTimeoutOccupiedBurst
            expr: sum(increase(superdl_schedule_timeout_occupied_total[1h])) > 10
            labels: {severity: warning}
            annotations: {summary: "服务型实例反复永不就绪(租户控制 health_path):已按占用时长计费,核对是否刷免费算力"}
          - alert: FundReconcileMismatch
            expr: increase(superdl_fund_reconcile_mismatch_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "资金账实不平({{ $labels.kind }}):余额与流水不一致,先冻结出账再人工核对"}
          - alert: SettlementGapUnresolved
            expr: max(superdl_settlement_gap_unresolved) > 0
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "未核销结算缺口 {{ $value }} 条({{ $labels.kind }})持续超 15 分钟:管理端财务 › 结算缺口处理"}
          - alert: AuditWriteFailed
            expr: increase(superdl_audit_write_failed_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "审计行写入失败:fail-open 路径的操作可能无留痕,立即查 DB 与审计写路径"}
          - alert: PatrolFailed
            expr: increase(superdl_patrol_failed_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "余额巡检环节异常({{ $labels.stage }}):巡检停摆会掩盖账实漂移,查 worker 日志"}
          - alert: PaymentRecoverFailed
            expr: increase(superdl_payment_recover_failed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "查单收敛单笔入账失败({{ $labels.error }}):整轮不中断,该笔需人工核对入账"}
          - alert: PaymentChannelReversed
            expr: increase(superdl_payment_channel_reversed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "已入账订单收到渠道关单/退款类通知:平台不自动冲账,财务异常清单人工核销"}
          - alert: DiskProvisionFailed
            expr: increase(superdl_disk_provision_failed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "数据盘 PVC 建/扩进入死信(reconciler 周期重派):未就绪的盘挂不上实例,查 disk-ops worker 日志与 CephFS CSI"}
          - alert: ReconcileStuckInstances
            expr: max(superdl_reconcile_stuck_instances) > 0
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "实例悬挂在 {{ $labels.status }} 超 15 分钟未收敛:编排收尾卡死,管理端实例详情人工介入"}
          - alert: ReconcileLeakAborted
            expr: increase(superdl_reconcile_leak_aborted_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "泄漏回收被熔断中止(未知 Pod 占比超阈):本轮泄漏未回收,人工核对节点残留"}
          - alert: SshPortPoolLow
            expr: superdl_ssh_port_pool_ports{state="free"} < 0.1 * sum(superdl_ssh_port_pool_ports)
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "SSH NodePort 端口池空闲 {{ $value }} 个(<10%):清理长期停机实例或扩端口段,见 docs/reference/limits.md"}
          - alert: SshPortPoolExhausted
            expr: superdl_ssh_port_pool_ports{state="free"} < 20
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "SSH NodePort 端口池即将耗尽(空闲 {{ $value }}):新建带 SSH 的实例将失败,立即处理"}
          - alert: WalletNegativeExposure
            expr: superdl_wallet_negative_sum_yuan > 1000
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "负余额敞口合计 {{ $value }} 元持续 30 分钟(钱包数见 superdl_wallet_negative_count):核对欠费停机巡检是否在跑,管理端财务 › 异常清单"}
          - alert: PaymentReversalReleased
            expr: increase(superdl_payment_reversal_resolved_total{action="release"}[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "渠道反向通知被人工解冻({{ $value }} 次):单操作人动作,逐条与渠道退款记录核对"}
          - alert: CertNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "证书 {{ $labels.name }}({{ $labels.namespace }})持续 10 分钟未就绪:查 cert-manager 签发事件与 DNS01 solver", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
  superdl-security:
    groups:
      - name: superdl.security
        rules:
          - alert: LoginFailureSpike
            expr: sum by (actor_type) (increase(superdl_login_failed_total[5m])) > 50
            labels: {severity: warning}
            annotations: {summary: "5 分钟内登录失败 {{ $value }} 次({{ $labels.actor_type }} 端):疑似撞库/爆破,按源 IP 查 Loki 决定是否临时封禁", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: AdminLoginFailureSpike
            expr: sum(increase(superdl_login_failed_total{actor_type="admin"}[10m])) > 10
            labels: {severity: critical}
            annotations: {summary: "管理端 10 分钟内登录失败 {{ $value }} 次:管理员账号正被爆破(先核对 04-gateway.yaml 的源 IP 白名单是否生效)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: AuthzDenialSustained
            expr: sum by (actor_type) (rate(superdl_authz_denied_total[10m])) > 0.5
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "鉴权拒绝持续 {{ $value }}/s({{ $labels.actor_type }} 端)超 15 分钟:有人在遍历越权面,或某个客户端在拿错凭据重试", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: AdminPrivilegeChanged
            expr: increase(superdl_admin_privilege_change_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "管理端权限发生变更({{ $value }} 次):逐条与变更单核对,非计划内变更按失陷处置", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: NodePoolLabelMismatch
            expr: increase(superdl_node_pool_label_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "节点池标签与注册登记不符({{ $value }} 次):平台已纠偏并停调度,核对该机是谁装的、config.yaml 被谁改过", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: PiiRevealVolumeHigh
            expr: sum by (kind) (increase(superdl_pii_reveal_rows_total[1h])) > 200
            labels: {severity: warning}
            annotations: {summary: "1 小时内明文查看 PII {{ $value }} 行({{ $labels.kind }}):核对是谁、为什么,批量导出应走审批而非逐条查看", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: PiiRevealBurst
            expr: sum(increase(superdl_pii_reveal_rows_total[5m])) > 500
            labels: {severity: critical}
            annotations: {summary: "5 分钟内明文查看 PII {{ $value }} 行:批量脱库特征,立即冻结相关管理账号并保留审计", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: ApiUnauthorizedRateHigh
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"40[13]"}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.3
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "API 401/403 占比 >30% 持续 10 分钟:大概率是自动化探测,而不是用户在误操作", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: PaymentConfigWritten
            expr: increase(superdl_platform_config_write_total{domain=~"payment|crypto"}[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "平台配置 {{ $labels.domain }} 组被写入({{ $value }} 次):换掉验签公钥/商户号即可自签回调充值,逐条与变更单核对,非计划内按失陷处置", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: EndpointAuthDenialSustained
            expr: rate(superdl_endpoint_auth_denied_total[10m]) > 1
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "服务端点网关鉴权拒绝持续 {{ $value }}/s 超 15 分钟:有人在猜 x-api-key,按 slug 查 Loki 后临时冻结该服务", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
  superdl-abuse:
    groups:
      - name: superdl.abuse
        rules:
          - alert: SignupVelocityHigh
            expr: increase(superdl_user_signup_total[1h]) > 100
            labels: {severity: warning}
            annotations: {summary: "1 小时内注册 {{ $value }} 个账号:批量注册特征,核对实名通过率与同 IP/同证件分布,必要时临时提高注册限流"}
          - alert: VerificationBurst
            expr: sum by (channel, purpose) (increase(superdl_verification_sent_total[10m])) > 300
            labels: {severity: warning}
            annotations: {summary: "{{ $value }} verification codes sent over {{ $labels.channel }} in 10 minutes ({{ $labels.purpose }}): code bombing or credential stuffing — check the CAPTCHA switch first, then source IPs"}
          - alert: ApiRateLimitedHigh
            expr: sum(rate(superdl_http_request_duration_seconds_count{status="429"}[5m])) > 5
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "应用层限流 429 持续 {{ $value }}/s 超 10 分钟:单点被打,按 route/源 IP 查 Loki", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#查询方式"}
          - alert: TenantEgressHigh
            expr: sum by (namespace) (rate(container_network_transmit_bytes_total{namespace=~"tenant-.*"}[10m])) > 40e6
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "租户 {{ $labels.namespace }} 出向 {{ $value | humanize }}B/s 持续 15 分钟:扫描/外发/中继特征,管理端查该租户实例,必要时冻结"}
prometheus-node-exporter:
  tolerations:
    - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  extraArgs:
    - --collector.textfile.directory=/host/textfile
    # GB10(cppc_cpufreq)上 cpufreq collector 的抓取会偶发永不返回,卡住的 handler 攒到 --web.max-requests(40)
    # 之后整个 node-exporter 只回 503,textfile 指标(备份 / 证书链)随之 absent 误报;无规则用 cpufreq 指标
    - --no-collector.cpufreq
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile
      mountPath: /host/textfile
      readOnly: true
      mountPropagation: None
