# The chart ClusterRole gives the operator cluster-wide secrets/configmaps *: turned off; the equivalent narrowed set lives in ../monitoring-rbac.yaml
# (shipped by the helmfile presync, names carry the superdl- prefix and never collide with old chart objects). The rbac of the kube-state-metrics / node-exporter sub-charts is not affected by this key.
global:
  rbac:
    create: false
prometheusOperator:
  # The operator looks for ServiceMonitor/PodMonitor/PrometheusRule only in these namespaces; the Prometheus/Alertmanager instances and their Secret informers only in monitoring.
  # Secrets referenced by monitors are fetched by name by the operator: monitors referencing credentials always live in the monitoring ns (../../app/k8s/08-monitoring.yaml).
  namespaces:
    releaseNamespace: true
    additional:
      - superdl
      - kube-system
      - rook-ceph
      - gpu-operator
      - envoy-gateway-system
      - cert-manager
      - topolvm-system
      - cnpg-system
  prometheusInstanceNamespaces: [monitoring]
  alertmanagerInstanceNamespaces: [monitoring]
  alertmanagerConfigNamespaces: [monitoring]
  thanosRulerInstanceNamespaces: [monitoring]
kube-state-metrics:
  # Remove secrets from the default collectors (its ClusterRole then loses secrets list/watch)
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - daemonsets
    - deployments
    - endpointslices
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments
prometheus:
  prometheusSpec:
    maximumStartupDurationSeconds: 900
    retention: 15d
    retentionSize: "40GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: superdl-cephfs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 50Gi}
    replicas: 1
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}
    additionalScrapeConfigs:
      - job_name: hami-scheduler
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: hami-scheduler
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: monitor
            action: keep
      - job_name: hami-device-plugin
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: hami-device-plugin
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: vgpu-monitor
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9394
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    security:
      allow_embedding: false
      content_security_policy: true
      content_security_policy_template: >-
        frame-ancestors 'self';
        default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline'; img-src 'self' data:;
      cookie_secure: true
      cookie_samesite: lax
    auth.anonymous:
      enabled: false
  additionalDataSources:
    - name: Loki (platform)
      uid: loki-platform
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: platform
    - name: Loki (tenant)
      uid: loki-tenant
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: tenant
  dashboards:
    superdl:
      superdl-overview:
        json: |
          {
            "uid": "superdl-overview",
            "title": "SuperDL overview",
            "schemaVersion": 39,
            "version": 1,
            "editable": false,
            "timezone": "browser",
            "time": {"from": "now-6h", "to": "now"},
            "panels": [
              {
                "id": 1,
                "title": "Instance orchestration health",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "max(superdl_reconcile_stuck_instances)",
                    "legendFormat": "stuck instances ({{status}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_instance_node_lost_total[1h])",
                    "legendFormat": "node-lost stops/h"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_outbox_dead_total[1h])",
                    "legendFormat": "outbox dead letters/h ({{task_type}})"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Bill settlement",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "superdl_settlement_lag_windows",
                    "legendFormat": "settlement lag windows ({{kind}})"
                  },
                  {
                    "refId": "B",
                    "expr": "increase(superdl_settlement_failed_total[1h])",
                    "legendFormat": "settlement failures/h ({{kind}})"
                  },
                  {
                    "refId": "C",
                    "expr": "increase(superdl_fund_reconcile_mismatch_total[1h])",
                    "legendFormat": "reconcile mismatches/h ({{kind}})"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Nodes and GPUs",
                "type": "timeseries",
                "datasource": {"type": "prometheus"},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
                "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
                "targets": [
                  {
                    "refId": "A",
                    "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
                    "legendFormat": "Ready nodes"
                  },
                  {
                    "refId": "B",
                    "expr": "avg by (node) (DCGM_FI_DEV_GPU_UTIL)",
                    "legendFormat": "GPU util % ({{node}})"
                  },
                  {
                    "refId": "C",
                    "expr": "max by (node) (DCGM_FI_DEV_GPU_TEMP)",
                    "legendFormat": "GPU temp °C ({{node}})"
                  }
                ]
              }
            ]
          }
alertmanager:
  config:
    route:
      receiver: superdl-api
      group_by: [alertname, namespace]
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: superdl-oncall-mail
          continue: true
        # Optional chat / paging channels for critical alerts: uncomment ONE route + its receiver below
        # and the matching alertmanagerSpec.secrets entry, then replace the CHANGE_ME values.
        # - matchers: ['severity="critical"']
        #   receiver: superdl-slack
        #   continue: true
        # - matchers: ['severity="critical"']
        #   receiver: superdl-pagerduty
        #   continue: true
        # - matchers: ['severity="critical"']
        #   receiver: superdl-dingtalk
        #   continue: true
        - matchers: ['severity="none"']
          receiver: "null"
        - matchers: ['severity=~".+"']
          receiver: superdl-api
    inhibit_rules:
      - source_matchers: ['severity=~"warning|critical"']
        target_matchers: ['alertname="Watchdog"']
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: ['alertname', 'namespace']
    receivers:
      - name: "null"
      - name: superdl-api
        webhook_configs:
          - url: "http://superdl-api.superdl.svc:80/api/v1/webhooks/alertmanager"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/superdl-alert-token/token
      - name: superdl-oncall-mail
        email_configs:
          - to: "CHANGE_ME_ONCALL_MAIL"
            from: "CHANGE_ME_ALERT_FROM_MAIL"
            smarthost: "CHANGE_ME_SMTP_HOST:465"
            auth_username: "CHANGE_ME_SMTP_USERNAME"
            auth_password_file: /etc/alertmanager/secrets/superdl-smtp-password/password
            require_tls: true
      # --- optional receivers (examples; disabled until routed above) ---
      # Slack incoming webhook (Alertmanager reads the URL from a mounted Secret):
      # - name: superdl-slack
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/superdl-slack-webhook/url
      #       channel: "#CHANGE_ME_CHANNEL"
      #       send_resolved: true
      #       title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
      #       text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
      # PagerDuty Events API v2 (routing key from a mounted Secret):
      # - name: superdl-pagerduty
      #   pagerduty_configs:
      #     - routing_key_file: /etc/alertmanager/secrets/superdl-pagerduty-key/routing-key
      #       severity: critical
      #       description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
      # DingTalk group robot via the prometheus-webhook-dingtalk sidecar (add the sidecar under
      # alertmanagerSpec.containers, pinned image, profile "oncall", robot token from
      # monitoring/superdl-dingtalk-token):
      # - name: superdl-dingtalk
      #   webhook_configs:
      #     - url: "http://localhost:8060/dingtalk/oncall/send"
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: superdl-cephfs
          accessModes: ["ReadWriteMany"]
          resources:
            requests: {storage: 2Gi}
    secrets:
      - superdl-alert-token
      - superdl-smtp-password
      # Mount the Secret of the optional receiver you enabled:
      # - superdl-slack-webhook      # key: url
      # - superdl-pagerduty-key      # key: routing-key
      # - superdl-dingtalk-token     # key: token (used by the sidecar)
additionalPrometheusRulesMap:
  superdl-gpu:
    groups:
      - name: superdl.gpu
        rules:
          - alert: GPUXidCriticalError
            expr: (changes(DCGM_FI_DEV_XID_ERRORS[5m]) > 0) and (DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 95)
            labels: {severity: critical}
            annotations: {summary: "GPU Xid fatal error (node {{ $labels.hostname }} GPU {{ $labels.gpu }}): automatic cordon + compensation SOP", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: GPUHighTemperature
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "GPU temperature >85°C for 5 minutes ({{ $labels.hostname }} GPU {{ $labels.gpu }})", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: NodeGPUUnavailable
            expr: (kube_node_status_capacity{resource="nvidia_com_gpu"} > 0) and on(node) (kube_node_status_condition{condition="Ready",status="true"} == 0)
            for: 2m
            labels: {severity: critical}
            annotations: {summary: "GPU node NotReady: {{ $labels.node }}"}
          - alert: SharedPoolUtilSaturated
            expr: avg by (node) (hami_host_gpu_utilization_ratio) > 95
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "Shared pool node saturated continuously (oversell lower-threshold reference 85%)"}
          - alert: CephUnhealthy
            expr: ceph_health_status > 0
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "Ceph cluster not HEALTH_OK for over 15 minutes, data disk availability affected", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#d-storage"}
          - alert: HamiSchedulerDown
            expr: absent(up{job="hami-scheduler"} == 1)
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "HAMi scheduler metrics missing: the shared pool scheduler may be down, new shared-tier instances will be refused", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#c-hami-shared-pool"}
          - alert: GpuTelemetryMissing
            expr: absent(DCGM_FI_DEV_GPU_UTIL) or absent(hami_host_gpu_utilization_ratio)
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "GPU telemetry missing: quota escapes and abuse cannot be detected (dcgm-exporter or HAMi vGPUmonitor scrape broken)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/cluster-validation.md#e-monitoring-and-alerts"}
  superdl-certmanager:
    groups:
      - name: superdl.certmanager
        rules:
          - alert: CertExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
            labels: {severity: warning}
            annotations: {summary: "Certificate {{ $labels.name }} ({{ $labels.namespace }}) expires within 7 days: check cert-manager renewal", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: CertExpiringCritical
            expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 2 * 24 * 3600
            labels: {severity: critical}
            annotations: {summary: "Certificate {{ $labels.name }} ({{ $labels.namespace }}) expires within 48 hours: intervene now", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: CertManagerMetricsMissing
            expr: absent(certmanager_certificate_expiration_timestamp_seconds)
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "cert-manager metrics missing for 1 hour: ServiceMonitor / component broken, certificate expiry would go unwarned", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
          - alert: PlatformCertExpiringSoon
            expr: (superdl_cert_not_after_seconds - time()) < 14 * 24 * 3600
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "Platform domain certificate {{ $labels.domain }} expires within 14 days: the three platform domains are renewed by the host acme script, check its cron log"}
          - alert: PlatformCertExpiringCritical
            expr: (superdl_cert_not_after_seconds - time()) < 3 * 24 * 3600
            for: 1h
            labels: {severity: critical}
            annotations: {summary: "Platform domain certificate {{ $labels.domain }} expires within 3 days: the three platform domains are renewed by the host acme script, renew by hand now and load the TLS Secret"}
  superdl-platform:
    groups:
      - name: superdl.platform
        rules:
          - alert: OutboxTaskDead
            expr: increase(superdl_outbox_dead_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "outbox task dead-lettered ({{ $labels.task_type }}): the orchestration execution chain is broken, replay from the admin overview"}
          - alert: SettlementFailed
            expr: increase(superdl_settlement_failed_total[1h]) > 0
            labels: {severity: critical}
            annotations: {summary: "Settlement failed ({{ $labels.kind }}): check the worker logs, the settlement function is idempotent and can be re-run"}
          - alert: SettlementLagging
            expr: superdl_settlement_lag_windows > 1
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "Settlement watermark {{ $value }} windows behind ({{ $labels.kind }}): periods not caught up, find the failing instances in the worker logs"}
          - alert: PaymentCallbackMismatch
            expr: increase(superdl_payment_callback_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Payment callback amount differs from the order: suspected attack or channel fault, see the finance anomaly list"}
          - alert: InstanceNodeLost
            expr: increase(superdl_instance_node_lost_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Tenant instances stopped because their node was lost: check by hand whether to refund"}
          - alert: LeakedPodsReclaimed
            expr: increase(superdl_reconcile_leaked_total[30m]) > 3
            labels: {severity: warning}
            annotations: {summary: "More than 3 leaked Pods reclaimed within 30 minutes: the orchestration chain may have a systemic problem"}
          - alert: ApiHighErrorRate
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.05
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "API 5xx rate >5% for 5 minutes", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md"}
          - alert: PaymentClosedOrderRescued
            expr: increase(superdl_payment_closed_order_rescued_total[1h]) > 0
            labels: {severity: warning}
            annotations: {summary: "A callback was credited after the order was closed: the local close happened before the channel expiry, check that the order TTL and the channel time_expire are aligned"}
          - alert: OutboxTaskTimeout
            expr: increase(superdl_outbox_task_timeout_total[30m]) > 0
            labels: {severity: warning}
            annotations: {summary: "An outbox task was interrupted by the execution timeout: the queue is globally serial, a stuck head queues every orchestration request", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md"}
          - alert: WorkerDown
            expr: (time() - max(superdl_worker_heartbeat_timestamp_seconds)) > 120 or absent(superdl_worker_heartbeat_timestamp_seconds)
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "Worker heartbeat missing for over 2 minutes: outbox / settlement / patrol / order queries all stopped"}
          - alert: OutboxBacklogStale
            expr: superdl_outbox_pending_oldest_age_seconds > 600
            for: 10m
            labels: {severity: critical}
            annotations: {summary: "The oldest pending outbox task has waited {{ $value }}s: the worker is alive but cannot claim tasks, check the outbox_loop_error log"}
          - alert: PgBackupFailed
            expr: kube_job_status_failed{namespace="superdl", job_name=~"pg-backup-daily-.*"} > 0
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "PG daily backup Job failed: the billing database RPO is growing, act now", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBackupStale
            expr: (time() - max(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"})) > 100800 or (absent(kube_job_status_completion_time{namespace="superdl", job_name=~"pg-backup-daily-.*"}) and absent(superdl_pg_backup_last_success_timestamp_seconds))
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "PG backup without a success for over 28 h (CronJob not running or history cleared)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBackupStandaloneStale
            expr: (time() - max(superdl_pg_backup_last_success_timestamp_seconds)) > 100800
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "Self-hosted PG daily backup (dump + off-site sync + restore smoke) without a success for over 28 h: check the control-plane host cron mail and /var/lib/superdl/pg/backup", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgBaseBackupStale
            expr: (time() - max(superdl_pg_basebackup_last_success_timestamp_seconds)) > 8 * 86400 or absent(superdl_pg_basebackup_last_success_timestamp_seconds)
            for: 1h
            labels: {severity: critical}
            annotations: {summary: "Weekly pg_basebackup without a success for over 8 days: PITR base missing", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: PgWalSyncStale
            expr: (time() - max(superdl_pg_wal_sync_last_success_timestamp_seconds)) > 1800 or absent(superdl_pg_wal_sync_last_success_timestamp_seconds)
            for: 10m
            labels: {severity: critical}
            annotations: {summary: "WAL archive off-site sync without a success for over 30 minutes: the PITR recovery point is growing stale", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/pg-backup-restore.md"}
          - alert: K3sStateBackupStale
            expr: (time() - max(superdl_k3s_state_backup_last_success_timestamp_seconds)) > 13 * 3600 or absent(superdl_k3s_state_backup_last_success_timestamp_seconds)
            for: 30m
            labels: {severity: critical}
            annotations: {summary: "k3s cluster state backup without a success for over 13 hours: check the control-plane host cron and the backup target writability"}
          - alert: NodeUnenrolledJoined
            expr: max(superdl_node_unenrolled) > 0
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "An unenrolled node joined the cluster and has been cordoned: check whether the agent token leaked", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/README.md#server-token-and-agent-token-rotation-and-snapshot-custody"}
          - alert: SubscriptionUnpaidRunning
            expr: max(superdl_subscription_unpaid_running_instances) > 0
            for: 45m
            labels: {severity: critical}
            annotations: {summary: "An expired subscription instance kept running for more than one patrol round: the expiry stop patrol is not effective, check instance by instance in the admin console"}
          - alert: ScheduleTimeoutOccupiedBurst
            expr: sum(increase(superdl_schedule_timeout_occupied_total[1h])) > 10
            labels: {severity: warning}
            annotations: {summary: "A service instance never becomes ready repeatedly (health_path is tenant-controlled): billed by occupation time, check for free-compute abuse"}
          - alert: FundReconcileMismatch
            expr: increase(superdl_fund_reconcile_mismatch_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Funds do not reconcile ({{ $labels.kind }}): balance and ledger disagree, freeze outgoing payments first, then check by hand"}
          - alert: SettlementGapUnresolved
            expr: max(superdl_settlement_gap_unresolved) > 0
            for: 15m
            labels: {severity: critical}
            annotations: {summary: "{{ $value }} unresolved settlement gaps ({{ $labels.kind }}) for over 15 minutes: handle under admin Finance › Settlement gaps"}
          - alert: AuditWriteFailed
            expr: increase(superdl_audit_write_failed_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Audit row write failed: fail-open operations may leave no trace, check the DB and the audit write path now"}
          - alert: PatrolFailed
            expr: increase(superdl_patrol_failed_total[15m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Balance patrol stage failed ({{ $labels.stage }}): a stalled patrol hides ledger drift, check the worker logs"}
          - alert: PaymentRecoverFailed
            expr: increase(superdl_payment_recover_failed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "Query-based recovery failed to credit one order ({{ $labels.error }}): the round continues, that order needs manual crediting"}
          - alert: PaymentChannelReversed
            expr: increase(superdl_payment_channel_reversed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "A credited order received a channel close / refund notice: the platform does not reverse automatically, write off manually in the finance anomaly list"}
          - alert: DiskProvisionFailed
            expr: increase(superdl_disk_provision_failed_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "Data disk PVC create/expand dead-lettered (re-dispatched by the reconciler periodically): unready disks cannot be mounted, check the disk-ops worker logs and the CephFS CSI"}
          - alert: ReconcileStuckInstances
            expr: max(superdl_reconcile_stuck_instances) > 0
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "Instance stuck in {{ $labels.status }} for over 15 minutes: orchestration wrap-up stuck, intervene from the admin instance detail"}
          - alert: ReconcileLeakAborted
            expr: increase(superdl_reconcile_leak_aborted_total[15m]) > 0
            labels: {severity: warning}
            annotations: {summary: "Leak reclamation aborted by the circuit breaker (unknown Pod share above threshold): this round reclaimed nothing, check node leftovers by hand"}
          - alert: SshPortPoolLow
            expr: superdl_ssh_port_pool_ports{state="free"} < 0.1 * sum(superdl_ssh_port_pool_ports)
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "SSH NodePort pool has {{ $value }} free ports (<10%): clean up long-stopped instances or extend the port range, see docs/reference/limits.md"}
          - alert: SshPortPoolExhausted
            expr: superdl_ssh_port_pool_ports{state="free"} < 20
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "SSH NodePort pool about to run out ({{ $value }} free): new instances with SSH will fail, act now"}
          - alert: WalletNegativeExposure
            expr: superdl_wallet_negative_sum > 1000
            for: 30m
            labels: {severity: warning}
            annotations: {summary: "Negative balance exposure totals {{ $value }} (platform currency) for 30 minutes (wallet count in superdl_wallet_negative_count): check that the arrears stop patrol is running, admin Finance › Anomalies"}
          - alert: PaymentReversalReleased
            expr: increase(superdl_payment_reversal_resolved_total{action="release"}[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Channel reversal freezes lifted by hand ({{ $value }} times): single-operator actions, check each against the channel refund records"}
          - alert: CertNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "Certificate {{ $labels.name }} ({{ $labels.namespace }}) not ready for 10 minutes: check the cert-manager issuance events and the DNS01 solver", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/acme-dns.md"}
  superdl-security:
    groups:
      - name: superdl.security
        rules:
          - alert: LoginFailureSpike
            expr: sum by (actor_type) (increase(superdl_login_failed_total[5m])) > 50
            labels: {severity: warning}
            annotations: {summary: "{{ $value }} failed logins within 5 minutes ({{ $labels.actor_type }} side): suspected credential stuffing / brute force, check Loki by source IP and decide on a temporary block", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: AdminLoginFailureSpike
            expr: sum(increase(superdl_login_failed_total{actor_type="admin"}[10m])) > 10
            labels: {severity: critical}
            annotations: {summary: "{{ $value }} failed admin logins within 10 minutes: an admin account is being brute-forced (first check that the source IP allow-list in 04-gateway.yaml is effective)", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: AuthzDenialSustained
            expr: sum by (actor_type) (rate(superdl_authz_denied_total[10m])) > 0.5
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "Authorization denials at {{ $value }}/s ({{ $labels.actor_type }} side) for over 15 minutes: someone is probing the permission surface, or a client retries with wrong credentials", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: AdminPrivilegeChanged
            expr: increase(superdl_admin_privilege_change_total[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Admin permissions changed ({{ $value }} times): check each against the change ticket, treat unplanned changes as a compromise", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: NodePoolLabelMismatch
            expr: increase(superdl_node_pool_label_mismatch_total[10m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Node pool label disagrees with the registration ({{ $value }} times): the platform corrected it and stopped scheduling, check who installed the machine and who changed config.yaml", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/gpu-fault-sop.md"}
          - alert: PiiRevealVolumeHigh
            expr: sum by (kind) (increase(superdl_pii_reveal_rows_total[1h])) > 200
            labels: {severity: warning}
            annotations: {summary: "{{ $value }} PII rows viewed in plaintext within 1 hour ({{ $labels.kind }}): check who and why, bulk exports go through approval rather than row-by-row viewing", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: PiiRevealBurst
            expr: sum(increase(superdl_pii_reveal_rows_total[5m])) > 500
            labels: {severity: critical}
            annotations: {summary: "{{ $value }} PII rows viewed in plaintext within 5 minutes: bulk exfiltration pattern, freeze the admin accounts involved now and keep the audit trail", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: ApiUnauthorizedRateHigh
            expr: sum(rate(superdl_http_request_duration_seconds_count{status=~"40[13]"}[5m])) / clamp_min(sum(rate(superdl_http_request_duration_seconds_count[5m])), 0.001) > 0.3
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "API 401/403 share >30% for 10 minutes: most likely automated probing, not user mistakes", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: PaymentConfigWritten
            expr: increase(superdl_platform_config_write_total{domain=~"payment_.*|crypto"}[5m]) > 0
            labels: {severity: critical}
            annotations: {summary: "Platform configuration group {{ $labels.domain }} written ({{ $value }} times): swapping the signature key / merchant id lets an attacker self-sign callback recharges, check each against the change ticket, treat unplanned changes as a compromise", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: EndpointAuthDenialSustained
            expr: rate(superdl_endpoint_auth_denied_total[10m]) > 1
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "Service endpoint gateway auth denials at {{ $value }}/s for over 15 minutes: someone is guessing x-api-key, look up the slug in Loki and freeze that service temporarily", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
  superdl-abuse:
    groups:
      - name: superdl.abuse
        rules:
          - alert: SignupVelocityHigh
            expr: increase(superdl_user_signup_total[1h]) > 100
            labels: {severity: warning}
            annotations: {summary: "{{ $value }} accounts registered within 1 hour: bulk registration pattern, check the KYC pass rate and the same-IP / same-identity distribution, raise the registration rate limit temporarily if needed"}
          - alert: VerificationBurst
            expr: sum by (channel, purpose) (increase(superdl_verification_sent_total[10m])) > 300
            labels: {severity: warning}
            annotations: {summary: "{{ $value }} verification codes sent over {{ $labels.channel }} in 10 minutes ({{ $labels.purpose }}): code bombing or credential stuffing — check the CAPTCHA switch first, then source IPs"}
          - alert: ApiRateLimitedHigh
            expr: sum(rate(superdl_http_request_duration_seconds_count{status="429"}[5m])) > 5
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "Application-layer 429s at {{ $value }}/s for over 10 minutes: a single point is under load, check Loki by route / source IP", runbook_url: "https://github.com/CHANGE_ME_ORG/superdl/blob/main/deploy/cluster/runbooks/loki-logging.md#querying"}
          - alert: TenantEgressHigh
            expr: sum by (namespace) (rate(container_network_transmit_bytes_total{namespace=~"tenant-.*"}[10m])) > 40e6
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "Tenant {{ $labels.namespace }} egress {{ $value | humanize }}B/s for 15 minutes: scanning / exfiltration / relay pattern, check the tenant's instances in the admin console and freeze if needed"}
prometheus-node-exporter:
  tolerations:
    - {key: CriticalAddonsOnly, operator: Exists, effect: NoExecute}
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  extraArgs:
    - --collector.textfile.directory=/host/textfile
    # GB10(cppc_cpufreq)上 cpufreq collector 的抓取会偶发永不返回,卡住的 handler 攒到 --web.max-requests(40)
    # 之后整个 node-exporter 只回 503,textfile 指标(备份 / 证书链)随之 absent 误报;无规则用 cpufreq 指标
    - --no-collector.cpufreq
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile
      mountPath: /host/textfile
      readOnly: true
      mountPropagation: None
