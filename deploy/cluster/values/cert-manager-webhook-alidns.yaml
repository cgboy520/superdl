# cert-manager-webhook-alidns:阿里云 DNS01 solver(P0-16),泛域名证书
# (*.Jupyter 子域、api/console/admin 入口)签发的 DNS 校验落点。
# groupName 必须与 deploy/app/k8s/05-cert-manager.yaml 的 ClusterIssuer
# letsencrypt-dns solvers.dns01.webhook.groupName 一致,改一边必须同步另一边。
groupName: acme.superdl

# 凭据不代建(helm 不管 Secret):apply 前手工建(preflight.sh 会检查),键名须与
# ClusterIssuer 的 accessKeySecretRef/secretKeySecretRef 一致(access-key / secret-key):
#   kubectl -n cert-manager create secret generic alidns-credentials \
#     --from-literal=access-key=<阿里云 AccessKeyId> \
#     --from-literal=secret-key=<阿里云 AccessKeySecret>
# 建议 RAM 子账号,仅授 AliyunDNSFullAccess;示例见 deploy/app/secrets.example.yaml。

# 指标与日志保持 chart 默认即可;solver 异常会体现在
# certmanager_certificate_ready_status{condition="False"}(告警见 values/kps.yaml CertNotReady)。
