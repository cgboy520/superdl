# Cilium 1.20:CNI + LB(SSH 端口池)。北向 Ingress(含 JupyterLab 泛域名)走 ingress-nginx
kubeProxyReplacement: true
k8sServiceHost: "<server-ip>"
k8sServicePort: 6443
gatewayAPI:
  # 必须与 CRD 状态一致:helmfile 不装 Gateway API CRD,开了 cilium-operator 会因缺 CRD 报错。
  # 实际数据路径是 ingress-nginx(deploy/app/k8s/04-ingress.yaml 的 ingressClassName: nginx)。
  enabled: false
l2announcements:
  enabled: true            # 裸金属 LB 通告(或按机房改 BGP)
# 安全:不开 externalIPs(CVE-2020-8554 类 MITM 面;SSH 走 NodePort+LB 池即可)
hubble:
  enabled: true
  relay:
    enabled: true
operator:
  replicas: 1
