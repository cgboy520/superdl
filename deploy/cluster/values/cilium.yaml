# Cilium 1.20:CNI + LB(SSH 端口池)+ Gateway API(JupyterLab 泛域名)
kubeProxyReplacement: true
k8sServiceHost: "<server-ip>"
k8sServicePort: 6443
gatewayAPI:
  enabled: true            # *.app.<域名> 泛域名路由(WP7 通道)
l2announcements:
  enabled: true            # 裸金属 LB 通告(或按机房改 BGP)
externalIPs:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
operator:
  replicas: 1
