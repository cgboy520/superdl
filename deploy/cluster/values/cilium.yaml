kubeProxyReplacement: true
ipam:
  mode: kubernetes
policyCIDRMatchMode:
  - nodes
k8sServiceHost: "CHANGE_ME_API_VIP"
k8sServicePort: 6443
gatewayAPI:
  enabled: false
l2announcements:
  enabled: true
bandwidthManager:
  enabled: true
  bbr: true
# BBR for Pods needs BPF host routing, which iptables masquerading turns off (the agent refuses to start)
bpf:
  masquerade: true
hubble:
  enabled: true
  relay:
    enabled: true
operator:
  replicas: 1
