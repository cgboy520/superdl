# HAMi v2.9:仅共享池,libvgpu 在 CUDA 层软限额(不是安全边界,见 docs/reference/security.md 隔离级别分级表)
scheduler:
  defaultSchedulerPolicy:
    nodeSchedulerPolicy: binpack
    gpuSchedulerPolicy: binpack
devicePlugin:
  runtimeClassName: ""               # 共享池 runc(HAMi 与 Kata 互斥)
  # chart 键是 nvidiaNodeSelector(默认 gpu: "on"),不是 nodeSelector
  nvidiaNodeSelector:
    gpu: null                        # 删掉 chart 默认的 gpu: "on"(helm 合并 map 不会覆盖整段,null 才能删键)
    superdl.io/pool: hami            # 只接管 hami 池,与官方 device plugin 互斥
devices:
  nvidia:
    gpuCorePolicy: force             # 算力份额硬限
    # 显存超卖 ≤1.2;售卖由 SKU 参数控制
