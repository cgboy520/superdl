storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      isDefaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
lvmd:
  deviceClasses:
    - name: nvme
      volume-group: superdl-nvme
      default: true
      spare-gb: 50
  volumeMounts:
    - name: lvmd-socket-dir
      mountPath: /run/topolvm
    - name: lvm-config
      mountPath: /etc/lvm/lvm.conf
      subPath: lvm.conf
  additionalVolumes:
    - name: lvm-config
      configMap:
        name: topolvm-lvm-config
