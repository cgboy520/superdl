# TopoLVM chart 17.x:实例盘 = 节点本地 NVMe LV;lvremove 经 issue_discards=1 发 TRIM(耗时见 runbooks/cluster-validation.md D 节)。
# 实例盘 PVC(<instance-uuid>-root)由平台自管生命周期
storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      isDefaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
lvmd:
  deviceClasses:
    - name: nvme
      volume-group: superdl-nvme      # 装机基线创建的 VG
      default: true
      spare-gb: 50
  # lvm.conf(issue_discards=1)经 ConfigMap 注入(../topolvm/lvm-config.configmap.yaml,presync hook 应用;node-join.sh 宿主侧同款)。
  # chart 17 的 lvmd.volumeMounts 整段替换默认挂载,/run/topolvm 必须一并写上;卷侧用 additionalVolumes 追加
  volumeMounts:
    - name: lvmd-socket-dir
      mountPath: /run/topolvm
    - name: lvm-config
      mountPath: /etc/lvm/lvm.conf
      subPath: lvm.conf
  additionalVolumes:
    - name: lvm-config
      configMap:
        name: topolvm-lvm-config
