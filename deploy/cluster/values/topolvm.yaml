# TopoLVM chart 17.x:实例盘 = 节点本地 NVMe LV;销毁时 blkdiscard(擦盘)。
# 实例盘 PVC 由平台自管生命周期(<instance-uuid>-root,只在释放/回收时删)。
# reclaimPolicy 显式写死,不取 chart 默认值。
storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      isDefaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
lvmd:
  deviceClasses:
    - name: nvme
      volume-group: superdl-nvme      # 装机基线创建的 VG
      default: true
      spare-gb: 50
