# Local LVM volumes for platform components only (Prometheus, Loki, acme-dns, CloudNativePG):
# tenant system and data disks live on the external Ceph cluster. lvmd and the node plugin run on
# the nodes labelled superdl.io/infra-storage=true, which carry the superdl-infra volume group
# (see runbooks/ceph-storage.md); GPU nodes carry none.
storageClasses:
  - name: topolvm-provisioner
    storageClass:
      fsType: ext4
      isDefaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
lvmd:
  deviceClasses:
    - name: infra
      volume-group: superdl-infra
      default: true
      spare-gb: 10
  nodeSelector:
    superdl.io/infra-storage: "true"
  tolerations:
    - operator: Exists
  volumeMounts:
    - name: lvmd-socket-dir
      mountPath: /run/topolvm
    - name: lvm-config
      mountPath: /etc/lvm/lvm.conf
      subPath: lvm.conf
  additionalVolumes:
    - name: lvm-config
      configMap:
        name: topolvm-lvm-config
node:
  nodeSelector:
    superdl.io/infra-storage: "true"
  tolerations:
    - operator: Exists
