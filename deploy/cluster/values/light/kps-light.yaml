# kps 轻量档:k3s 单机/小规模。与 full 同 chart,只砍占用 —— 短 retention /
# 关 Grafana / 资源限额收紧。Alertmanager 必须保留:webhook 告警链路是业务功能
# (管理端告警流与铃铛)。
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "3GB"     # 覆盖 full 档的 40GB(单机盘小)
    storageSpec:             # 覆盖 full 档的 50Gi
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 5Gi}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
grafana:
  enabled: false
# Alertmanager 存储必须随档覆盖:full 档是 superdl-juicefs(RWX),light 无 JuiceFS,
# 不覆盖则 PVC 永不绑定 → Alertmanager 永不启动 → 生产零告警且静默。
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 1Gi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
