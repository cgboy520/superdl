prometheus:
  prometheusSpec:
    # retentionSize 先于 retention 生效:盘到 4GB 即按最老块淘汰,15d 只是上限
    retention: 15d
    retentionSize: "4GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 5Gi}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
grafana:
  enabled: false
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 1Gi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
