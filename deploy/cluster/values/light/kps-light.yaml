# kps 轻量档:同 chart,短 retention / 关 Grafana / 收紧限额。Alertmanager 必须保留(管理端告警流依赖 webhook)
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "3GB"     # 覆盖 full 档的 40GB
    storageSpec:             # 覆盖 full 档的 50Gi
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 5Gi}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
grafana:
  enabled: false
# Alertmanager 存储随档覆盖(full 档是 superdl-cephfs)
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 1Gi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
