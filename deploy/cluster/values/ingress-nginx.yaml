# ingress-nginx:默认证书 = superdl 命名空间的 *.app 泛域名证书,
# 使租户 Jupyter Ingress 不写 secretName 也走 TLS(cert-manager 签发,见 deploy/app/k8s/05)。
controller:
  extraArgs:
    default-ssl-certificate: "superdl/superdl-jupyter-wildcard-tls"
  config:
    ssl-redirect: "true"
  # 可用性:双副本 + PDB(chart 在 replicaCount>1 时按 minAvailable 自动建 PDB)+ 拓扑摊开。
  # 北向唯一入口(api/console/admin/租户 Jupyter 全走这里),单点重启不应断流。
  replicaCount: 2
  minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway   # 单节点集群仍可调度
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
