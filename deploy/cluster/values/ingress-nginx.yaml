# ingress-nginx:默认证书 = superdl 命名空间的 *.app 泛域名证书,
# 使租户 Jupyter Ingress 不写 secretName 也走 TLS(cert-manager 签发,见 deploy/app/k8s/05)。
controller:
  # chart 默认 0,渲染进 Deployment.spec.progressDeadlineSeconds 会被 API server 拒
  # (must be greater than minReadySeconds),helm upgrade 直接失败。600 = k8s 默认值,
  # 与现网 Deployment 上的实际值一致,写死只为让 upgrade 能过。
  progressDeadlineSeconds: 600
  extraArgs:
    default-ssl-certificate: "superdl/superdl-jupyter-wildcard-tls"
  config:
    ssl-redirect: "true"
  # 可用性:双副本 + PDB(chart 在 replicaCount>1 时按 minAvailable 自动建 PDB)+ 拓扑摊开。
  # 北向唯一入口(api/console/admin/租户 Jupyter 全走这里),单点重启不应断流。
  # 资源:南北向入口 requests==limits 提 Guaranteed——节点资源紧张时不与租户
  # Pod 同级,避免先被驱逐;按入口峰值带宽/连接数实测后再调。
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # 与 API/worker 对齐(deploy/app/k8s/02、03):优先级压过租户 Pod——Guaranteed 只防
  # 同优先级驱逐,priorityClass 才保证资源紧张时先于租户 BestEffort/Burstable 被保。
  priorityClassName: system-cluster-critical
  replicaCount: 2
  minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway   # 单节点集群仍可调度
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
