
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-sa-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        scope: "*"
  matchConditions:
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  validations:
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        (request.operation == 'DELETE'
          ? oldObject.metadata.name.startsWith('tenant-')
          : object.metadata.name.startsWith('tenant-'))
      message: "平台 SA 只能创建/删除 tenant-* 命名空间"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'superdl.io/managed' in object.metadata.labels &&
         object.metadata.labels['superdl.io/managed'] == 'true')
      message: "创建 tenant-* 命名空间必须携带 superdl.io/managed=true 标签(Pod 基线锚点)"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        request.operation != 'UPDATE' ||
        !oldObject.metadata.name.startsWith('tenant-') ||
        (has(object.metadata.labels) && 'superdl.io/managed' in object.metadata.labels &&
         object.metadata.labels['superdl.io/managed'] == 'true')
      message: "tenant-* 命名空间的 superdl.io/managed=true 标签不可摘除"
    - expression: >-
        (request.resource.group == '' && request.resource.resource == 'namespaces') ||
        (has(request.namespace) &&
         (request.namespace == 'superdl' || request.namespace.startsWith('tenant-'))) ||
        (!has(request.namespace) && request.resource.group == '' && request.resource.resource == 'nodes')
      message: "平台 SA 的写操作仅限 superdl/tenant-* 命名空间与 nodes"
    - expression: >-
        !(request.resource.group == 'rbac.authorization.k8s.io' &&
          (request.resource.resource == 'roles' || request.resource.resource == 'rolebindings')) ||
        (has(request.namespace) && request.namespace.startsWith('tenant-'))
      message: "平台 SA 只能在 tenant-* 命名空间写 roles/rolebindings"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'secrets') ||
        request.operation == 'DELETE' ||
        !has(object.type) ||
        object.type != 'kubernetes.io/service-account-token'
      message: "平台 SA 禁止创建/更新 kubernetes.io/service-account-token 类型的 Secret"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-sa-scope
spec:
  policyName: superdl-platform-sa-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-tenant-pod-baseline
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        superdl.io/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  validations:
    - expression: >-
        !object.spec.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || !object.spec.initContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)) &&
        (!has(object.spec.ephemeralContainers) || !object.spec.ephemeralContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: "租户 Pod 禁止 privileged 容器"
    - expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
      message: "租户 Pod 禁止 hostPath 卷"
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "租户 Pod 禁止 hostNetwork/hostPID/hostIPC"
    - expression: >-
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata-qemu') ||
        (has(object.spec.hostUsers) && object.spec.hostUsers == false)
      message: "非 Kata 租户 Pod 必须显式 hostUsers: false(userns 隔离);Kata 档由 VM 隔离,不传该字段"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "租户 Pod 必须 automountServiceAccountToken: false"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "租户容器必须显式 allowPrivilegeEscalation: false"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL') &&
          (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(a, a in ['SYS_CHROOT', 'SETUID', 'SETGID'])))
      message: "租户容器必须 drop ALL capabilities,仅允许 add SYS_CHROOT/SETUID/SETGID(sshd 特权分离所需)"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.seccompProfile) &&
          has(c.securityContext.seccompProfile.type) && c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: "租户容器必须 seccompProfile: RuntimeDefault"
    - expression: >-
        !has(object.spec.nodeName) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName)
      message: "租户 Pod 禁止指定/改动 spec.nodeName 绕过调度器"
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['kata-qemu', 'nvidia']
      message: "租户 Pod 的 runtimeClassName 仅允许 kata-qemu / nvidia"
    - expression: >-
        object.spec.containers.all(c, !has(c.env) || !c.env.exists(e, e.name.startsWith('NVIDIA_'))) &&
        (!has(object.spec.initContainers) ||
          object.spec.initContainers.all(c, !has(c.env) || !c.env.exists(e, e.name.startsWith('NVIDIA_'))))
      message: "租户 Pod 禁止 NVIDIA_* 环境变量(GPU 可见性由平台分配链控制;伪造可见性 = 看到同机全部显卡)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-tenant-pod-baseline
spec:
  policyName: superdl-tenant-pod-baseline
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-node-field-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["nodes"]
        operations: ["UPDATE"]
        scope: "Cluster"
  matchConditions:
    - name: superdl-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: taintsSame
      expression: >-
        (!has(object.spec.taints) && !has(oldObject.spec.taints)) ||
        (has(object.spec.taints) && has(oldObject.spec.taints) && object.spec.taints == oldObject.spec.taints)
    - name: podCIDRSame
      expression: >-
        (!has(object.spec.podCIDR) && !has(oldObject.spec.podCIDR)) ||
        (has(object.spec.podCIDR) && has(oldObject.spec.podCIDR) && object.spec.podCIDR == oldObject.spec.podCIDR)
    - name: podCIDRsSame
      expression: >-
        (!has(object.spec.podCIDRs) && !has(oldObject.spec.podCIDRs)) ||
        (has(object.spec.podCIDRs) && has(oldObject.spec.podCIDRs) && object.spec.podCIDRs == oldObject.spec.podCIDRs)
    - name: providerIDSame
      expression: >-
        (!has(object.spec.providerID) && !has(oldObject.spec.providerID)) ||
        (has(object.spec.providerID) && has(oldObject.spec.providerID) && object.spec.providerID == oldObject.spec.providerID)
    - name: gpuOperandKeys
      expression: "['nvidia.com/gpu.workload.config', 'nvidia.com/gpu.deploy.device-plugin']"
    - name: annotationsSame
      expression: >-
        (!has(object.metadata.annotations) && !has(oldObject.metadata.annotations)) ||
        (has(object.metadata.annotations) && has(oldObject.metadata.annotations) &&
         object.metadata.annotations == oldObject.metadata.annotations)
    - name: finalizersSame
      expression: >-
        (!has(object.metadata.finalizers) && !has(oldObject.metadata.finalizers)) ||
        (has(object.metadata.finalizers) && has(oldObject.metadata.finalizers) &&
         object.metadata.finalizers == oldObject.metadata.finalizers)
  validations:
    - expression: "variables.taintsSame && variables.podCIDRSame && variables.podCIDRsSame && variables.providerIDSame"
      message: "平台 SA 对 Node spec 仅允许变更 unschedulable(cordon);taints/podCIDR/providerID 锁死"
    - expression: >-
        has(object.metadata.labels) && has(oldObject.metadata.labels) &&
        object.metadata.labels.all(k, k.startsWith('superdl.io/') || k in variables.gpuOperandKeys ||
          (k in oldObject.metadata.labels && object.metadata.labels[k] == oldObject.metadata.labels[k])) &&
        oldObject.metadata.labels.all(k, k.startsWith('superdl.io/') || k in variables.gpuOperandKeys ||
          (k in object.metadata.labels && oldObject.metadata.labels[k] == object.metadata.labels[k]))
      message: "平台 SA 对 Node labels 仅允许变更 superdl.io/* 与 GPU operand 落点键"
    - expression: "variables.annotationsSame && variables.finalizersSame"
      message: "平台 SA 禁止变更 Node annotations/finalizers"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-node-field-scope
spec:
  policyName: superdl-node-field-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-global-pod-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "gpu-operator", "monitoring", "envoy-gateway-system", "topolvm-system", "rook-ceph"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  validations:
    - expression: >-
        !object.spec.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || !object.spec.initContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)) &&
        (!has(object.spec.ephemeralContainers) || !object.spec.ephemeralContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: "非豁免命名空间禁止 privileged 容器"
    - expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
      message: "非豁免命名空间禁止 hostPath 卷"
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "非豁免命名空间禁止 hostNetwork/hostPID/hostIPC"
    - expression: "!has(object.spec.hostUsers) || object.spec.hostUsers == false"
      message: "非豁免命名空间禁止 hostUsers: true"
    - expression: >-
        !has(object.spec.nodeName) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName) ||
        (request.namespace == 'superdl' && has(object.metadata.labels) &&
         'superdl.io/prewarm' in object.metadata.labels &&
         object.metadata.labels['superdl.io/prewarm'] == 'true')
      message: "禁止指定 spec.nodeName 绕过调度器(仅平台预热 Job 放行)"
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['kata-qemu', 'nvidia']
      message: "runtimeClassName 仅允许 kata-qemu / nvidia"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-global-pod-guard
spec:
  policyName: superdl-global-pod-guard
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-pod-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  matchConditions:
    - name: superdl-namespace-only
      expression: "request.namespace == 'superdl'"
    - name: platform-sa-or-job-controller
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:superdl:') ||
        request.userInfo.username == 'system:serviceaccount:kube-system:job-controller'
  variables:
    - name: strict
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  validations:
    - expression: >-
        !has(object.spec.imagePullSecrets) ||
        object.spec.imagePullSecrets.all(s,
          has(s.name) &&
          (s.name == 'superdl-registry-pull' ||
           (!variables.strict && !s.name.startsWith('superdl-'))))
      message: "superdl 命名空间内平台/Job 建的 Pod 只允许 imagePullSecrets: superdl-registry-pull"
    - expression: >-
        object.spec.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-'))))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))))
      message: "superdl 命名空间内的平台 Pod 不得用 secretKeyRef 引 superdl-* 密钥"
    - expression: >-
        object.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-'))))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-')))))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-'))))))
      message: "superdl 命名空间内 envFrom.secretRef 仅限迁移/备份 Job 的 superdl-db-migrate、superdl-pg-backup"
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          (!has(v.secret) ||
           (!variables.strict && has(v.secret.secretName) && !v.secret.secretName.startsWith('superdl-'))) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s,
            !has(s.secret) ||
            (!variables.strict && has(s.secret.name) && !s.secret.name.startsWith('superdl-')))) &&
          (!has(v.csi) || !has(v.csi.nodePublishSecretRef) ||
           (!variables.strict && has(v.csi.nodePublishSecretRef.name) &&
            !v.csi.nodePublishSecretRef.name.startsWith('superdl-'))))
      message: "superdl 命名空间内禁止把平台 Secret(superdl-*)挂进 Pod(secret / projected / csi 卷)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-pod-secret-scope
spec:
  policyName: superdl-platform-pod-secret-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-job-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["*"]
        resources: ["jobs"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  matchConditions:
    - name: superdl-namespace-only
      expression: "request.namespace == 'superdl'"
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: podSpec
      expression: "object.spec.template.spec"
  validations:
    - expression: >-
        !has(variables.podSpec.imagePullSecrets) ||
        variables.podSpec.imagePullSecrets.all(s, has(s.name) && s.name == 'superdl-registry-pull')
      message: "平台 SA 建的 Job 只允许 imagePullSecrets: superdl-registry-pull(预热 Job)"
    - expression: >-
        variables.podSpec.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))) &&
        (!has(variables.podSpec.initContainers) || variables.podSpec.initContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))))
      message: "平台 SA 建的 Job 不得用 secretKeyRef 引 superdl-* 密钥"
    - expression: >-
        variables.podSpec.containers.all(c, !has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))
      message: "平台 SA 建的 Job 禁止 envFrom.secretRef(整份 Secret 注入)"
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
          !has(v.secret) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret))) &&
          (!has(v.csi) || !has(v.csi.nodePublishSecretRef)))
      message: "平台 SA 建的 Job 禁止挂载 Secret 卷(secret / projected / csi)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-job-secret-scope
spec:
  policyName: superdl-platform-job-secret-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-node-delete-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["nodes"]
        operations: ["DELETE"]
        scope: "Cluster"
  matchConditions:
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: labels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
  validations:
    - expression: >-
        !('node-role.kubernetes.io/control-plane' in variables.labels) &&
        !('node-role.kubernetes.io/master' in variables.labels) &&
        !('node-role.kubernetes.io/etcd' in variables.labels)
      message: "平台 SA 禁止删除控制面/etcd 节点(node.decommission 只退役 GPU 工作节点)"
    - expression: >-
        !('node-restriction.kubernetes.io/superdl-infra' in variables.labels) &&
        !('node-role.superdl.io/infra' in variables.labels)
      message: "平台 SA 禁止删除带 infra 落点标签的节点(删了标签不会随 kubelet 重新注册回来,平台组件会全部 Pending)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-node-delete-scope
spec:
  policyName: superdl-node-delete-scope
  validationActions: [Deny]
