
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-sa-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        # "*/*" = every resource and its subresources (the apiserver rejects it alongside "*")
        resources: ["*/*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        scope: "*"
  matchConditions:
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  validations:
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'pods' && has(request.subResource) &&
          request.subResource in ['exec', 'attach', 'portforward', 'ephemeralcontainers'])
      message: "platform SAs may not use pods/exec, pods/attach, pods/portforward or pods/ephemeralcontainers"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        (request.operation == 'DELETE'
          ? oldObject.metadata.name.startsWith('tenant-')
          : object.metadata.name.startsWith('tenant-'))
      message: "platform SAs may only create/delete tenant-* namespaces"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'superdl.io/managed' in object.metadata.labels &&
         object.metadata.labels['superdl.io/managed'] == 'true')
      message: "creating a tenant-* namespace requires the superdl.io/managed=true label (the Pod baseline anchor)"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'namespaces') ||
        request.operation != 'UPDATE' ||
        !oldObject.metadata.name.startsWith('tenant-') ||
        (has(object.metadata.labels) && 'superdl.io/managed' in object.metadata.labels &&
         object.metadata.labels['superdl.io/managed'] == 'true')
      message: "the superdl.io/managed=true label of a tenant-* namespace cannot be removed"
    - expression: >-
        (request.resource.group == '' && request.resource.resource == 'namespaces') ||
        (has(request.namespace) &&
         (request.namespace == 'superdl' || request.namespace.startsWith('tenant-'))) ||
        (!has(request.namespace) && request.resource.group == '' && request.resource.resource == 'nodes')
      message: "platform SA writes are limited to the superdl/tenant-* namespaces and nodes"
    - expression: >-
        !(request.resource.group == 'rbac.authorization.k8s.io' &&
          (request.resource.resource == 'roles' || request.resource.resource == 'rolebindings')) ||
        (has(request.namespace) && request.namespace.startsWith('tenant-'))
      message: "platform SAs may write roles/rolebindings only in tenant-* namespaces"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'secrets') ||
        request.operation == 'DELETE' ||
        !has(object.type) ||
        object.type != 'kubernetes.io/service-account-token'
      message: "platform SAs may not create/update Secrets of type kubernetes.io/service-account-token"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-sa-scope
spec:
  policyName: superdl-platform-sa-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-tenant-pod-baseline
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        superdl.io/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        !variables.allContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)
      message: "tenant Pods may not run privileged containers"
    - expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
      message: "tenant Pods may not use hostPath volumes"
    - expression: "!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default'"
      message: "tenant Pods may not set a serviceAccountName other than default"
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "tenant Pods may not use hostNetwork/hostPID/hostIPC"
    - expression: >-
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata-qemu') ||
        (has(object.spec.hostUsers) && object.spec.hostUsers == false)
      message: "non-Kata tenant Pods must set hostUsers: false explicitly (userns isolation); the Kata tier is VM-isolated and omits the field"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "tenant Pods must set automountServiceAccountToken: false"
    - expression: >-
        variables.allContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "tenant containers (init/ephemeral included) must set allowPrivilegeEscalation: false explicitly"
    - expression: >-
        variables.allContainers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL') &&
          (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(a, a in ['SYS_CHROOT', 'SETUID', 'SETGID'])))
      message: "tenant containers (init/ephemeral included) must drop ALL capabilities and may only add SYS_CHROOT/SETUID/SETGID (needed by sshd privilege separation)"
    - expression: >-
        variables.allContainers.all(c, has(c.securityContext) && has(c.securityContext.seccompProfile) &&
          has(c.securityContext.seccompProfile.type) && c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: "tenant containers (init/ephemeral included) must set seccompProfile: RuntimeDefault"
    - expression: >-
        !has(object.spec.nodeName) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName)
      message: "tenant Pods may not set or change spec.nodeName to bypass the scheduler"
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['kata-qemu', 'nvidia']
      message: "tenant Pod runtimeClassName may only be kata-qemu / nvidia"
    - expression: >-
        variables.allContainers.all(c, !has(c.env) || !c.env.exists(e, e.name.startsWith('NVIDIA_')))
      message: "tenant Pods may not set NVIDIA_* environment variables (GPU visibility is controlled by the platform allocation chain; forged visibility = seeing every GPU on the machine)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-tenant-pod-baseline
spec:
  policyName: superdl-tenant-pod-baseline
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-node-field-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["nodes"]
        operations: ["UPDATE"]
        scope: "Cluster"
  matchConditions:
    - name: superdl-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: taintsSame
      expression: >-
        (!has(object.spec.taints) && !has(oldObject.spec.taints)) ||
        (has(object.spec.taints) && has(oldObject.spec.taints) && object.spec.taints == oldObject.spec.taints)
    - name: podCIDRSame
      expression: >-
        (!has(object.spec.podCIDR) && !has(oldObject.spec.podCIDR)) ||
        (has(object.spec.podCIDR) && has(oldObject.spec.podCIDR) && object.spec.podCIDR == oldObject.spec.podCIDR)
    - name: podCIDRsSame
      expression: >-
        (!has(object.spec.podCIDRs) && !has(oldObject.spec.podCIDRs)) ||
        (has(object.spec.podCIDRs) && has(oldObject.spec.podCIDRs) && object.spec.podCIDRs == oldObject.spec.podCIDRs)
    - name: providerIDSame
      expression: >-
        (!has(object.spec.providerID) && !has(oldObject.spec.providerID)) ||
        (has(object.spec.providerID) && has(oldObject.spec.providerID) && object.spec.providerID == oldObject.spec.providerID)
    - name: gpuOperandKeys
      expression: "['nvidia.com/gpu.workload.config', 'nvidia.com/gpu.deploy.device-plugin']"
    - name: poolKey
      expression: "'node-restriction.kubernetes.io/superdl-pool'"
    - name: annotationsSame
      expression: >-
        (!has(object.metadata.annotations) && !has(oldObject.metadata.annotations)) ||
        (has(object.metadata.annotations) && has(oldObject.metadata.annotations) &&
         object.metadata.annotations == oldObject.metadata.annotations)
    - name: finalizersSame
      expression: >-
        (!has(object.metadata.finalizers) && !has(oldObject.metadata.finalizers)) ||
        (has(object.metadata.finalizers) && has(oldObject.metadata.finalizers) &&
         object.metadata.finalizers == oldObject.metadata.finalizers)
  validations:
    - expression: "variables.taintsSame && variables.podCIDRSame && variables.podCIDRsSame && variables.providerIDSame"
      message: "platform SAs may only change unschedulable (cordon) in the Node spec; taints/podCIDR/providerID are locked"
    - expression: >-
        has(object.metadata.labels) && has(oldObject.metadata.labels) &&
        object.metadata.labels.all(k, k.startsWith('superdl.io/') || k == variables.poolKey || k in variables.gpuOperandKeys ||
          (k in oldObject.metadata.labels && object.metadata.labels[k] == oldObject.metadata.labels[k])) &&
        oldObject.metadata.labels.all(k, k.startsWith('superdl.io/') || k == variables.poolKey || k in variables.gpuOperandKeys ||
          (k in object.metadata.labels && oldObject.metadata.labels[k] == object.metadata.labels[k]))
      message: "platform SAs may only change superdl.io/*, the pool label node-restriction.kubernetes.io/superdl-pool and the GPU operand placement keys on Node labels (the superdl-infra placement key is not among them)"
    - expression: "variables.annotationsSame && variables.finalizersSame"
      message: "platform SAs may not change Node annotations/finalizers"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-node-field-scope
spec:
  policyName: superdl-node-field-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-global-pod-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "gpu-operator", "monitoring", "envoy-gateway-system", "topolvm-system", "rook-ceph"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  validations:
    - expression: >-
        !object.spec.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || !object.spec.initContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)) &&
        (!has(object.spec.ephemeralContainers) || !object.spec.ephemeralContainers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: "non-exempt namespaces may not run privileged containers"
    - expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
      message: "non-exempt namespaces may not use hostPath volumes"
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "non-exempt namespaces may not use hostNetwork/hostPID/hostIPC"
    - expression: "!has(object.spec.hostUsers) || object.spec.hostUsers == false"
      message: "non-exempt namespaces may not set hostUsers: true explicitly (an absent field passes; tenant namespaces are additionally forced to hostUsers: false by superdl-tenant-pod-baseline)"
    - expression: >-
        !has(object.spec.nodeName) ||
        (request.operation == 'UPDATE' && has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName) ||
        (request.namespace == 'superdl' && has(object.metadata.labels) &&
         'superdl.io/prewarm' in object.metadata.labels &&
         object.metadata.labels['superdl.io/prewarm'] == 'true')
      message: "setting spec.nodeName to bypass the scheduler is forbidden (only the platform prewarm Job is allowed)"
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['kata-qemu', 'nvidia']
      message: "runtimeClassName may only be kata-qemu / nvidia"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-global-pod-guard
spec:
  policyName: superdl-global-pod-guard
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-pod-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods", "pods/ephemeralcontainers"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  matchConditions:
    - name: superdl-namespace-only
      expression: "request.namespace == 'superdl'"
    - name: platform-sa-or-job-controller
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:superdl:') ||
        request.userInfo.username == 'system:serviceaccount:kube-system:job-controller'
  variables:
    - name: strict
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  validations:
    - expression: >-
        !variables.strict ||
        ((!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default') &&
         has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
      message: "Pods created by platform SAs in the superdl namespace may not set a serviceAccountName other than default and must set automountServiceAccountToken: false"
    - expression: >-
        !has(object.spec.imagePullSecrets) ||
        object.spec.imagePullSecrets.all(s,
          has(s.name) &&
          (s.name == 'superdl-registry-pull' ||
           (!variables.strict && !s.name.startsWith('superdl-'))))
      message: "Pods created by the platform / Jobs in the superdl namespace may only use imagePullSecrets: superdl-registry-pull"
    - expression: >-
        object.spec.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-'))))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !variables.strict && !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))))
      message: "platform Pods in the superdl namespace may not reference superdl-* secrets through secretKeyRef"
    - expression: >-
        object.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-'))))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-')))))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.envFrom) || c.envFrom.all(f,
          !has(f.secretRef) ||
          (!variables.strict && has(f.secretRef.name) &&
           (f.secretRef.name in ['superdl-db-migrate', 'superdl-pg-backup'] ||
            !f.secretRef.name.startsWith('superdl-'))))))
      message: "envFrom.secretRef in the superdl namespace is limited to superdl-db-migrate and superdl-pg-backup of the migration / backup Jobs"
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          (!has(v.secret) ||
           (!variables.strict && has(v.secret.secretName) && !v.secret.secretName.startsWith('superdl-'))) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s,
            !has(s.secret) ||
            (!variables.strict && has(s.secret.name) && !s.secret.name.startsWith('superdl-')))) &&
          (!has(v.csi) || !has(v.csi.nodePublishSecretRef) ||
           (!variables.strict && has(v.csi.nodePublishSecretRef.name) &&
            !v.csi.nodePublishSecretRef.name.startsWith('superdl-'))))
      message: "mounting platform Secrets (superdl-*) into Pods in the superdl namespace is forbidden (secret / projected / csi volumes)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-pod-secret-scope
spec:
  policyName: superdl-platform-pod-secret-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-platform-job-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["*"]
        resources: ["jobs"]
        operations: ["CREATE", "UPDATE"]
        scope: "Namespaced"
  matchConditions:
    - name: superdl-namespace-only
      expression: "request.namespace == 'superdl'"
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: podSpec
      expression: "object.spec.template.spec"
  validations:
    - expression: >-
        (!has(variables.podSpec.serviceAccountName) || variables.podSpec.serviceAccountName == 'default') &&
        has(variables.podSpec.automountServiceAccountToken) && variables.podSpec.automountServiceAccountToken == false
      message: "Job templates created by platform SAs may not set a serviceAccountName other than default and must set automountServiceAccountToken: false"
    - expression: >-
        !has(variables.podSpec.imagePullSecrets) ||
        variables.podSpec.imagePullSecrets.all(s, has(s.name) && s.name == 'superdl-registry-pull')
      message: "Jobs created by platform SAs may only use imagePullSecrets: superdl-registry-pull (prewarm Job)"
    - expression: >-
        variables.podSpec.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))) &&
        (!has(variables.podSpec.initContainers) || variables.podSpec.initContainers.all(c, !has(c.env) || c.env.all(e,
          !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
          (has(e.valueFrom.secretKeyRef.name) &&
           !e.valueFrom.secretKeyRef.name.startsWith('superdl-')))))
      message: "Jobs created by platform SAs may not reference superdl-* secrets through secretKeyRef"
    - expression: >-
        variables.podSpec.containers.all(c, !has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))
      message: "Jobs created by platform SAs may not use envFrom.secretRef (whole-Secret injection)"
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
          !has(v.secret) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret))) &&
          (!has(v.csi) || !has(v.csi.nodePublishSecretRef)))
      message: "Jobs created by platform SAs may not mount Secret volumes (secret / projected / csi)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-platform-job-secret-scope
spec:
  policyName: superdl-platform-job-secret-scope
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: superdl-node-delete-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["nodes"]
        operations: ["DELETE"]
        scope: "Cluster"
  matchConditions:
    - name: platform-sa-only
      expression: "request.userInfo.username.startsWith('system:serviceaccount:superdl:')"
  variables:
    - name: labels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
  validations:
    - expression: >-
        !('node-role.kubernetes.io/control-plane' in variables.labels) &&
        !('node-role.kubernetes.io/master' in variables.labels) &&
        !('node-role.kubernetes.io/etcd' in variables.labels)
      message: "platform SAs may not delete control-plane/etcd nodes (node.decommission only retires GPU worker nodes)"
    - expression: >-
        !('node-restriction.kubernetes.io/superdl-infra' in variables.labels) &&
        !('node-role.superdl.io/infra' in variables.labels)
      message: "platform SAs may not delete nodes carrying the infra placement label (the label does not come back when the kubelet re-registers, every platform component would stay Pending)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: superdl-node-delete-scope
spec:
  policyName: superdl-node-delete-scope
  validationActions: [Deny]
