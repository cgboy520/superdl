# Host hardening (servers + agents, idempotent): key-only sshd, optional AllowUsers, account cleanup, default-deny nftables, kernel sysctl.
# Variables, the lock-out guard and the run order are in README.md "harden.yml".
- hosts: all
  become: true
  vars:
    ssh_port: 22
    ssh_allow_users: []
    ssh_allow_cidrs: ["0.0.0.0/0"]
    remove_users: []
    firewall_enabled: true
    cluster_cidrs: []
    pod_cidr: "10.42.0.0/16"
    service_cidr: "10.43.0.0/16"
    # Cluster ports allowed from cluster_cidrs only; extend here
    fw_cluster_tcp_ports:
      - "6443"       # kube-apiserver / k3s supervisor
      - "9345"       # rke2 supervisor
      - "10250"      # kubelet
      - "2379-2380"  # etcd(server)
      - "5001"       # embedded image registry P2P (embedded-registry)
      - "4240"       # Cilium health
      - "9962-9965"  # Cilium agent / operator / Hubble metrics
      - "9100"       # node-exporter
      - "8080"       # kube-state-metrics
      - "9394"       # HAMi
      - "9400"       # DCGM exporter
      - "3300"       # Ceph mon v2
      - "6789"       # Ceph mon v1
      - "6800-7300"  # Ceph OSD / MDS / mgr
    fw_cluster_udp_ports:
      - "8472"   # Cilium VXLAN
      - "51871"  # Cilium WireGuard
    # Allowed from any source
    fw_public_tcp_ports:
      - "30000-32767"  # NodePort (tenant SSH)
    # Allowed from any source on the servers group only (Envoy hangs off the server through ServiceLB)
    fw_server_public_tcp_ports:
      - "80"
      - "443"
    sysctl_hardening:
      kernel.dmesg_restrict: "1"
      fs.protected_regular: "2"
      fs.protected_fifos: "2"
      fs.protected_hardlinks: "1"
      fs.protected_symlinks: "1"
  tasks:
    - name: The connecting user is not in remove_users
      assert:
        that: ansible_user_id not in remove_users
        fail_msg: "remove_users contains the connecting user {{ ansible_user_id }}"

    - name: "Firewall prerequisite: cluster_cidrs must be given"
      assert:
        that: cluster_cidrs | length > 0
        fail_msg: "cluster_cidrs is empty: fill in the node internal ranges (e.g. 10.0.0.0/24), otherwise every cluster port is refused"
      when: firewall_enabled

    - name: Count usable public keys (with a non-empty ssh_allow_users only those users count, otherwise root and users with uid ≥ 1000)
      shell: |
        users="{{ ssh_allow_users | join(' ') }}"
        [ -n "$users" ] || users="root $(getent passwd | awk -F: '$3 >= 1000 && $3 < 65534 { print $1 }' | tr '\n' ' ')"
        n=0
        for u in $users; do
          h=$(getent passwd "$u" | cut -d: -f6)
          [ -n "$h" ] || continue
          for f in "$h/.ssh/authorized_keys" "$h/.ssh/authorized_keys2"; do
            [ -f "$f" ] || continue
            c=$(grep -cE '^(ssh-|ecdsa-|sk-)' "$f" || true)
            n=$((n + c))
          done
        done
        echo "$n"
      args:
        executable: /bin/bash
      register: pubkey_count
      changed_when: false

    - name: A public key must exist before turning password login off (lock-out guard)
      assert:
        that: pubkey_count.stdout | int > 0
        fail_msg: >-
          the target has no usable public key (the authorized_keys of root / ssh_allow_users are empty):
          run ssh-copy-id first, then this playbook

    - name: Write the sshd drop-in and self-check
      block:
        - name: sshd hardening drop-in (the 10- prefix sorts before 50-cloud-init.conf)
          template:
            src: templates/sshd-superdl.conf.j2
            dest: /etc/ssh/sshd_config.d/10-superdl.conf
            mode: "0600"
            owner: root
            group: root
          notify: reload-sshd
        - name: sshd -t
          command: /usr/sbin/sshd -t
          changed_when: false
      rescue:
        - name: "Self-check failed: withdraw the drop-in"
          file:
            path: /etc/ssh/sshd_config.d/10-superdl.conf
            state: absent
        - name: Abort
          fail:
            msg: "sshd -t failed, the drop-in has been withdrawn; see the previous step's output"

    - name: Clean up accounts (remove_users; home kept)
      user:
        name: "{{ item }}"
        state: absent
        remove: false
      loop: "{{ remove_users }}"

    - name: nftables package
      apt:
        name: nftables
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: firewall_enabled

    - name: nftables.service drop-in directory
      file:
        path: /etc/systemd/system/nftables.service.d
        state: directory
        mode: "0755"
      when: firewall_enabled

    - name: nftables.service ExecStop deletes only this table (the distribution default flush ruleset would clear the iptables-nft tables of Docker / Cilium / kubelet too)
      copy:
        dest: /etc/systemd/system/nftables.service.d/superdl.conf
        mode: "0644"
        content: |
          [Service]
          ExecStop=
          ExecStop=-/usr/sbin/nft delete table inet superdl
      notify: daemon-reload
      when: firewall_enabled

    - name: Render /etc/nftables.conf (written only after the nft -c pre-check passes)
      template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: "0600"
        owner: root
        group: root
        validate: /usr/sbin/nft -c -f %s
      notify: apply-nftables
      when: firewall_enabled

    - name: nftables loaded at boot
      systemd:
        name: nftables
        enabled: true
        daemon_reload: true
      when: firewall_enabled

    - name: Kernel hardening sysctl
      copy:
        dest: /etc/sysctl.d/60-superdl-harden.conf
        mode: "0644"
        content: |
          {% for k, v in sysctl_hardening.items() %}
          {{ k }} = {{ v }}
          {% endfor %}
      notify: apply-sysctl

  handlers:
    - name: reload-sshd
      systemd:
        name: ssh
        state: reloaded
    - name: daemon-reload
      systemd:
        daemon_reload: true
    - name: apply-nftables
      command: /usr/sbin/nft -f /etc/nftables.conf
    - name: apply-sysctl
      command: sysctl --system
