# 初始控制面装机:[servers] 组的 rke2/k3s server 安装(本文件唯一的 play):
#   ansible-playbook -i inventory.ini site.yml                        # rke2(full 档)
#   ansible-playbook -i inventory.ini site.yml -e cluster_distro=k3s  # k3s(light 档)
# 覆盖:apiserver 审计策略分发、server config 渲染(仓库模板 + 占位符替换,无 CHANGE_ME 残留才落盘)、
# 安装器落盘 + sha256 校验后安装、enable + start。
# GPU 节点不走 ansible:一律用管理端「添加节点」生成的一键命令(node-join.sh 覆盖内核参数、
# NVIDIA 驱动与 container toolkit、NVMe VG、registries.yaml 与 agent 加入)。
# 镜像预热由平台 outbox/巡检驱动,不在装机层做。
# OS 基线与变量清单见本目录 README.md。

# ───────────────────────── 控制面:初始 server 节点 ─────────────────────────
# 幂等:已装跳过安装,config 变更才重启。
- hosts: servers
  become: true
  vars:
    cluster_distro: rke2            # rke2(full 档)/ k3s(light 档)
    rke2_channel: latest
    # 安装器 sha256 pin(与 node-join.sh 同一信任模型:先落盘、校验、再执行,不裸 curl|sh)。
    # 上游安装器更新会校验失败,核对上游后同步更新本值与 node-join.sh 的 PIN_*_CN。
    rke2_installer_sha256: "5541410b86d4d19d927d820be85156e787be3fdb24be72507af52932a1d12de1"
    k3s_installer_sha256: "3944aa467eb945b5ff2151a8e4f8d4a5f3a210d31ab39aec81f37606936d0863"
    # 控制面敏感值(etcd 快照上传凭据、agent token)一律经 group_vars/servers.yml(不入 git)
    # 或 -e 注入;留空由 tasks 开头的「输入变量完备性」断言直接拦截,不装半残控制面
    # (断言必须在渲染【前】:replace 会抹掉占位符,渲染后再搜 CHANGE_ME 恒通过)。
    etcd_snapshot_bucket: ""
    etcd_s3_region: ""
    etcd_s3_endpoint: ""
    etcd_s3_access_key: ""
    etcd_s3_secret_key: ""
    agent_token: ""
    # 控制面 HA:定义 api_vip 即为 3 server 堆叠 etcd 集群渲染 tls-san(apiserver 证书覆盖
    # VIP + 全部 server IP,首台与后续 server 渲染产物一致)。
    # 单 server 集群保持空值,server-config.yaml 的 tls-san 块维持注释。
    api_vip: ""
    server_ips: []                # 逐台 server IP,如 ["10.0.0.11","10.0.0.12","10.0.0.13"]
    server_hostnames: []          # 可选:主机名 SAN,便于绕过 VIP 直连排障
    # Harbor 自签/私有 CA(PEM 全文):非空即落 /etc/rancher/<distro>/harbor-ca.crt,
    # 与 ../cluster/rke2/registries.yaml 的 configs.tls.ca_file 配套;公信证书留空
    harbor_ca_pem: ""
  tasks:
    # 渲染【前】断言输入:replace() 无条件执行会把占位符直接抹掉,事后搜 CHANGE_ME
    # 的断言恒通过。agent token 缺失时节点回落使用 server token——那是能把新机器
    # 拉进 etcd 成员的凭据。
    - name: 输入变量完备性(渲染前断言,而非断言渲染产物)
      assert:
        that:
          - agent_token | length >= 32
          - agent_token is not search('CHANGE_ME')
        fail_msg: >-
          agent_token 未提供或过短:用 openssl rand -hex 32 生成,经 group_vars/servers.yml
          (不入 git)或 -e 注入。留空 = 节点回落 server token,节点失陷即集群失陷。
    - name: etcd-s3 快照凭据完备性(rke2;空值会静默关闭快照异地上传)
      assert:
        that:
          - etcd_snapshot_bucket | length > 0
          - etcd_s3_region | length > 0
          - etcd_s3_endpoint | length > 0
          - etcd_s3_access_key | length > 0
          - etcd_s3_secret_key | length > 0
        fail_msg: >-
          etcd_s3_* 五元组未配齐:模板含 etcd-s3: true,空值会被静默渲染进配置,
          快照异地上传从未真正工作且无任何告警。经 group_vars/servers.yml 注入。
      when: cluster_distro == 'rke2'

    - name: rancher 配置目录
      file:
        path: "/etc/rancher/{{ cluster_distro }}"
        state: directory
        mode: "0755"

    - name: 分发 apiserver 审计策略(缺失则 apiserver 起不来)
      copy:
        src: ../cluster/rke2/audit-policy.yaml   # rke2/k3s 共用同一策略文件
        dest: "/etc/rancher/{{ cluster_distro }}/audit-policy.yaml"
        mode: "0644"

    # server 节点的 registries.yaml(Spegel P2P;Harbor 代理缓存 / CA 段按需打开,与平台配置·
    # 镜像仓库一致)。GPU 节点由 node-join.sh 自动生成,不经 ansible;不含凭据,拉取凭据经
    # imagePullSecrets 托管
    - name: 分发 registries.yaml
      copy:
        src: ../cluster/rke2/registries.yaml
        dest: "/etc/rancher/{{ cluster_distro }}/registries.yaml"
        mode: "0600"
      notify: restart-server

    - name: Harbor 自签/私有 CA(harbor_ca_pem 非空才落盘)
      copy:
        content: "{{ harbor_ca_pem }}"
        dest: "/etc/rancher/{{ cluster_distro }}/harbor-ca.crt"
        mode: "0644"
      when: harbor_ca_pem | length > 0
      notify: restart-server

    # rke2:模板含 etcd-s3/agent-token 占位;渲染 + 无残留校验,一次落盘。
    - name: 渲染 rke2 server config
      set_fact:
        server_config: >-
          {{ lookup('file', '../cluster/rke2/server-config.yaml')
             | replace('CHANGE_ME_ETCD_SNAPSHOT_BUCKET', etcd_snapshot_bucket)
             | replace('CHANGE_ME_ETCD_S3_REGION', etcd_s3_region)
             | replace('CHANGE_ME_ETCD_S3_ENDPOINT', etcd_s3_endpoint)
             | replace('CHANGE_ME_ETCD_S3_ACCESS_KEY', etcd_s3_access_key)
             | replace('CHANGE_ME_ETCD_S3_SECRET_KEY', etcd_s3_secret_key)
             | replace('#agent-token: "CHANGE_ME_AGENT_TOKEN"', 'agent-token: "' + agent_token + '"') }}
      when: cluster_distro == 'rke2'

    # k3s:模板只有 agent-token 一处占位
    - name: 渲染 k3s server config
      set_fact:
        server_config: >-
          {{ lookup('file', '../cluster/k3s/server-config.yaml')
             | replace('#agent-token: "CHANGE_ME_AGENT_TOKEN"', 'agent-token: "' + agent_token + '"') }}
      when: cluster_distro == 'k3s'

    - name: HA 参数完备性(api_vip 与 server_ips 必须同定义,且奇数台 ≥3)
      assert:
        that:
          - api_vip | length > 0
          - server_ips | length >= 3
          - (server_ips | length) % 2 == 1
        fail_msg: >-
          控制面 HA 需要 api_vip + 奇数台(≥3)server_ips(堆叠 etcd 法定人数);
          单 server 集群请把 api_vip 留空(tls-san 维持注释)
      when: cluster_distro == 'rke2' and (api_vip | length > 0 or server_ips | length > 0)

    # HA(rke2 且定义 api_vip):tls-san 实块追加到配置末尾(模板内只是注释示例),
    # 渲染一次成型,首台与后续 server 拿到逐字节一致的产物
    - name: HA 集群渲染 tls-san(api_vip + 全部 server 地址入 apiserver 证书)
      set_fact:
        server_config: >-
          {{ server_config }}
          tls-san:
            - "{{ api_vip }}"
          {% for ip in server_ips %}
            - "{{ ip }}"
          {% endfor %}
          {% for hn in server_hostnames %}
            - "{{ hn }}"
          {% endfor %}
      when: cluster_distro == 'rke2' and api_vip | length > 0

    - name: server config 无占位符残留
      assert:
        that: server_config is not search('CHANGE_ME')
        fail_msg: >-
          server config 仍有 CHANGE_ME 占位:请在 group_vars/servers.yml 提供
          etcd_snapshot_bucket / etcd_s3_region / etcd_s3_endpoint / etcd_s3_access_key /
          etcd_s3_secret_key(rke2)与 agent_token,见 deploy/ansible/README.md

    - name: 落 server config(0600:含 etcd-s3 凭据与 agent token)
      copy:
        dest: "/etc/rancher/{{ cluster_distro }}/config.yaml"
        content: "{{ server_config }}"
        mode: "0600"
      notify: restart-server

    - name: 已安装探测(幂等短路:已装则跳过下载/校验/安装)
      stat:
        path: "{{ '/etc/systemd/system/rke2-server.service' if cluster_distro == 'rke2' else '/etc/systemd/system/k3s.service' }}"
      register: server_installed

    - name: 下载 rke2 安装器
      get_url:
        url: https://rancher-mirror.rancher.cn/rke2/install.sh
        dest: /tmp/rke2-install.sh
        mode: "0700"
      register: rke2_installer_dl
      when: cluster_distro == 'rke2' and not server_installed.stat.exists

    - name: 校验 rke2 安装器 sha256
      command: sha256sum -c -
      args:
        stdin: "{{ rke2_installer_sha256 }}  /tmp/rke2-install.sh"
      when: cluster_distro == 'rke2' and rke2_installer_dl.changed

    - name: 安装 rke2 server(幂等:已装跳过)
      shell: >
        INSTALL_RKE2_MIRROR=cn INSTALL_RKE2_CHANNEL={{ rke2_channel }} sh /tmp/rke2-install.sh
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/rke2-server.service
      when: cluster_distro == 'rke2'

    - name: 下载 k3s 安装器
      get_url:
        url: https://rancher-mirror.rancher.cn/k3s/k3s-install.sh
        dest: /tmp/k3s-install.sh
        mode: "0700"
      register: k3s_installer_dl
      when: cluster_distro == 'k3s' and not server_installed.stat.exists

    - name: 校验 k3s 安装器 sha256
      command: sha256sum -c -
      args:
        stdin: "{{ k3s_installer_sha256 }}  /tmp/k3s-install.sh"
      when: cluster_distro == 'k3s' and k3s_installer_dl.changed

    - name: 安装 k3s server(幂等:已装跳过)
      shell: >
        INSTALL_K3S_MIRROR=cn sh /tmp/k3s-install.sh -s - server
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/k3s.service
      when: cluster_distro == 'k3s'

    - name: server 服务开机自启并运行
      systemd:
        name: "{{ 'rke2-server' if cluster_distro == 'rke2' else 'k3s' }}.service"
        enabled: true
        state: started

  handlers:
    - name: restart-server
      systemd:
        name: "{{ 'rke2-server' if cluster_distro == 'rke2' else 'k3s' }}.service"
        state: restarted
