
- hosts: servers
  become: true
  vars:
    cluster_distro: rke2
    rke2_channel: latest
    # Installer origin: official = get.rke2.io / get.k3s.io (default); cn = rancher-mirror.rancher.cn.
    # The sha256 pins below must equal PIN_*_OFFICIAL / PIN_*_CN in
    # apps/api/app/modules/nodes/assets/node-join.sh (a bats test cross-checks them).
    k8s_install_mirror: official
    rke2_installer_sha256_official: "42983c86d1da64a92061d83afb57630cedd69241989f1b0673f3db6c3d92ee6b"
    rke2_installer_sha256_cn: "5541410b86d4d19d927d820be85156e787be3fdb24be72507af52932a1d12de1"
    k3s_installer_sha256_official: "ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b"
    k3s_installer_sha256_cn: "3944aa467eb945b5ff2151a8e4f8d4a5f3a210d31ab39aec81f37606936d0863"
    rke2_installer_url: "{{ 'https://get.rke2.io' if k8s_install_mirror == 'official' else 'https://rancher-mirror.rancher.cn/rke2/install.sh' }}"
    k3s_installer_url: "{{ 'https://get.k3s.io' if k8s_install_mirror == 'official' else 'https://rancher-mirror.rancher.cn/k3s/k3s-install.sh' }}"
    rke2_installer_sha256: "{{ rke2_installer_sha256_official if k8s_install_mirror == 'official' else rke2_installer_sha256_cn }}"
    k3s_installer_sha256: "{{ k3s_installer_sha256_official if k8s_install_mirror == 'official' else k3s_installer_sha256_cn }}"
    rke2_installer_mirror_env: "{{ '' if k8s_install_mirror == 'official' else 'INSTALL_RKE2_MIRROR=cn' }}"
    k3s_installer_mirror_env: "{{ '' if k8s_install_mirror == 'official' else 'INSTALL_K3S_MIRROR=cn' }}"
    etcd_snapshot_bucket: ""
    etcd_s3_region: ""
    etcd_s3_endpoint: ""
    etcd_s3_access_key: ""
    etcd_s3_secret_key: ""
    agent_token: ""
    api_vip: ""
    server_ips: []
    server_hostnames: []
    harbor_ca_pem: ""
    kubectl_bin: "{{ '/var/lib/rancher/rke2/bin/kubectl' if cluster_distro == 'rke2' else '/usr/local/bin/kubectl' }}"
    kubeconfig_path: "/etc/rancher/{{ cluster_distro }}/{{ 'rke2.yaml' if cluster_distro == 'rke2' else 'k3s.yaml' }}"
  tasks:
    - name: Installer source must be official or cn
      assert:
        that:
          - k8s_install_mirror in ['official', 'cn']
        fail_msg: "k8s_install_mirror must be 'official' (get.rke2.io / get.k3s.io) or 'cn' (rancher-mirror.rancher.cn), got '{{ k8s_install_mirror }}'"
    - name: 输入变量完备性(渲染前断言,而非断言渲染产物)
      assert:
        that:
          - agent_token | length >= 32
          - agent_token is not search('CHANGE_ME')
        fail_msg: >-
          agent_token 未提供或过短:用 openssl rand -hex 32 生成,经 group_vars/servers.yml
          (不入 git)或 -e 注入。留空 = 节点回落 server token,节点失陷即集群失陷。
    - name: etcd-s3 快照凭据完备性(rke2;空值会静默关闭快照异地上传)
      assert:
        that:
          - etcd_snapshot_bucket | length > 0
          - etcd_s3_region | length > 0
          - etcd_s3_endpoint | length > 0
          - etcd_s3_access_key | length > 0
          - etcd_s3_secret_key | length > 0
        fail_msg: >-
          etcd_s3_* 五元组未配齐:模板含 etcd-s3: true,空值会被静默渲染进配置,
          快照异地上传从未真正工作且无任何告警。经 group_vars/servers.yml 注入。
      when: cluster_distro == 'rke2'

    - name: rancher 配置目录
      file:
        path: "/etc/rancher/{{ cluster_distro }}"
        state: directory
        mode: "0755"

    - name: kubelet 配置 drop-in 目录(发行版首次启动前建好也无妨,00-*.conf 由它自管)
      file:
        path: "/var/lib/rancher/{{ cluster_distro }}/agent/etc/kubelet.conf.d"
        state: directory
        mode: "0755"

    - name: 分发 kubelet 配置 drop-in(单 Pod PID 上限)
      copy:
        src: ../cluster/rke2/kubelet-superdl.conf
        dest: "/var/lib/rancher/{{ cluster_distro }}/agent/etc/kubelet.conf.d/50-superdl.conf"
        mode: "0644"
      notify: restart-server

    - name: 分发 apiserver 审计策略(缺失则 apiserver 起不来)
      copy:
        src: ../cluster/rke2/audit-policy.yaml
        dest: "/etc/rancher/{{ cluster_distro }}/audit-policy.yaml"
        mode: "0644"

    - name: 分发 registries.yaml
      copy:
        src: ../cluster/rke2/registries.yaml
        dest: "/etc/rancher/{{ cluster_distro }}/registries.yaml"
        mode: "0600"
      notify: restart-server

    - name: Harbor 自签/私有 CA(harbor_ca_pem 非空才落盘)
      copy:
        content: "{{ harbor_ca_pem }}"
        dest: "/etc/rancher/{{ cluster_distro }}/harbor-ca.crt"
        mode: "0644"
      when: harbor_ca_pem | length > 0
      notify: restart-server

    - name: 渲染 rke2 server config
      no_log: true
      set_fact:
        server_config: >-
          {{ lookup('file', '../cluster/rke2/server-config.yaml')
             | replace('"CHANGE_ME_ETCD_SNAPSHOT_BUCKET"', etcd_snapshot_bucket | to_json)
             | replace('"CHANGE_ME_ETCD_S3_REGION"', etcd_s3_region | to_json)
             | replace('"CHANGE_ME_ETCD_S3_ENDPOINT"', etcd_s3_endpoint | to_json)
             | replace('"CHANGE_ME_ETCD_S3_ACCESS_KEY"', etcd_s3_access_key | to_json)
             | replace('"CHANGE_ME_ETCD_S3_SECRET_KEY"', etcd_s3_secret_key | to_json)
             | replace('"CHANGE_ME_AGENT_TOKEN"', agent_token | to_json) }}
      when: cluster_distro == 'rke2'

    - name: 渲染 k3s server config
      no_log: true
      set_fact:
        server_config: >-
          {{ lookup('file', '../cluster/k3s/server-config.yaml')
             | replace('"CHANGE_ME_AGENT_TOKEN"', agent_token | to_json) }}
      when: cluster_distro == 'k3s'

    - name: HA 参数完备性(api_vip 与 server_ips 必须同定义,且奇数台 ≥3)
      assert:
        that:
          - api_vip | length > 0
          - server_ips | length >= 3
          - (server_ips | length) % 2 == 1
        fail_msg: >-
          控制面 HA 需要 api_vip + 奇数台(≥3)server_ips(堆叠 etcd 法定人数);
          单 server 集群请把 api_vip 留空(tls-san 维持注释)
      when: cluster_distro == 'rke2' and (api_vip | length > 0 or server_ips | length > 0)

    - name: HA 集群渲染 tls-san(api_vip + 全部 server 地址入 apiserver 证书)
      no_log: true
      set_fact:
        server_config: >-
          {{ server_config }}
          tls-san:
            - "{{ api_vip }}"
          {% for ip in server_ips %}
            - "{{ ip }}"
          {% endfor %}
          {% for hn in server_hostnames %}
            - "{{ hn }}"
          {% endfor %}
      when: cluster_distro == 'rke2' and api_vip | length > 0

    - name: server config 无占位符残留
      assert:
        that: server_config is not search('CHANGE_ME')
        fail_msg: >-
          server config 仍有 CHANGE_ME 占位:请在 group_vars/servers.yml 提供
          etcd_snapshot_bucket / etcd_s3_region / etcd_s3_endpoint / etcd_s3_access_key /
          etcd_s3_secret_key(rke2)与 agent_token,见 deploy/ansible/README.md

    - name: 落 server config(0600:含 etcd-s3 凭据与 agent token)
      no_log: true
      copy:
        dest: "/etc/rancher/{{ cluster_distro }}/config.yaml"
        content: "{{ server_config }}"
        mode: "0600"
      notify: restart-server

    - name: 已安装探测(幂等短路:已装则跳过下载/校验/安装)
      stat:
        path: "{{ '/etc/systemd/system/rke2-server.service' if cluster_distro == 'rke2' else '/etc/systemd/system/k3s.service' }}"
      register: server_installed

    - name: 安装器缓存目录(root 私有,不用 /tmp)
      file:
        path: /root/.cache/superdl
        state: directory
        mode: "0700"
        owner: root
        group: root
      when: not server_installed.stat.exists

    - name: 下载 rke2 安装器(get_url 按 sha256 校验后才落盘;force 覆盖旧文件)
      get_url:
        url: "{{ rke2_installer_url }}"
        dest: /root/.cache/superdl/rke2-install.sh
        checksum: "sha256:{{ rke2_installer_sha256 }}"
        force: true
        mode: "0700"
        owner: root
        group: root
      when: cluster_distro == 'rke2' and not server_installed.stat.exists

    - name: 安装 rke2 server(幂等:已装跳过)
      shell: >
        {{ rke2_installer_mirror_env }} INSTALL_RKE2_CHANNEL={{ rke2_channel }} sh /root/.cache/superdl/rke2-install.sh
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/rke2-server.service
      when: cluster_distro == 'rke2'

    - name: 下载 k3s 安装器(get_url 按 sha256 校验后才落盘;force 覆盖旧文件)
      get_url:
        url: "{{ k3s_installer_url }}"
        dest: /root/.cache/superdl/k3s-install.sh
        checksum: "sha256:{{ k3s_installer_sha256 }}"
        force: true
        mode: "0700"
        owner: root
        group: root
      when: cluster_distro == 'k3s' and not server_installed.stat.exists

    - name: 安装 k3s server(幂等:已装跳过)
      shell: >
        {{ k3s_installer_mirror_env }} sh /root/.cache/superdl/k3s-install.sh -s - server
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/k3s.service
      when: cluster_distro == 'k3s'

    - name: server 服务开机自启并运行
      systemd:
        name: "{{ 'rke2-server' if cluster_distro == 'rke2' else 'k3s' }}.service"
        enabled: true
        state: started

    - name: 等待 kube-apiserver 就绪(打标签的前提)
      command: "{{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }} get --raw=/readyz"
      register: apiserver_ready
      retries: 30
      delay: 10
      until: apiserver_ready.rc == 0
      changed_when: false

    - name: 控制面节点打平台组件落点标签(--overwrite:幂等,可反复跑)
      command: >-
        {{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}
        label nodes -l node-role.kubernetes.io/control-plane
        node-restriction.kubernetes.io/superdl-infra=true
        --overwrite
      register: infra_label
      changed_when: "'labeled' in infra_label.stdout"

    - name: k3s 状态备份依赖(sqlite3 在线一致副本、gpg、rsync)
      apt:
        name: [sqlite3, gnupg, rsync]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: cluster_distro == 'k3s'

    - name: k3s 状态备份脚本(cred / tls / token / datastore 加密到 PG 镜像机 k3s/)
      copy:
        src: ../cluster/k3s/state-backup.sh
        dest: /usr/local/sbin/superdl-k3s-state-backup
        mode: "0700"
        owner: root
        group: root
      when: cluster_distro == 'k3s'

    - name: k3s 状态备份 cron(每 6 小时;镜像机与口令沿用 /etc/superdl/pg/backup.env、backup-passphrase、backup-ssh-key)
      copy:
        dest: /etc/cron.d/superdl-k3s-state-backup
        mode: "0644"
        content: |
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          23 */6 * * * root /usr/local/sbin/superdl-k3s-state-backup
      when: cluster_distro == 'k3s'

  handlers:
    - name: restart-server
      systemd:
        name: "{{ 'rke2-server' if cluster_distro == 'rke2' else 'k3s' }}.service"
        state: restarted
