version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      js:
        patterns: ["*"]
      js-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directories: ["/apps/api", "/deploy/app"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
