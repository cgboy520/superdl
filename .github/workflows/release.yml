name: Release

# 构建三镜像 → Trivy 扫描(HIGH/CRITICAL 阻断)→ 推 ghcr。
# 部署侧按 tag 更新 deploy/app/k8s 镜像并跑迁移 Job。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=web
          - name: admin
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/superdl-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: scan-target:latest
      - name: Trivy scan (HIGH/CRITICAL 阻断)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
