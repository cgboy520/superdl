name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=web
          - name: admin
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: release-target:latest
      - name: Trivy (fixable HIGH/CRITICAL blocks)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: release-target:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX, kept with the release)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: release-target:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.cdx.json
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || 'superdl' }}/superdl-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}
      - name: Tag and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            docker tag release-target:latest "$t"
            docker push "$t"
          done <<< "$TAGS"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: cosign sign (by digest, recorded in Rekor)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          declare -A seen=()
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            ref=$(docker inspect "$t" --format '{{index .RepoDigests 0}}')
            if [ -z "$ref" ]; then
              echo "::error::$t has no RepoDigest after the push, refusing to sign"
              exit 1
            fi
            if [ -z "${seen[$ref]:-}" ]; then
              seen[$ref]=1
              cosign sign --yes "$ref"
            fi
          done <<< "$TAGS"
