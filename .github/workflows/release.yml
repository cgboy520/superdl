name: Release

# 一次构建 → 本地 Trivy 扫描(HIGH/CRITICAL 阻断)→ 同一产物推送 Harbor(平台项目,默认 superdl)。
# 扫描与发布共用同一个 image tar(经 artifact 传递 + image ID 校验),杜绝「扫 A 发 B」。
# 权限拆分:build-scan 不登录 registry;仅 promote 持 Harbor 推送机器人凭据并登录。
# 仓库 secrets:HARBOR_HOST / HARBOR_ROBOT_NAME(robot$<项目>+push,Push + Pull)/ HARBOR_ROBOT_SECRET;
# variables:HARBOR_PROJECT(缺省 superdl)。部署侧 scripts/release.sh 以同一前缀替换清单占位并跑迁移 Job。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 发布闸门:tag 构建前重跑 CI 的全部闸门 job,任一红则整个 release 中止。
  # 跨 workflow 不能直接 needs 对方 job,故经 workflow_call 复用 ci.yml(其 on: 已加
  # workflow_call);发布闸门与 PR 闸门同源,不维护第二份定义。
  ci-gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-scan:
    needs: ci-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read # 本 job 不推镜像,不持有任何 registry 凭据
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=web
          - name: admin
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        name: Build(唯一一次构建,产出即发布产物)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: scan-target:latest
      - name: Trivy scan(HIGH/CRITICAL 阻断,扫描对象即待发布镜像)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          # 阻断闸只盯「可修复」:上游未修复的 CVE 没有可升级版本,把它算进阻断闸
          # 等于让发布被上游节奏绑架(可用性风险);未修复项由下方全量报告归档盯评审
          ignore-unfixed: true
      - name: Trivy 全量报告(含未修复;归档供安全评审,不阻断)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-full.json
          exit-code: "0"  # 归档不阻断:阻断闸是上一条(ignore-unfixed)
      - name: Upload full vuln report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-full-${{ matrix.name }}
          path: trivy-full.json
      - name: SBOM(CycloneDX,随构建产物留档)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: scan-target:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0" # 只产出 SBOM,漏洞阻断由上一个 scan step 把关
      - name: 记录镜像 ID 并打包
        run: |
          docker image inspect scan-target:latest --format '{{.Id}}' > image-id.txt
          docker save scan-target:latest | gzip > image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.name }}
          path: |
            image.tar.gz
            image-id.txt
          compression-level: 0 # tar 已 gzip,关闭二次压缩
          retention-days: 1 # 仅供 promote job 接力
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.cdx.json

  promote:
    needs: build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # 推送凭据是 Harbor 机器人(仓库 secrets),唯一使用它的 job
      id-token: write # cosign keyless 的 OIDC 身份(签名进 Rekor 公共账本);仅此 job 持有
    strategy:
      matrix:
        include:
          - name: api
          - name: web
          - name: admin
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.name }}
      - name: 载入并校验「扫描产物 == 发布产物」
        run: |
          gunzip -c image.tar.gz | docker load
          want=$(cat image-id.txt)
          got=$(docker image inspect scan-target:latest --format '{{.Id}}')
          if [ "$want" != "$got" ]; then
            echo "::error::镜像 ID 不一致($want != $got),拒绝发布"
            exit 1
          fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || 'superdl' }}/superdl-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}
      - name: 打 tag 并推送(内容与扫描产物同源,digest 一致)
        run: |
          tags='${{ steps.meta.outputs.tags }}'
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            docker tag scan-target:latest "$t"
            docker push "$t"
          done <<< "$tags"
      - name: 安装 cosign(keyless 签名)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign 签名(按 digest 引用,签进 Rekor 公共账本)
        # 签名对象是 digest 而非可变 tag:tag 可被覆盖,签名跟着 digest 走才锁得住内容。
        # 验签/准入侧(sigstore policy-controller 或 kyverno)按 digest 验。
        run: |
          tags='${{ steps.meta.outputs.tags }}'
          declare -A seen=()
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            ref=$(docker inspect "$t" --format '{{index .RepoDigests 0}}')
            if [ -z "$ref" ]; then
              echo "::error::$t 推送后无 RepoDigest,拒绝签名"
              exit 1
            fi
            if [ -z "${seen[$ref]:-}" ]; then
              seen[$ref]=1
              cosign sign --yes "$ref"
            fi
          done <<< "$tags"
