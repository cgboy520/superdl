name: Release

# 构建 → Trivy 扫描(可修复的 HIGH/CRITICAL 阻断)→ 推 Harbor 并 cosign 签名。
# 仓库 secrets:HARBOR_HOST / HARBOR_ROBOT_NAME / HARBOR_ROBOT_SECRET;variables:HARBOR_PROJECT(缺省 superdl)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 发布闸门:tag 构建前重跑 CI 全部 job(workflow_call 复用 ci.yml)
  ci-gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 人工审批闸:GitHub 仓库设置 → Environments → production 配 required reviewers,HARBOR_* secrets 放该 environment 下
    environment: production
    permissions:
      contents: read
      id-token: write # cosign keyless 的 OIDC 身份(签名进 Rekor 公共账本)
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=web
          - name: admin
            context: .
            dockerfile: deploy/app/frontend.Dockerfile
            build_args: APP=admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: release-target:latest
      - name: Trivy(可修复的 HIGH/CRITICAL 阻断)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: release-target:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM(CycloneDX,随发布留档)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: release-target:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.cdx.json
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || 'superdl' }}/superdl-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}
      # tag 串经 env 传入,不直接把 ${{ }} 展开进 shell
      - name: 打 tag 并推送
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            docker tag release-target:latest "$t"
            docker push "$t"
          done <<< "$TAGS"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # 签 digest(scripts/release.sh 也按 digest 渲染清单);集群侧验签准入未部署
      - name: cosign 签名(按 digest,签进 Rekor)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          declare -A seen=()
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            ref=$(docker inspect "$t" --format '{{index .RepoDigests 0}}')
            if [ -z "$ref" ]; then
              echo "::error::$t 推送后无 RepoDigest,拒绝签名"
              exit 1
            fi
            if [ -z "${seen[$ref]:-}" ]; then
              seen[$ref]=1
              cosign sign --yes "$ref"
            fi
          done <<< "$TAGS"
