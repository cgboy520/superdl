name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml 以 workflow_call 复用本流水线作发布闸门:
  # tag 构建前 api/frontend/security 必须重跑全绿
  workflow_call:

# environment 是 fail-closed 必填项(app/core/config.py),CI 的干净检出没有 apps/api/.env,
# 凡构造 Settings() 的步骤(alembic / openapi 导出 / RealOrchestrator 冒烟)都要它。
# 放 workflow 级而非逐 step,新增 job 不会再漏配。
# 必须是非 prod:/api/v1/webhooks/mock 只在非 prod 注册(billing/webhooks_router.py),
# 而该路径已在 packages/api-client/openapi.json 里,设成 prod 会让「契约无 diff」闸门红。
env:
  SUPERDL_ENVIRONMENT: dev

# 顶层只读基线:缺省 GITHUB_TOKEN 拿到的是过大权限,CI 任务全是读操作;
# 需要写权限的 job 在自己名下单独声明(最小权限,一行都不多给)
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # pytest 全量挂死时由 job 级超时兜底(不引入 pytest-timeout 依赖)
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      # not real_k8s:真实集群用例由 k8s-real-smoke job 跑;此处再跑会让 conformance 的
      # fake 侧(恒跑参数)与 kind job 重复,real 侧则只能靠 skipif 空转收集
      - run: uv run pytest -m "not real_k8s"
      # schema diff 双保险之一:单测基建走 create_all(tests/conftest.py),它与迁移链的一致性
      # 由此步把关——upgrade head 后 alembic check 以 Base.metadata 为基准做 autogenerate diff,
      # 模型 ≠ 迁移即非零退出。「带数据升级不丢数」由下方 alembic-populated-upgrade job 覆盖。
      - name: alembic check (migrations match models)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
          uv run alembic upgrade head
          uv run alembic check
        env:
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
      - name: openapi.json is up to date
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code ../../packages/api-client/openapi.json

  # populated-DB upgrade:空库 upgrade head 只验证「能建起来」,不验证
  # 「老库带数据升上来不丢数」。这里现造基线:upgrade 到上一 head 前停 → 灌种子行
  # (outbox_tasks 自首个迁移即存在,充任关键表探针)→ 再 upgrade head → 断言数据仍在。
  alembic-populated-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: populated-DB upgrade(上一 head 停 → 种子行 → upgrade head → 数据仍在)
        env:
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
          prev=$(uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; s = ScriptDirectory.from_config(Config('alembic.ini')); dr = s.get_revision(s.get_current_head()).down_revision; assert isinstance(dr, str), f'expect single down_revision, got {dr!r}'; print(dr)")
          echo "baseline = 上一 head: $prev"
          uv run alembic upgrade "$prev"
          docker exec pg psql -U superdl -d superdl -v ON_ERROR_STOP=1 \
            -c "INSERT INTO outbox_tasks (type, payload, status, retries) VALUES ('ci.populated-probe', '{}', 'done', 0)"
          uv run alembic upgrade head
          count=$(docker exec pg psql -U superdl -d superdl -tA -c "SELECT count(*) FROM outbox_tasks WHERE type='ci.populated-probe'")
          if [ "$count" != "1" ]; then
            echo "::error::populated-DB upgrade 后种子行丢失(count=$count)"
            exit 1
          fi
          echo "种子行在 upgrade head 后仍在(count=$count)"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n
      - run: pnpm test
      # CSP 内联脚本 hash 闸门:index.html 防 FOUC 脚本改动必须同步 CSP 的 sha256
      - run: pnpm csp-check
      # orval 生成物必须与入库的 openapi.json 一致(契约漂移即 fail)。
      # openapi.json 本身的新鲜度由 api job 的导出 diff 把关,两个 job 相互印证。
      - run: pnpm api-client
      - name: orval 生成物无 diff
        run: git diff --exit-code packages/api-client
      - run: pnpm build

  node-join-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck + bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats
      - run: bash -n apps/api/app/modules/nodes/assets/node-join.sh
      - run: shellcheck apps/api/app/modules/nodes/assets/node-join.sh
      - run: bats deploy/node-join/tests

  # 文档引用闸门:Markdown 相对链接与反引号仓库路径必须存在(stdlib 零依赖,秒级)。
  # 它红了说明有文档引用了已改名/删除的文件;文档与代码同提交是提交约定(CLAUDE.md #16)。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-docs-links.py

  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks 全历史扫描与迁移 diff 基线都需要完整历史
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pip-audit(API 生产依赖漏洞)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --format requirements-txt -o /tmp/reqs.txt
          code=0
          uvx pip-audit -r /tmp/reqs.txt --progress-spinner off || code=$?
          # pip-audit 约定:0=无漏洞,1=发现漏洞;其余非零=工具自身失败(网络/OSV 不可达等)
          # 工具失败即红——允许一次重试,重试仍失败则闸门红(不得静默放行)
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::warning::pip-audit 首次执行失败(code=$code),重试一次"
            code=0
            uvx pip-audit -r /tmp/reqs.txt --progress-spinner off || code=$?
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::pip-audit 发现生产依赖漏洞"
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::pip-audit 工具执行失败(重试后仍失败,code=$code),闸门红处理"
            exit 1
          fi
      - name: pnpm audit(前端生产依赖,HIGH+ 阻断)
        run: |
          code=0
          pnpm audit --prod --audit-level=high --json > /tmp/pnpm-audit.json || code=$?
          # 区分「真发现」与「工具失败」:registry 不可达时 pnpm 也非零退出,但产不出合法 JSON;
          # 工具失败即红——允许一次重试,重试仍失败则闸门红(不得静默放行)
          if [ "$code" -ne 0 ] && ! jq -e '.metadata' /tmp/pnpm-audit.json > /dev/null 2>&1; then
            echo "::warning::pnpm audit 首次执行失败(code=$code,产物非合法 JSON),重试一次"
            code=0
            pnpm audit --prod --audit-level=high --json > /tmp/pnpm-audit.json || code=$?
          fi
          if [ "$code" -ne 0 ]; then
            if jq -e '.metadata.vulnerabilities | (.high + .critical) > 0' /tmp/pnpm-audit.json > /dev/null 2>&1; then
              jq -r '.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | "::error::\(.value.module_name) (\(.value.severity)): \(.value.title)"' /tmp/pnpm-audit.json
              echo "::error::pnpm audit 发现 HIGH/CRITICAL 生产依赖漏洞"
              exit 1
            fi
            echo "::error::pnpm audit 工具执行失败(重试后仍失败,code=$code),闸门红处理"
            exit 1
          fi
      - name: gitleaks(secret 泄漏扫描,全历史)
        run: |
          # 仓库历史短,直接全量扫;历史变重后改 --log-opts 限定 PR diff。
          # 镜像按 digest 钉死;拉取失败(网络)重试一次,再失败闸门红(不得静默跳过)。
          img="zricethezav/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a"
          if ! docker pull -q "$img" > /dev/null; then
            echo "::warning::gitleaks 镜像首次拉取失败,重试一次"
            if ! docker pull -q "$img" > /dev/null; then
              echo "::error::gitleaks 镜像拉取失败(重试后仍失败),闸门红处理"
              exit 1
            fi
          fi
          # 容器内 root 与挂载目录属主不同,需先声明 safe.directory 才能跑 git 扫描;
          # 已复核误报的行级放行(path + 行内容 AND)见 .github/gitleaks.toml
          docker run --rm -v "$PWD:/repo" --entrypoint sh "$img" \
            -c "git config --global --add safe.directory /repo && gitleaks git /repo --config /repo/.github/gitleaks.toml --verbose"
      - name: 迁移危险 DDL 检查(alembic)
        run: |
          # 只查本次变更新增/修改的迁移;downgrade 里的 drop 是正常回滚,脚本只看 upgrade()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            # release.yml 经 workflow_call 复用本闸门(tag 发布):github.event.before 在
            # tag 场景不存在,基线改取上一 tag;首个 tag(无基线)时全量检查存量迁移
            BASE=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::无对比基线(首个 push / 首个 tag):全量检查存量迁移"
            git ls-files 'apps/api/alembic/versions/*.py' > /tmp/migrations.txt
          else
            git diff --name-only --diff-filter=AM "$BASE"...HEAD -- apps/api/alembic/versions/ > /tmp/migrations.txt
          fi
          if ! grep -q '\.py$' /tmp/migrations.txt; then
            echo "无迁移变更"
            exit 0
          fi
          mapfile -t files < <(grep '\.py$' /tmp/migrations.txt)
          python3 scripts/check-migration-ddl.py "${files[@]}"

  k8s-real-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # kind 起一次性集群;kind-action 不导出 KUBECONFIG 环境变量,kind 默认写 ~/.kube/config,
      # 下方解析 SUPERDL_TEST_KUBECONFIG 时的 fallback 即指向它
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      # 租户 Jupyter 入口是 HTTPRoute:kind 裸集群没有 Gateway API CRD,不装则 create_instance
      # 直接 404。复用发布脚本装,顺带在 CI 里验证它可执行;只装 CRD 不装 Envoy Gateway 控制器,
      # 本冒烟断言的是「apiserver 接受我们拼的对象规约」,不需要真有数据面接管路由。
      - name: 装 Gateway API CRD
        run: bash deploy/cluster/gateway-api-crds.sh
      # RBAC 与代码对齐闸(H2):kind 默认给的是 cluster-admin kubeconfig,直接冒烟永远
      # 发现不了 01-rbac.yaml 缺动词。这里先 apply 生产 RBAC,再静态断言动词面,最后
      # 用 superdl-tenant-mgr 的 SA token 造受限 kubeconfig 供冒烟里的受限身份用例
      # (test_ensure_namespace_under_tenant_mgr_sa)使用。
      - name: 应用生产 RBAC 并静态断言 tenant-mgr 动词面
        run: |
          kubectl create namespace superdl
          kubectl apply -f deploy/app/k8s/01-rbac.yaml
          SA=system:serviceaccount:superdl:superdl-tenant-mgr
          # ensure_namespace 的 _create_or_patch 收敛路径需要的最小动词面(与 real.py 一一对应)
          for pair in "patch namespaces" "patch networkpolicies" "patch resourcequotas" \
                      "get limitranges" "create limitranges" "patch limitranges" \
                      "patch services" "create roles" "patch rolebindings" \
                      "escalate roles" "bind roles"; do
            if ! kubectl auth can-i --as="$SA" $pair >/dev/null; then
              echo "::error::superdl-tenant-mgr 缺动词:$pair(01-rbac.yaml 与 real.py 漂移)"
              exit 1
            fi
          done
          # 反向面:刻意不授的动词必须保持不授(最小权限回归闸)
          # escalate/bind 只开到命名空间级 roles:clusterroles 一旦可 escalate/bind 就是集群级提权
          for pair in "delete namespaces" "patch nodes" "list secrets" \
                      "escalate clusterroles" "bind clusterroles"; do
            if kubectl auth can-i --as="$SA" $pair >/dev/null; then
              echo "::error::superdl-tenant-mgr 越权动词被放行了:$pair"
              exit 1
            fi
          done
      - name: 生成 superdl-tenant-mgr 受限 kubeconfig
        run: |
          TOKEN=$(kubectl create token superdl-tenant-mgr -n superdl --duration=1h)
          admin_kubeconfig="${KUBECONFIG:-$HOME/.kube/config}"
          cp "$admin_kubeconfig" /tmp/restricted.kubeconfig
          kubectl config set-credentials tenant-mgr --token="$TOKEN" --kubeconfig=/tmp/restricted.kubeconfig
          kubectl config set-context --current --user=tenant-mgr --kubeconfig=/tmp/restricted.kubeconfig
          # 管理面 kubeconfig 的路径在这里由 shell 展开后传下去:workflow 的 env: 不展开 $HOME,
          # 写成字面量会让用例拿到一个不存在的路径
          echo "SUPERDL_TEST_KUBECONFIG=$admin_kubeconfig" >> "$GITHUB_ENV"
      - name: RealOrchestrator 冒烟(kind)
        working-directory: apps/api
        env:
          SUPERDL_TEST_KUBECONFIG_RESTRICTED: /tmp/restricted.kubeconfig
        run: |
          uv sync --frozen
          uv run pytest tests/test_k8s_real_smoke.py -v
          # 编排协议契约一致性套件的 Real 侧(同 SUPERDL_TEST_KUBECONFIG 门控):
          # kind 上 JuiceFS 作业永不完成,完成分支由套件 patch Job status 注入(见文件头注释)。
          # -m real_k8s:只跑 real 参数;fake 侧归 api job 的全量 pytest,此处不重复
          uv run pytest -m real_k8s tests/test_orchestrator_conformance.py -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
      - name: Migrate + seed + start API/worker
        working-directory: apps/api
        env:
          SUPERDL_ENVIRONMENT: dev
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
          # seed_dev.py 环境闸后默认随机口令;CI 一次性隔离库显式固定,与 e2e 默认对齐
          SUPERDL_SEED_ADMIN_PASSWORD: admin123-dev
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed_dev.py
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup uv run python -m app.workers.main > /tmp/worker.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Playwright smoke
        env:
          # 管理端冒烟(登录→MFA 现算→调账双人复核→冻结租户):
          # 本 job 有浏览器(下行装 chromium)故开门;无浏览器环境/本地不想跑时不设此变量即跳过
          SUPERDL_ADMIN_E2E: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superdl/e2e exec playwright install --with-deps chromium
          pnpm --filter @superdl/e2e test:e2e
      - name: Dump logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log
      # nohup 起的 API/worker 必须在本 job 的常规步骤里收掉:runner 的 orphan 清理发生在
      # post 步之后,而 setup-uv 的 post 步会跑 `uv cache prune`,与仍活着的 uv 进程抢缓存
      # 目录,prune 非零退出会把一次全绿的 e2e 判红。
      - name: Stop API/worker
        if: always()
        run: |
          pkill -f 'app[.]main:app' || true
          pkill -f 'app[.]workers[.]main' || true

  # k8s 清单 schema 校验(kubeconform):deploy/app/k8s 全部清单过 k8s OpenAPI schema。
  # (compose.yaml 是 docker-compose 格式,非 k8s 清单,不在 kubeconform 适用范围)
  k8s-manifest-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: kubeconform(deploy/app/k8s)
        run: |
          # 镜像按 digest 钉死
          img="ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e"
          # 同规:拉取失败重试一次,再失败闸门红
          if ! docker pull -q "$img" > /dev/null; then
            echo "::warning::kubeconform 镜像首次拉取失败,重试一次"
            if ! docker pull -q "$img" > /dev/null; then
              echo "::error::kubeconform 镜像拉取失败(重试后仍失败),闸门红处理"
              exit 1
            fi
          fi
          # -skip:CRD 类(cert-manager/prometheus-operator/Gateway API/Envoy Gateway)
          # 不在内置 schema;Kustomization 是 kustomize 配置而非 k8s 清单,同样无 schema;
          # -ignore-filename-pattern:10-migrate-job.yaml 的 name 含 CHANGE_TAG 占位
          # (非法 DNS 名,由 scripts/release.sh 渲染后 create),不做静态校验。
          # 被 skip 掉的 7 种网关对象改由下一步按真实 CRD 校验,不是不校验
          docker run --rm -v "$PWD:/work" "$img" \
            -skip Certificate,ClusterIssuer,ServiceMonitor,PodMonitor,Kustomization,GatewayClass,Gateway,HTTPRoute,EnvoyProxy,SecurityPolicy,BackendTrafficPolicy,ClientTrafficPolicy \
            -ignore-filename-pattern '10-migrate-job' \
            -summary /work/deploy/app/k8s
      # 网关清单按 helmfile 钉死那版 Envoy Gateway chart 里的真实 CRD 校验:04-gateway.yaml 是
      # 「写错不报错、策略静默失效」的重灾区,最坏的一种(SecurityPolicy 被 apiserver 单独拒收
      # → 管理端白名单没了)恰好只在 apply 时暴露。细节见脚本头注释
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: 网关清单 CRD schema 校验
        run: uv run --with pyyaml --with jsonschema python3 scripts/check-gateway-manifests.py
