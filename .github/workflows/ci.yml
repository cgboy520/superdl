name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  SUPERDL_ENVIRONMENT: dev

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      frontend: ${{ steps.f.outputs.frontend }}
      e2e: ${{ steps.f.outputs.e2e }}
      k8s: ${{ steps.f.outputs.k8s }}
      manifest: ${{ steps.f.outputs.manifest }}
      nodejoin: ${{ steps.f.outputs.nodejoin }}
      cluster: ${{ steps.f.outputs.cluster }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: f
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "k8s=true" >> "$GITHUB_OUTPUT"
            echo "manifest=true" >> "$GITHUB_OUTPUT"
            echo "nodejoin=true" >> "$GITHUB_OUTPUT"
            echo "cluster=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > /tmp/changed
          hit() { if grep -qE "$1" /tmp/changed; then echo true; else echo false; fi }
          {
            echo "api=$(hit '^(apps/api/|packages/api-client/openapi\.json$|pyrightconfig\.json$|\.python-version$|\.github/workflows/ci\.yml$)')"
            echo "frontend=$(hit '^(apps/web/|apps/admin/|packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$|eslint\.config\.mjs$|\.prettierrc$|\.prettierignore$|scripts/check-cjk\.sh$|scripts/check-copy-banned\.sh$|scripts/check-csp-hash\.sh$|scripts/check-page-skeleton\.py$|deploy/app/security-headers-web-csp\.conf$|\.github/workflows/ci\.yml$)')"
            echo "e2e=$(hit '^(apps/|packages/|e2e/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$|\.python-version$|\.github/workflows/ci\.yml$)')"
            echo "k8s=$(hit '^(apps/api/|deploy/|\.python-version$|\.github/workflows/ci\.yml$|\.github/kind-config\.yaml$)')"
            echo "manifest=$(hit '^(deploy/app/k8s/|scripts/check-gateway-manifests\.py$|\.github/workflows/ci\.yml$)')"
            echo "nodejoin=$(hit '^(deploy/node-join/|apps/api/app/modules/nodes/assets/node-join\.sh$|\.github/workflows/ci\.yml$)')"
            echo "cluster=$(hit '^(deploy/cluster/|\.github/workflows/ci\.yml$)')"
          } >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not real_k8s" -n auto
      - name: alembic check (migrations match models)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
          uv run alembic upgrade head
          uv run alembic check
        env:
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
      - name: openapi.json is up to date
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code ../../packages/api-client/openapi.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: python3 scripts/check-page-skeleton.py
      - run: pnpm typecheck
      - run: pnpm i18n
      - run: pnpm test
      - run: pnpm csp-check
      - run: pnpm api-client
      - name: orval output has no diff
        run: git diff --exit-code packages/api-client
      - run: pnpm build

  node-join-script:
    needs: changes
    if: needs.changes.outputs.nodejoin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install shellcheck + bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats
      - run: bash -n apps/api/app/modules/nodes/assets/node-join.sh
      - run: shellcheck apps/api/app/modules/nodes/assets/node-join.sh
      - run: bats deploy/node-join/tests

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check-docs-links.py
      - run: bash scripts/check-cjk.sh --scope repo

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: pip-audit (API production dependency vulnerabilities)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --format requirements-txt -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt --progress-spinner off
      - name: pnpm audit (frontend production dependencies, HIGH+ blocks)
        run: pnpm audit --prod --audit-level=high
      - name: gitleaks (secret leak scan over the full commit history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git /repo --config /repo/.github/gitleaks.toml --verbose \
            --log-opts="--full-history --diff-filter=tuxdb HEAD"

  k8s-real-smoke:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2
        with:
          config: .github/kind-config.yaml
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - name: Install the Gateway API CRDs
        run: bash deploy/cluster/gateway-api-crds.sh
      - name: Apply the production RBAC and statically assert each SA's verb surface
        run: |
          kubectl create namespace superdl
          kubectl apply -f deploy/app/k8s/01-rbac.yaml

          need() {
            local sa="system:serviceaccount:superdl:$1"; shift
            if ! kubectl auth can-i --as="$sa" "$@" > /dev/null; then
              echo "::error::$1 lacks verbs: $* (01-rbac.yaml drifted from the code)"
              exit 1
            fi
          }
          deny() {
            local sa="system:serviceaccount:superdl:$1"; shift
            if kubectl auth can-i --as="$sa" "$@" > /dev/null; then
              echo "::error::$1 is allowed verbs beyond its scope: $*"
              exit 1
            fi
          }

          for pair in "patch namespaces" "patch networkpolicies" "patch resourcequotas" \
                      "get limitranges" "create limitranges" "patch limitranges" \
                      "patch services" "get rolebindings" "create rolebindings" \
                      "patch rolebindings" "delete rolebindings" "delete roles" \
                      "bind clusterroles/superdl-tenant-secrets"; do
            # shellcheck disable=SC2086
            need superdl-tenant-mgr $pair
          done
          for pair in "delete namespaces" "patch nodes" "delete nodes" "list secrets" "get secrets" \
                      "create roles" "patch roles" "escalate roles" "bind roles" \
                      "escalate clusterroles" "bind clusterroles" \
                      "bind clusterroles/cluster-admin" "bind clusterroles/superdl-tenant-mgr"; do
            # shellcheck disable=SC2086
            deny superdl-tenant-mgr $pair
          done

          need superdl-api get pods --subresource=log
          for sa in superdl-worker superdl-tenant-mgr superdl-node-mgr superdl-prewarm superdl-disk-ops; do
            deny "$sa" get pods --subresource=log
          done
          for sa in superdl-api superdl-worker superdl-tenant-mgr superdl-node-mgr superdl-prewarm superdl-disk-ops; do
            deny "$sa" create pods --subresource=exec
          done

          deny_subject() {
            local subject="$1"; shift
            if kubectl auth can-i --as="$subject" "$@" > /dev/null; then
              echo "::error::$subject unexpectedly holds: $* (01-rbac.yaml must not give monitoring SAs any secrets read access)"
              exit 1
            fi
          }
          for sa in alloy loki kube-prometheus-stack-operator kube-prometheus-stack-prometheus; do
            deny_subject "system:serviceaccount:monitoring:$sa" get secrets -n superdl
            deny_subject "system:serviceaccount:monitoring:$sa" list secrets --all-namespaces
          done

          for pair in "get nodes" "list nodes" "patch nodes" "delete nodes"; do
            # shellcheck disable=SC2086
            need superdl-node-mgr $pair
          done
          for pair in "create nodes" "list secrets" "get secrets" "create pods" \
                      "create namespaces" "escalate roles" "bind roles" \
                      "escalate clusterroles" "bind clusterroles"; do
            # shellcheck disable=SC2086
            deny superdl-node-mgr $pair
          done

          for pair in "get persistentvolumeclaims" "create persistentvolumeclaims" \
                      "patch persistentvolumeclaims" "delete persistentvolumeclaims"; do
            # shellcheck disable=SC2086
            need superdl-disk-ops $pair
          done
          for pair in "create jobs.batch" "delete jobs.batch" "create pods" \
                      "get secrets" "list secrets" "get persistentvolumes"; do
            # shellcheck disable=SC2086
            deny superdl-disk-ops $pair
          done

          for sa in superdl-api superdl-worker superdl-tenant-mgr superdl-prewarm superdl-disk-ops; do
            deny "$sa" delete nodes
            deny "$sa" patch nodes
          done
      - name: "Admission policies: platform SAs cannot read superdl-auth/superdl-crypto"
        run: |
          kubectl apply -f deploy/cluster/admission/tenant-restrictions.yaml
          for b in superdl-platform-sa-scope superdl-tenant-pod-baseline superdl-node-field-scope \
                   superdl-global-pod-guard superdl-platform-pod-secret-scope \
                   superdl-platform-job-secret-scope superdl-node-delete-scope; do
            if ! kubectl get validatingadmissionpolicy "$b" > /dev/null 2>&1; then
              echo "::error::ValidatingAdmissionPolicy $b not accepted by the apiserver (CEL error?) = the policy is silently ineffective"
              exit 1
            fi
            kubectl get validatingadmissionpolicybinding "$b" > /dev/null
          done

          cat > /tmp/probe-leak-auth.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: leak-auth, namespace: superdl}
          spec:
            containers:
              - name: c
                image: busybox:1.36
                command: ["sleep", "1"]
                env:
                  - name: LEAK
                    valueFrom: {secretKeyRef: {name: superdl-auth, key: SUPERDL_JWT_SECRET}}
          EOF
          enforced=""
          for i in $(seq 1 30); do
            out=$(kubectl --as=system:serviceaccount:superdl:superdl-tenant-mgr \
              create --dry-run=server -f /tmp/probe-leak-auth.yaml 2>&1) || true
            case "$out" in
              *ValidatingAdmissionPolicy*) enforced=1; break ;;
            esac
            sleep 1
          done
          if [ -z "$enforced" ]; then
            echo "::error::the admission chain still does not refuse the probe Pod after 30s: ${out}"
            exit 1
          fi
          echo "  ✓ admission chain effective (probe $i)"

          deny_check() {
            local what="$1" as="$2" out
            if out=$(kubectl --as="$as" create --dry-run=server -f - 2>&1); then
              echo "::error::${what} was allowed (as=${as}): the platform master key can be read"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *ValidatingAdmissionPolicy*) echo "  ✓ denied: ${what}" ;;
              *) echo "::error::${what} was refused but not by the admission policy (as=${as}): ${out}"; exit 1 ;;
            esac
          }
          allow_check() {
            local what="$1" as="$2" out
            if ! out=$(kubectl --as="$as" create --dry-run=server -f - 2>&1); then
              echo "::error::${what} was wrongly refused (as=${as}): ${out}"
              exit 1
            fi
            echo "  ✓ allowed: ${what}"
          }

          deny_check "tenant-mgr creates a Pod reading the JWT signing key from superdl-auth" \
            system:serviceaccount:superdl:superdl-tenant-mgr < /tmp/probe-leak-auth.yaml
          deny_check "prewarm creates a Job injecting superdl-auth whole" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: leak-auth-prewarm, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: c
                    image: busybox:1.36
                    command: ["sleep", "1"]
                    envFrom:
                      - secretRef: {name: superdl-auth}
          EOF
          deny_check "prewarm creates a Job mounting superdl-crypto as a volume" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: leak-crypto-prewarm, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                volumes:
                  - {name: s, secret: {secretName: superdl-crypto}}
                containers:
                  - name: c
                    image: busybox:1.36
                    command: ["sleep", "1"]
                    volumeMounts: [{name: s, mountPath: /s}]
          EOF
          deny_check "job-controller creates a Pod injecting superdl-auth whole" \
            system:serviceaccount:kube-system:job-controller <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: leak-auth-jobc, namespace: superdl}
          spec:
            containers:
              - name: c
                image: busybox:1.36
                command: ["sleep", "1"]
                envFrom:
                  - secretRef: {name: superdl-auth}
          EOF

          allow_check "prewarm Job references the superdl-registry-pull pull credential" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: prewarm-ok, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                imagePullSecrets: [{name: superdl-registry-pull}]
                containers:
                  - name: prewarm
                    image: busybox:1.36
                    command: ["sleep", "1"]
          EOF
          deny_check "prewarm creates a Job template setting serviceAccountName (Pods created by platform SAs carry no SA identity)" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: prewarm-sa, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                serviceAccountName: superdl-prewarm
                automountServiceAccountToken: false
                imagePullSecrets: [{name: superdl-registry-pull}]
                containers:
                  - name: prewarm
                    image: busybox:1.36
                    command: ["sleep", "1"]
          EOF
          allow_check "migration Job Pod injects superdl-db-migrate whole" \
            system:serviceaccount:kube-system:job-controller <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: migrate-ok, namespace: superdl}
          spec:
            containers:
              - name: migrate
                image: busybox:1.36
                command: ["sleep", "1"]
                envFrom:
                  - secretRef: {name: superdl-db-migrate}
          EOF

          deny_delete() {
            local what="$1" as="$2" node="$3" out
            if out=$(kubectl --as="$as" delete node "$node" --dry-run=server 2>&1); then
              echo "::error::${what} was allowed (as=${as}): ${out}"
              exit 1
            fi
            case "$out" in
              *ValidatingAdmissionPolicy*) echo "  ✓ denied: ${what}" ;;
              *) echo "::error::${what} was refused but not by the admission policy (as=${as}): ${out}"; exit 1 ;;
            esac
          }
          NODE_MGR=system:serviceaccount:superdl:superdl-node-mgr
          CP_NODE=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o name | head -1)
          deny_delete "node-mgr deletes a control-plane node" "$NODE_MGR" "${CP_NODE#node/}"
          kubectl create -f - <<'EOF'
          apiVersion: v1
          kind: Node
          metadata:
            name: vap-probe-infra
            labels: {node-restriction.kubernetes.io/superdl-infra: "true"}
          EOF
          kubectl create -f - <<'EOF'
          apiVersion: v1
          kind: Node
          metadata:
            name: vap-probe-gpu
            labels: {node-restriction.kubernetes.io/superdl-pool: hami}
          EOF
          deny_delete "node-mgr deletes a node with the infra placement label" "$NODE_MGR" vap-probe-infra
          if ! out=$(kubectl --as="$NODE_MGR" delete node vap-probe-gpu --dry-run=server 2>&1); then
            echo "::error::node-mgr decommissioning a GPU worker node was wrongly refused: ${out}"
            exit 1
          fi
          echo "  ✓ allowed: node-mgr decommissions a GPU worker node"
          kubectl delete node vap-probe-infra vap-probe-gpu
      - name: "Admission policies: every platform-generated object is admitted (dry-run)"
        working-directory: apps/api
        run: |
          uv sync --frozen
          kubectl create namespace tenant-probe
          kubectl label namespace tenant-probe superdl.io/managed=true \
            pod-security.kubernetes.io/enforce=baseline pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/warn=restricted
          kubectl label namespace superdl pod-security.kubernetes.io/enforce=restricted --overwrite
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata: {name: nvidia}
          handler: runc
          ---
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata: {name: kata-qemu}
          handler: runc
          EOF
          uv run python scripts/render_admission_probes.py /tmp/admission-probes
          fail=0
          for f in /tmp/admission-probes/*.yaml; do
            as_user="$(cat "${f%.yaml}.as")"
            if out=$(kubectl create --dry-run=server -f "$f" ${as_user:+--as="$as_user"} 2>&1); then
              echo "  ✓ admitted: $(basename "$f" .yaml)"
            else
              echo "::error::platform-generated object refused by admission: $(basename "$f" .yaml) (--as=${as_user:-<admin>}): ${out}"
              fail=1
            fi
          done
          kubectl delete namespace tenant-probe --wait=false
          exit "$fail"
      - name: Delete the admission policies
        run: kubectl delete -f deploy/cluster/admission/tenant-restrictions.yaml
      - name: Preset the data disk StorageClass and static PVs (kind has no Rook/CephFS; expansion needs a bound PVC and an SC that allows it)
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata: {name: superdl-cephfs}
          provisioner: kubernetes.io/no-provisioner
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          EOF
          for i in 1 2 3 4; do
            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata: {name: smoke-data-$i}
          spec:
            storageClassName: superdl-cephfs
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            hostPath: {path: /tmp/smoke-data-$i}
          EOF
          done
      - name: Generate the restricted superdl-tenant-mgr kubeconfig
        run: |
          TOKEN=$(kubectl create token superdl-tenant-mgr -n superdl --duration=1h)
          admin_kubeconfig="${KUBECONFIG:-$HOME/.kube/config}"
          cp "$admin_kubeconfig" /tmp/restricted.kubeconfig
          kubectl config set-credentials tenant-mgr --token="$TOKEN" --kubeconfig=/tmp/restricted.kubeconfig
          kubectl config set-context --current --user=tenant-mgr --kubeconfig=/tmp/restricted.kubeconfig
          echo "SUPERDL_TEST_KUBECONFIG=$admin_kubeconfig" >> "$GITHUB_ENV"
      - name: RealOrchestrator smoke (kind)
        working-directory: apps/api
        env:
          SUPERDL_TEST_KUBECONFIG_RESTRICTED: /tmp/restricted.kubeconfig
        run: |
          uv sync --frozen
          uv run pytest tests/test_k8s_real_smoke.py -v
          uv run pytest -m real_k8s tests/test_orchestrator_conformance.py -v

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
          prune-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
      - name: Migrate + seed + start API/worker
        working-directory: apps/api
        env:
          SUPERDL_ENVIRONMENT: dev
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
          SUPERDL_SEED_ADMIN_PASSWORD: admin123-dev
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed_dev.py
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup uv run python -m app.workers.main > /tmp/worker.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Playwright smoke
        env:
          SUPERDL_ADMIN_E2E: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superdl/e2e exec playwright install --with-deps chromium
          pnpm --filter @superdl/e2e test:e2e
      - name: Dump logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log

  monitoring-rbac:
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cluster
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - name: helm-render the monitoring stack (alloy / loki / kube-prometheus-stack, once for full and once for light)
        run: |
          set -euo pipefail
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          ver() { grep -A6 -E "^  - name: $1\$" helmfile.yaml.gotmpl | sed -nE 's/^ *version: "([^"]+)".*/\1/p' | head -1; }
          mkdir -p /tmp/render
          helm template alloy grafana/alloy --version "$(ver alloy)" -n monitoring \
            -f values/alloy.yaml > /tmp/render/alloy.yaml
          helm template loki grafana-community/loki --version "$(ver loki)" -n monitoring \
            -f values/loki.yaml > /tmp/render/loki-full.yaml
          helm template loki grafana-community/loki --version "$(ver loki)" -n monitoring \
            -f values/loki.yaml -f values/light/loki-light.yaml > /tmp/render/loki-light.yaml
          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "$(ver kube-prometheus-stack)" -n monitoring \
            -f values/kps.yaml > /tmp/render/kps-full.yaml
          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "$(ver kube-prometheus-stack)" -n monitoring \
            -f values/kps.yaml -f values/light/kps-light.yaml > /tmp/render/kps-light.yaml
      - name: "Assert: the monitoring stack has no secrets read access (never in a ClusterRole; Roles only in monitoring; verbs * nowhere)"
        env:
          # Grafana is full tier only; its dashboard/datasource sidecars need configmaps/secrets read: the only exemption
          ALLOW_CLUSTERROLES: kube-prometheus-stack-grafana-clusterrole
        run: |
          uv run --with pyyaml python3 - /tmp/render/*.yaml monitoring-rbac.yaml <<'EOF'
          import os
          import sys

          import yaml

          READ = {"get", "list", "watch", "*"}
          allow = set(os.environ.get("ALLOW_CLUSTERROLES", "").split())

          def secret_rule(rule):
              groups = rule.get("apiGroups") or []
              res = rule.get("resources") or []
              return any(g in ("", "*") for g in groups) and any(r in ("secrets", "*") for r in res)

          errors = []
          seen_bindings = set()
          chart_operator_role = False
          for path in sys.argv[1:]:
              with open(path) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]
              for d in docs:
                  kind, meta = d.get("kind"), d.get("metadata") or {}
                  name, ns = meta.get("name", "?"), meta.get("namespace")
                  where = f"{os.path.basename(path)} {kind}/{name}" + (f" (ns={ns})" if ns else "")
                  if kind in ("ClusterRoleBinding", "RoleBinding"):
                      seen_bindings.add((kind, name))
                  if kind == "ClusterRole" and name == "kube-prometheus-stack-operator":
                      chart_operator_role = True
                  if kind not in ("ClusterRole", "Role"):
                      continue
                  for rule in d.get("rules") or []:
                      if not secret_rule(rule):
                          continue
                      verbs = set(rule.get("verbs") or [])
                      if "*" in verbs:
                          errors.append(f"{where} grants verbs * on secrets: {rule}")
                      elif not verbs & READ:
                          continue
                      elif kind == "ClusterRole" and name not in allow:
                          errors.append(f"{where} cluster-wide secrets read access: {rule}")
                      elif kind == "Role" and ns != "monitoring":
                          errors.append(f"{where} grants secrets read access outside monitoring: {rule}")
          if chart_operator_role:
              errors.append("the chart still renders the ClusterRole kube-prometheus-stack-operator: global.rbac.create=false in values/kps.yaml is ineffective")
          for required in (("ClusterRoleBinding", "superdl-prometheus-operator"),
                           ("ClusterRoleBinding", "superdl-prometheus"),
                           ("RoleBinding", "superdl-prometheus-operator")):
              if required not in seen_bindings:
                  errors.append(f"monitoring-rbac.yaml lacks {required[0]} {required[1]}")
          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print("monitoring stack RBAC assertion passed")
          EOF

  k8s-manifest-validate:
    needs: changes
    if: needs.changes.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: kubeconform(deploy/app/k8s)
        run: |
          docker run --rm -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -skip Certificate,ClusterIssuer,ServiceMonitor,PodMonitor,Kustomization,GatewayClass,Gateway,HTTPRoute,HTTPRouteFilter,EnvoyProxy,SecurityPolicy,BackendTrafficPolicy,ClientTrafficPolicy \
            -ignore-filename-pattern '10-migrate-job' \
            -summary /work/deploy/app/k8s
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - name: Gateway manifest CRD schema validation
        run: uv run --with pyyaml --with jsonschema python3 scripts/check-gateway-manifests.py
