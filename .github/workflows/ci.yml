name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml 以 workflow_call 复用本流水线作发布闸门
  workflow_call:

# Settings() 必填(app/core/config.py),workflow 级统一配。须为非 prod(/api/v1/webhooks/mock 只在非 prod 注册,已在 openapi.json 里)
env:
  SUPERDL_ENVIRONMENT: dev

# 顶层只读基线;需要写权限的 job 单独声明
permissions:
  contents: read

jobs:
  # 改动面探测:重 job 按需跑;workflow_call(发布闸门)、PR、push 基线不可用时一律全量
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      frontend: ${{ steps.f.outputs.frontend }}
      e2e: ${{ steps.f.outputs.e2e }}
      k8s: ${{ steps.f.outputs.k8s }}
      manifest: ${{ steps.f.outputs.manifest }}
      nodejoin: ${{ steps.f.outputs.nodejoin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "k8s=true" >> "$GITHUB_OUTPUT"
            echo "manifest=true" >> "$GITHUB_OUTPUT"
            echo "nodejoin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > /tmp/changed
          hit() { if grep -qE "$1" /tmp/changed; then echo true; else echo false; fi }
          {
            echo "api=$(hit '^(apps/api/|packages/api-client/openapi\.json$|pyrightconfig\.json$|\.python-version$|\.github/workflows/ci\.yml$)')"
            echo "frontend=$(hit '^(apps/web/|apps/admin/|packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$|eslint\.config\.mjs$|\.prettierrc$|\.prettierignore$|scripts/check-cjk\.sh$|scripts/check-copy-banned\.sh$|scripts/check-csp-hash\.sh$|deploy/app/security-headers-web-csp\.conf$|\.github/workflows/ci\.yml$)')"
            echo "e2e=$(hit '^(apps/|packages/|e2e/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$|\.python-version$|\.github/workflows/ci\.yml$)')"
            echo "k8s=$(hit '^(apps/api/|deploy/|\.python-version$|\.github/workflows/ci\.yml$)')"
            echo "manifest=$(hit '^(deploy/app/k8s/|scripts/check-gateway-manifests\.py$|\.github/workflows/ci\.yml$)')"
            echo "nodejoin=$(hit '^(deploy/node-join/|apps/api/app/modules/nodes/assets/node-join\.sh$|\.github/workflows/ci\.yml$)')"
          } >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # pytest 挂死时由 job 级超时兜底
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      # real_k8s 用例归 k8s-real-smoke job
      - run: uv run pytest -m "not real_k8s"
      # 模型与迁移一致性:upgrade head 后 alembic check
      - name: alembic check (migrations match models)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
          uv run alembic upgrade head
          uv run alembic check
        env:
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
      - name: openapi.json is up to date
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code ../../packages/api-client/openapi.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n
      - run: pnpm test
      # index.html 内联脚本 hash 与 CSP 的 sha256 一致
      - run: pnpm csp-check
      # orval 生成物与入库 openapi.json 一致(openapi.json 新鲜度由 api job 的导出 diff 把关)
      - run: pnpm api-client
      - name: orval 生成物无 diff
        run: git diff --exit-code packages/api-client
      - run: pnpm build

  node-join-script:
    needs: changes
    if: needs.changes.outputs.nodejoin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck + bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats
      - run: bash -n apps/api/app/modules/nodes/assets/node-join.sh
      - run: shellcheck apps/api/app/modules/nodes/assets/node-join.sh
      - run: bats deploy/node-join/tests

  # 文档引用闸门:Markdown 相对链接与反引号仓库路径必须存在
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-docs-links.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pip-audit(API 生产依赖漏洞)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --format requirements-txt -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt --progress-spinner off
      - name: pnpm audit(前端生产依赖,HIGH+ 阻断)
        run: pnpm audit --prod --audit-level=high
      # 只扫当前工作树;行级放行见 .github/gitleaks.toml
      - name: gitleaks(secret 泄漏扫描)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            dir /repo --config /repo/.github/gitleaks.toml --verbose

  k8s-real-smoke:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # kind-action 不导出 KUBECONFIG,kind 默认写 ~/.kube/config(下方 fallback 指向它)
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      # 装 Gateway API CRD(HTTPRoute 所需),复用发布脚本;不装 Envoy Gateway 控制器
      - name: 装 Gateway API CRD
        run: bash deploy/cluster/gateway-api-crds.sh
      # RBAC 与代码对齐:apply 生产 RBAC → 静态断言动词面 → 用 superdl-tenant-mgr SA token 造受限 kubeconfig
      # 供 test_ensure_namespace_under_tenant_mgr_sa 使用
      - name: 应用生产 RBAC 并静态断言各 SA 动词面
        run: |
          kubectl create namespace superdl
          kubectl apply -f deploy/app/k8s/01-rbac.yaml

          need() {   # <SA 短名> <动词> <资源>… 必须有
            local sa="system:serviceaccount:superdl:$1"; shift
            if ! kubectl auth can-i --as="$sa" "$@" > /dev/null; then
              echo "::error::$1 缺动词:$* (01-rbac.yaml 与代码漂移)"
              exit 1
            fi
          }
          deny() {   # <SA 短名> <动词> <资源>… 必须没有
            local sa="system:serviceaccount:superdl:$1"; shift
            if kubectl auth can-i --as="$sa" "$@" > /dev/null; then
              echo "::error::$1 越权动词被放行了:$*"
              exit 1
            fi
          }

          # ── tenant-mgr:ensure_namespace 收敛路径的最小动词面(与 real.py 一一对应)
          for pair in "patch namespaces" "patch networkpolicies" "patch resourcequotas" \
                      "get limitranges" "create limitranges" "patch limitranges" \
                      "patch services" "create roles" "patch rolebindings" \
                      "escalate roles" "bind roles"; do
            # shellcheck disable=SC2086
            need superdl-tenant-mgr $pair
          done
          # 反向面:刻意不授的动词保持不授;escalate/bind 只开到命名空间级 roles
          for pair in "delete namespaces" "patch nodes" "delete nodes" "list secrets" \
                      "escalate clusterroles" "bind clusterroles"; do
            # shellcheck disable=SC2086
            deny superdl-tenant-mgr $pair
          done

          # ── node-mgr:cordon/uncordon + 巡检回写标签 + 节点退役(node.decommission)
          for pair in "get nodes" "list nodes" "patch nodes" "delete nodes"; do
            # shellcheck disable=SC2086
            need superdl-node-mgr $pair
          done
          # nodes 之外一律不许写
          for pair in "create nodes" "list secrets" "get secrets" "create pods" \
                      "create namespaces" "escalate roles" "bind roles" \
                      "escalate clusterroles" "bind clusterroles"; do
            # shellcheck disable=SC2086
            deny superdl-node-mgr $pair
          done

          # ── nodes:delete 只有 node-mgr;对象白名单由 VAP 策略⑦ 兜(下一个 step 断言)
          for sa in superdl-api superdl-worker superdl-tenant-mgr superdl-prewarm superdl-disk-ops; do
            deny "$sa" delete nodes
            deny "$sa" patch nodes
          done
      # 准入策略断言:以三个 SA 的身份 dry-run 建对象(pods:create / jobs:create 等价于 ns 内 secrets:get)。
      # step 结束即删策略,后续冒烟在裸 kind 上跑
      - name: 准入策略:平台 SA 读不到 superdl-auth/superdl-crypto
        run: |
          kubectl apply -f deploy/cluster/admission/tenant-restrictions.yaml
          # 逐条回读 Policy(CEL 写错时 apiserver 只拒 Policy、Binding 照建)
          for b in superdl-platform-sa-scope superdl-tenant-pod-baseline superdl-node-field-scope \
                   superdl-global-pod-guard superdl-platform-pod-secret-scope \
                   superdl-platform-job-secret-scope superdl-node-delete-scope; do
            if ! kubectl get validatingadmissionpolicy "$b" > /dev/null 2>&1; then
              echo "::error::ValidatingAdmissionPolicy $b 未被 apiserver 接受(CEL 写错?)= 该策略静默失效"
              exit 1
            fi
            kubectl get validatingadmissionpolicybinding "$b" > /dev/null
          done

          # 落库 ≠ 准入链生效(informer 异步同步,观测窗口 ~1s):探针轮询到被 VAP 拒绝再开始断言
          cat > /tmp/probe-leak-auth.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: leak-auth, namespace: superdl}
          spec:
            containers:
              - name: c
                image: busybox:1.36
                command: ["sleep", "1"]
                env:
                  - name: LEAK
                    valueFrom: {secretKeyRef: {name: superdl-auth, key: SUPERDL_JWT_SECRET}}
          EOF
          enforced=""
          for i in $(seq 1 30); do
            out=$(kubectl --as=system:serviceaccount:superdl:superdl-tenant-mgr \
              create --dry-run=server -f /tmp/probe-leak-auth.yaml 2>&1) || true
            case "$out" in
              *ValidatingAdmissionPolicy*) enforced=1; break ;;
            esac
            sleep 1
          done
          if [ -z "$enforced" ]; then
            echo "::error::30s 后准入链仍未拒绝探针 Pod:${out}"
            exit 1
          fi
          echo "  ✓ 准入链已生效(第 $i 次探测)"

          # server 端 dry-run:走完整准入链不落对象
          deny_check() { # <说明> <impersonate 身份> < 清单(stdin)
            local what="$1" as="$2" out
            if out=$(kubectl --as="$as" create --dry-run=server -f - 2>&1); then
              echo "::error::${what} 竟被放行(as=${as}):平台主密钥可被读出"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *ValidatingAdmissionPolicy*) echo "  ✓ 拒绝:${what}" ;;
              # RBAC 403 同样判红(测的不是准入层)
              *) echo "::error::${what} 被拒但原因不是准入策略(as=${as}):${out}"; exit 1 ;;
            esac
          }
          allow_check() { # <说明> <impersonate 身份> < 清单(stdin)
            local what="$1" as="$2" out
            if ! out=$(kubectl --as="$as" create --dry-run=server -f - 2>&1); then
              echo "::error::${what} 被误伤(as=${as}):${out}"
              exit 1
            fi
            echo "  ✓ 放行:${what}"
          }

          # ── 反向:三个持 create 动词的 SA 各按自己的路径试读 superdl-auth ──
          # tenant-mgr 持 pods:create(与上面生效轮询同一份探针清单)
          deny_check "tenant-mgr 建 Pod 取 superdl-auth 的 JWT 签发密钥" \
            system:serviceaccount:superdl:superdl-tenant-mgr < /tmp/probe-leak-auth.yaml
          # prewarm 持 batch/jobs:create
          deny_check "prewarm 建 Job 整份注入 superdl-auth" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: leak-auth-prewarm, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: c
                    image: busybox:1.36
                    command: ["sleep", "1"]
                    envFrom:
                      - secretRef: {name: superdl-auth}
          EOF
          # disk-ops 持 batch/jobs:create;走 Secret 卷
          deny_check "disk-ops 建 Job 把 superdl-crypto 挂成卷" \
            system:serviceaccount:superdl:superdl-disk-ops <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: leak-crypto-diskops, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                volumes:
                  - {name: s, secret: {secretName: superdl-crypto}}
                containers:
                  - name: c
                    image: busybox:1.36
                    command: ["sleep", "1"]
                    volumeMounts: [{name: s, mountPath: /s}]
          EOF
          # job-controller 建 Pod 的路径(策略⑤)
          deny_check "job-controller 建 Pod 整份注入 superdl-auth" \
            system:serviceaccount:kube-system:job-controller <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: leak-auth-jobc, namespace: superdl}
          spec:
            containers:
              - name: c
                image: busybox:1.36
                command: ["sleep", "1"]
                envFrom:
                  - secretRef: {name: superdl-auth}
          EOF

          # ── 正向:合法引用必须放行 ──
          allow_check "配额 Job 取 superdl-db 的 juicefs-metaurl" \
            system:serviceaccount:superdl:superdl-disk-ops <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: quota-ok, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: quota
                    image: busybox:1.36
                    command: ["sleep", "1"]
                    env:
                      - name: JUICEFS_METAURL
                        valueFrom: {secretKeyRef: {name: superdl-db, key: juicefs-metaurl}}
          EOF
          allow_check "预热 Job 引用 superdl-registry-pull 拉取凭据" \
            system:serviceaccount:superdl:superdl-prewarm <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: prewarm-ok, namespace: superdl}
          spec:
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets: [{name: superdl-registry-pull}]
                containers:
                  - name: prewarm
                    image: busybox:1.36
                    command: ["sleep", "1"]
          EOF
          # 迁移 Job / 备份 CronJob 的整份注入 superdl-db / superdl-pg-backup 必须放行
          allow_check "迁移 Job 的 Pod 整份注入 superdl-db" \
            system:serviceaccount:kube-system:job-controller <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: {name: migrate-ok, namespace: superdl}
          spec:
            containers:
              - name: migrate
                image: busybox:1.36
                command: ["sleep", "1"]
                envFrom:
                  - secretRef: {name: superdl-db}
          EOF

          # ── 策略⑦:nodes:delete 只能落在 GPU 工作节点上 ──
          deny_delete() { # <说明> <impersonate 身份> <node 名>
            local what="$1" as="$2" node="$3" out
            if out=$(kubectl --as="$as" delete node "$node" --dry-run=server 2>&1); then
              echo "::error::${what} 竟被放行(as=${as}):${out}"
              exit 1
            fi
            case "$out" in
              *ValidatingAdmissionPolicy*) echo "  ✓ 拒绝:${what}" ;;
              *) echo "::error::${what} 被拒但原因不是准入策略(as=${as}):${out}"; exit 1 ;;
            esac
          }
          NODE_MGR=system:serviceaccount:superdl:superdl-node-mgr
          # kind 控制面节点(带 node-role.kubernetes.io/control-plane)
          CP_NODE=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o name | head -1)
          deny_delete "node-mgr 删控制面节点" "$NODE_MGR" "${CP_NODE#node/}"
          # 两台探针节点:带 infra 标签(必须拒)/ 干净 GPU 工作节点(必须放行)
          kubectl create -f - <<'EOF'
          apiVersion: v1
          kind: Node
          metadata:
            name: vap-probe-infra
            labels: {node-restriction.kubernetes.io/superdl-infra: "true"}
          EOF
          kubectl create -f - <<'EOF'
          apiVersion: v1
          kind: Node
          metadata:
            name: vap-probe-gpu
            labels: {superdl.io/pool: hami}
          EOF
          deny_delete "node-mgr 删带 infra 落点标签的节点" "$NODE_MGR" vap-probe-infra
          if ! out=$(kubectl --as="$NODE_MGR" delete node vap-probe-gpu --dry-run=server 2>&1); then
            echo "::error::node-mgr 退役 GPU 工作节点被误伤:${out}"
            exit 1
          fi
          echo "  ✓ 放行:node-mgr 退役 GPU 工作节点"
          kubectl delete node vap-probe-infra vap-probe-gpu
      # 平台自己生成的对象必须全部能过自家准入:按 real.py 的构造器渲染租户实例五种形态、擦除/配额/预热 Job
      # 及其派生 Pod,以真实创建者身份 dry-run=server(策略仍在集群里)。挂了说明:平台会建出永远被拒的对象
      - name: 准入策略:平台生成对象全部可准入(dry-run)
        working-directory: apps/api
        run: |
          uv sync --frozen
          kubectl create namespace tenant-probe
          kubectl label namespace tenant-probe superdl.io/managed=true \
            pod-security.kubernetes.io/enforce=baseline pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/warn=restricted
          kubectl label namespace superdl pod-security.kubernetes.io/enforce=restricted --overwrite
          uv run python scripts/render_admission_probes.py /tmp/admission-probes
          fail=0
          for f in /tmp/admission-probes/*.yaml; do
            as_user="$(cat "${f%.yaml}.as")"
            if out=$(kubectl create --dry-run=server -f "$f" ${as_user:+--as="$as_user"} 2>&1); then
              echo "  ✓ 准入:$(basename "$f" .yaml)"
            else
              echo "::error::平台生成对象被准入拒绝:$(basename "$f" .yaml)(--as=${as_user:-<admin>}):${out}"
              fail=1
            fi
          done
          kubectl delete namespace tenant-probe --wait=false
          exit "$fail"
      # 后续冒烟在裸 kind 上跑(kind 无 userns,租户 Pod 的 hostUsers=false 起不来)
      - name: 删准入策略
        run: kubectl delete -f deploy/cluster/admission/tenant-restrictions.yaml
      - name: 生成 superdl-tenant-mgr 受限 kubeconfig
        run: |
          TOKEN=$(kubectl create token superdl-tenant-mgr -n superdl --duration=1h)
          admin_kubeconfig="${KUBECONFIG:-$HOME/.kube/config}"
          cp "$admin_kubeconfig" /tmp/restricted.kubeconfig
          kubectl config set-credentials tenant-mgr --token="$TOKEN" --kubeconfig=/tmp/restricted.kubeconfig
          kubectl config set-context --current --user=tenant-mgr --kubeconfig=/tmp/restricted.kubeconfig
          # workflow 的 env: 不展开 $HOME,路径在 shell 里展开后传下去
          echo "SUPERDL_TEST_KUBECONFIG=$admin_kubeconfig" >> "$GITHUB_ENV"
      - name: RealOrchestrator 冒烟(kind)
        working-directory: apps/api
        env:
          SUPERDL_TEST_KUBECONFIG_RESTRICTED: /tmp/restricted.kubeconfig
        run: |
          uv sync --frozen
          uv run pytest tests/test_k8s_real_smoke.py -v
          # 编排契约一致性套件 real 侧(-m real_k8s);fake 侧归 api job
          uv run pytest -m real_k8s tests/test_orchestrator_conformance.py -v

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
          # nohup 起的 API/worker 活到 job 结束,关掉 post 步的 uv cache prune
          prune-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=superdl -e POSTGRES_USER=superdl -e POSTGRES_DB=superdl -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U superdl; do sleep 1; done
      - name: Migrate + seed + start API/worker
        working-directory: apps/api
        env:
          SUPERDL_ENVIRONMENT: dev
          SUPERDL_DATABASE_URL: postgresql+asyncpg://superdl:superdl@localhost:5432/superdl
          # 固定 seed 管理员口令,与 e2e 默认对齐
          SUPERDL_SEED_ADMIN_PASSWORD: admin123-dev
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed_dev.py
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup uv run python -m app.workers.main > /tmp/worker.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Playwright smoke
        env:
          # 管理端冒烟(登录 → 强制绑定 TOTP → 进控制台);不设此变量即跳过
          SUPERDL_ADMIN_E2E: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superdl/e2e exec playwright install --with-deps chromium
          pnpm --filter @superdl/e2e test:e2e
      - name: Dump logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log

  # kubeconform:deploy/app/k8s 全部清单过 k8s OpenAPI schema
  k8s-manifest-validate:
    needs: changes
    if: needs.changes.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: kubeconform(deploy/app/k8s)
        run: |
          # -skip:CRD 类与 Kustomization 无内置 schema(网关对象由下一步按真实 CRD 校验);
          # -ignore-filename-pattern:10-migrate-job.yaml 的 name 含 CHANGE_TAG 占位
          docker run --rm -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -skip Certificate,ClusterIssuer,ServiceMonitor,PodMonitor,Kustomization,GatewayClass,Gateway,HTTPRoute,HTTPRouteFilter,EnvoyProxy,SecurityPolicy,BackendTrafficPolicy,ClientTrafficPolicy \
            -ignore-filename-pattern '10-migrate-job' \
            -summary /work/deploy/app/k8s
      # 04-gateway.yaml 按 helmfile 钉死那版 Envoy Gateway chart 的 CRD 校验
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: 网关清单 CRD schema 校验
        run: uv run --with pyyaml --with jsonschema python3 scripts/check-gateway-manifests.py
