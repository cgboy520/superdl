[extend]
useDefault = true

[[allowlists]]
description = "test_payment_signature:APIV3_KEY 是 32 位十六进制等差序列假密钥"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_payment_signature\.py''']
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "platform_config:hint 文案里的 PEM 头字样,文件只定义配置项校验规格"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/app/core/platform_config\.py''']
regexes = ['''含 -----BEGIN PRIVATE KEY-----''']

[[allowlists]]
description = "runbook 中 curl 示例的占位口令 <强口令>"
condition = "AND"
regexTarget = "line"
paths = ['''deploy/cluster/runbooks/image-prewarm\.md''']
regexes = ['''curl -u ops:.{0,2}<强口令>''']

[[allowlists]]
description = "账号用例改密/找回的入参口令,断言 200/422 用的字面量"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_account_auth\.py''']
regexes = ['''"(?:new_)?password": "(?:newpass|qwerty)123456"''']

[[allowlists]]
description = "prod 校验用例的 jwt_secret:64 位十六进制合法形态样本,只喂给 Settings"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_[a-z_]+\.py''']
regexes = ['''"jwt_secret": "[0-9a-f]{64}"''']

[[allowlists]]
description = "test_k8s_real_units:断言的是 Secret 对象名,不是密钥内容"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_k8s_real_units\.py''']
regexes = ['''secret_key_ref\.name == "jupyter-inst-1"''']

# 禁止将此 bcrypt 哈希用于真实账号。
[[rules]]
id = "superdl-leaked-registry-htpasswd"
description = "已泄漏的 registry htpasswd bcrypt hash"
regex = '''\$2y\$05\$0JWd7XLpA2WBKjaBnw4KqupCZERl2Yx3cg9giAruPDxz1km4OCfSW'''
[[rules.allowlists]]
description = "规则定义与拦截器自身"
paths = ['''\.github/gitleaks\.toml''', '''deploy/cluster/preflight\.sh''']
