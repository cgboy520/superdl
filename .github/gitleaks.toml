# Retired wording: the platform_config hint text once quoted a PEM header.
[[allowlists]]
description = "historical commits of the platform_config PEM header hint"
condition = "AND"
paths = ['''apps/api/app/core/platform_config\.py''']
commits = [
  "92521915a52d8562fed8ee6bfd7d2efbcf07712d",
  "1668ba5c89509d92efb1328c83ea7327c11ed47d",
  "bcba30c724c36af21b2169454c8e6c5de066cdee",
  "eab47256a185f5b0d8c1b71ef418ccc3f111b50d",
  "734ff4ac22e56e587f8250c4af86ae26fdd42f2c",
  "89e7e38feb2cdf30c4e180db828b8d894c33f313",
]

# The leaked hash already present in historical commits (retired, never reuse): allowed only in these SHAs; a new commit containing it is still caught
[[allowlists]]
description = "historical commits of superdl-leaked-registry-htpasswd"
condition = "AND"
regexTarget = "line"
commits = [
  "7a8316a1325b4a05de3742e3e079e6c1e7b20d9b",
  "91ae3b1364e047015e8b273a3ffefd7f48055edd",
  "eab47256a185f5b0d8c1b71ef418ccc3f111b50d",
  "bcba30c724c36af21b2169454c8e6c5de066cdee",
  "0bbf5403082957d771607458c3a94ed41e7253c2",
  "298593134d351607cc12b3ea62232c6dc9480e31",
]
regexes = ['''\$2y\$05\$0JWd7XLpA2WBKjaBnw4KqupCZERl2Yx3cg9giAruPDxz1km4OCfSW''']

# Never use this bcrypt hash for a real account.
[[rules]]
id = "superdl-leaked-registry-htpasswd"
description = "leaked registry htpasswd bcrypt hash"
regex = '''\$2y\$05\$0JWd7XLpA2WBKjaBnw4KqupCZERl2Yx3cg9giAruPDxz1km4OCfSW'''
[[rules.allowlists]]
description = "the rule definition and the interceptor itself"
paths = ['''\.github/gitleaks\.toml''', '''deploy/cluster/preflight\.sh''']
