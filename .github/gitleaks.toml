# CI scans the full history of the checked-out ref only (`--log-opts` in ci.yml).
# Fixtures that must look like secrets: allow by path + line regex.
# Wording retired from the tree but still in history: allow by commit + path, never by content.

[extend]
useDefault = true

[[allowlists]]
description = "test_payment_signature: APIV3_KEY is a fake 32-hex arithmetic sequence"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_payment_signature\.py''']
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "account test cases: password inputs of change / recovery flows, literals asserted as 200/422"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_account_auth\.py''']
regexes = ['''"(?:new_)?password": "(?:newpass|qwerty)123456"''']

[[allowlists]]
description = "prod validation test cases: jwt_secret as a well-formed 64-hex sample, fed only to Settings"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_[a-z_]+\.py''']
regexes = ['''"jwt_secret": "[0-9a-f]{64}"''']

[[allowlists]]
description = "test_k8s_real_units: the assertion is on the Secret object name, not key material"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_k8s_real_units\.py''']
regexes = ['''secret_key_ref\.name == "jupyter-inst-1"''']

[[allowlists]]
description = "Stripe test cases: fake sk_test / whsec literals for the fake SDK client and the webhook signer"
condition = "AND"
regexTarget = "line"
paths = ['''apps/api/tests/test_payment_(?:stripe|registry)\.py''']
regexes = ['''sk_test_0123456789abcdef''', '''whsec_(?:testsecret)?0123456789(?:abcdef)?''']

# Retired wording: the runbook curl example once carried a placeholder password in -u.
